name = "<project name>"
baseTemplatePath = "icm://Interactive/StandardPackage/BaseTemplates/LetterheadBaseTemplate.wfd"
#styleDefinitionPath = "icm://Interactive/StandardPackage/CompanyStyles/<project-name>Styles.wfd"
inputDataPath = "<path to input data>" # e.g. "<path to repository>/migration-examples/src/main/resources/exampleResources/docx"
interactiveTenant = "StandardPackage"
#defaultTargetFolder = ""
inspireOutput = "Designer" # "Evolve", "Interactive", "Designer"
#sourceBaseTemplatePath = "icm://<path to source base template>"
#defaultVariableStructure = "<variable structure id>"
#defaultLanguage = "en_us"
#selectedDocumentObjectsFile = "<path to file>" # e.g. "<path to repository>/migration-examples/document-objects/<project name>-document-objects"
#selectedDocumentObjects = []
#subProjectId = "<id>"

[paths]
#images = ""
#fonts = ""
#documents = ""
#attachments = ""

[context]
# Name of the table style applied to every parsed table. When omitted, tables
# keep only the formatting captured from the DOCX file.
#defaultTableStyleName = "<table style name>"

# Authoring conventions that should be parsed as variables in addition to native Word merge fields.
# ${...} and <<...>>
docxVariablePatterns = ['\$\{\s*([^}]+?)\s*}', '<<\s*([^>]+?)\s*>>']
