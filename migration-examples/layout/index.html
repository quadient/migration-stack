document.querySelectorAll("input[type='range']").forEach(input => {
    input.addEventListener("wheel", (e) => {
        e.preventDefault();
        const slider = /** @type {HTMLInputElement} */ (e.currentTarget);
        const min = slider.min === "" ? 0 : parseFloat(slider.min);
        const max = slider.max === "" ? 100 : parseFloat(slider.max);
        const step = slider.step === "" || slider.step === "any" ? 1 : parseFloat(slider.step);
        const current = parseFloat(slider.value);
        const direction = e.deltaY < 0 ? 1 : -1;
        const next = Math.min(max, Math.max(min, current + direction * step));
        slider.value = String(roundTo(next, sliderStepDecimals(slider)));
        slider.dispatchEvent(new Event("input", {bubbles: true}));
    }, {passive: false});
});

/**
 * @param {LayoutData} data
 */
function render(data) {
    const dataChanged = currentData !== data;
    currentAnalysis = ensureAnalysis(data, currentAnalysis);
    currentData = data;
    currentViewModel = buildViewModel(data, currentAnalysis, settings);
    uiState = reconcileUiState(uiState, currentViewModel, dataChanged);
    decisions = reconcileDecisions(decisions, currentViewModel, dataChanged);
    currentAreaDrafts = effectiveAreaDrafts(data, currentAnalysis, decisions);
    currentBaseTemplates = buildBaseTemplates(data, currentViewModel, currentAreaDrafts, decisions);
    currentBasePageByPage = indexBasePagesByPage(currentBaseTemplates);

    document.getElementById("app").hidden = false;
    renderTemplateGroups(data);
    reopenPageGroups(uiState.openPageGroups);
}

/**
 * @param {AreaEntry} ar
 * @param {number} idx
 * @returns {string}
 */
function areaTip(ar, idx) {
    const name = areaLabel(ar) || `area_${idx}`;
    return `${name}\nw ${ar.w}mm · h ${ar.h}mm · x ${ar.x}mm · y ${ar.y}mm`
        + (ar.flowToNextPage ? " · [↓]" : "")
        + (ar.interactiveFlowName ? ` · flow:${ar.interactiveFlowName}` : "");
}

/**
 * Draws a page: its areas and, as red frames, the base areas of its base page (on the
 * representative they are made from its own areas, on other pages they are laid over them).
 * @param {PageEntry} page
 * @param {BaseAreaModel[]} baseAreas
 * @param {(number|null)[]} baseAreaByArea index of the base area each area of the page maps to
 * @param {boolean} isRepresentative the page defines its base page's areas
 * @param {Set<number>} selectedAreas indices of the selected areas, drawn highlighted
 * @param {((areaIndex: number|null, additive: boolean) => void)|null} onAreaClick called with null
 *   for clicks outside areas; null when the areas cannot be selected
 * @returns {SVGElement|null}
 */
function buildPageSvg(page, baseAreas, baseAreaByArea, isRepresentative, selectedAreas, onAreaClick) {
    const areas = page.areas;
    if (!areas.length) return null;

    const maxX2 = Math.max(...areas.map(a => a.x + a.w), ...baseAreas.map(b => b.position.x + b.position.w));
    const maxY2 = Math.max(...areas.map(a => a.y + a.h), ...baseAreas.map(b => b.position.y + b.position.h));
    const scale = (settings.canvasW - 2 * PAD) / Math.max(maxX2, 210);
    const svgH = Math.ceil(maxY2 * scale + 2 * PAD);
    const svg = svgEl("svg", {width: settings.canvasW, height: svgH, class: "page-svg" + (onAreaClick ? " selectable" : "")});
    svg.appendChild(svgTitle(pageCardTooltip(page)));
    if (onAreaClick) {
        // Clicks on an area select it; clicks anywhere else on the drawing clear the selection.
        svg.addEventListener("click", e => {
            const target = /** @type {Element} */ (e.target);
            const areaIndex = target.getAttribute("data-area-index");
            onAreaClick(areaIndex == null ? null : Number(areaIndex), e.ctrlKey || e.metaKey || e.shiftKey);
        });
    }

    /** @param {number} baseIndex */
    const baseAreaTip = baseIndex => {
        const {flowName, position: p} = baseAreas[baseIndex];
        return `Base area ${flowName}\nw ${p.w}mm · h ${p.h}mm · x ${p.x}mm · y ${p.y}mm`;
    };

    /** @param {number|null|undefined} baseIndex */
    const baseAreaColor = baseIndex => baseIndex == null ? NO_BASE_AREA_COLOR : BASE_AREA_COLORS[baseIndex % BASE_AREA_COLORS.length];

    baseAreas.forEach((baseArea, baseIndex) => {
        const p = baseArea.position;
        const color = baseAreaColor(baseIndex);
        // The frame stands a little outside the areas, so it does not coincide with their borders;
        // towards a neighbouring base area it stands at most halfway, so the two frames do not cross.
        const gap = frameGaps(baseAreas, baseIndex, scale);
        const gx = svgPos(p.x, scale) - gap.left, gy = svgPos(p.y, scale) - gap.top,
            gw = svgDim(p.w, scale) + gap.left + gap.right, gh = svgDim(p.h, scale) + gap.top + gap.bottom;

        const bg = svgEl("rect", {
            x: gx, y: gy, width: gw, height: gh,
            fill: "transparent", stroke: "none", "pointer-events": "all"
        });
        bg.appendChild(svgTitle(baseAreaTip(baseIndex)));
        svg.appendChild(bg);

        const border = svgEl("rect", {
            x: gx, y: gy, width: gw, height: gh, rx: 3,
            fill: "none", stroke: color, "stroke-width": 1.3, "stroke-dasharray": "5,3",
            "pointer-events": "none"
        });
        svg.appendChild(border);

        // The label goes above the frame; when another base area is right above, there is no room
        // there, so it goes inside the frame's top-right corner (the area's own label is top-left).
        const labelInside = gap.top < FRAME_GAP;
        const label = svgEl("text", {
            x: labelInside ? gx + gw - 3 : gx + 2, y: labelInside ? gy + 9 : gy - 2,
            "text-anchor": labelInside ? "end" : "start",
            "font-size": 7, fill: color, "font-weight": "bold", "pointer-events": "none"
        });
        label.textContent = baseArea.flowName.length > 28 ? baseArea.flowName.slice(0, 28) : baseArea.flowName;
        svg.appendChild(label);
    });

    // Larger areas first, so smaller (often overlapping or nested) areas stay on top and clickable.
    const drawOrder = areas.map((_, i) => i).sort((m, n) => (areas[n].w * areas[n].h) - (areas[m].w * areas[m].h));
    drawOrder.forEach(i => {
        const a = areas[i];
        const color = baseAreaColor(baseAreaByArea[i]);
        const isSelected = selectedAreas.has(i);
        const isRoot = a.containedIn == null;
        const rx = svgPos(a.x, scale), ry = svgPos(a.y, scale),
            rw = svgDim(a.w, scale), rh = svgDim(a.h, scale);

        const overlapping = areas
            .map((o, oi) => ({o, oi}))
            .filter(({o, oi}) => oi !== i
                && o.x < a.x + a.w && o.x + o.w > a.x
                && o.y < a.y + a.h && o.y + o.h > a.y)
            .sort((m, n) => (m.o.w * m.o.h) - (n.o.w * n.o.h));

        const baseIndex = baseAreaByArea[i];
        const baseLine = baseIndex != null ? (isRepresentative ? "" : "Goes to: ") + baseAreaTip(baseIndex) + "\n\n" : "";
        const tip = baseLine + [areaTip(a, i), ...overlapping.map(({o, oi}) => areaTip(o, oi))].join("\n\n");

        const rect = svgEl("rect", {
            x: rx, y: ry, width: rw, height: rh,
            fill: color, "fill-opacity": "0.25", stroke: color,
            "stroke-width": isRoot ? "1.2" : "1",
            "stroke-dasharray": isRoot ? "none" : "3,2",
            class: "area-rect",
            "data-area-index": i,
        });
        rect.appendChild(svgTitle(tip + (onAreaClick ? "\n\nClick to select, Ctrl/Shift+click to add to or remove from the selection." : "")));
        svg.appendChild(rect);
        if (isSelected) drawSelectionMark(svg, rx, ry, rw, rh);

        if (rw > 12 && rh > 8) {
            const name = areaLabel(a) || `area_${i}`;
            const txt = svgEl("text", {x: rx + 2, y: ry + 9, "font-size": 6.5, fill: "#222", "pointer-events": "none"});
            txt.textContent = name.length > 28 ? name.slice(-28) : name;
            svg.appendChild(txt);
        }
    });

    return svg;
}

/**
 * How far (px) a base area's frame stands outside its areas on each side: FRAME_GAP, but at most
 * half the distance to a neighbouring base area on that side, so adjacent frames meet instead of
 * crossing. Base areas that overlap the frame's area do not limit it.
 * @param {BaseAreaModel[]} baseAreas
 * @param {number} baseIndex
 * @param {number} scale px per mm
 * @returns {{top: number, right: number, bottom: number, left: number}}
 */
function frameGaps(baseAreas, baseIndex, scale) {
    const gap = {top: FRAME_GAP, right: FRAME_GAP, bottom: FRAME_GAP, left: FRAME_GAP};
    const a = baseAreas[baseIndex].position;
    baseAreas.forEach((other, otherIndex) => {
        if (otherIndex === baseIndex) return;
        const b = other.position;
        const overlapsX = b.x < a.x + a.w && b.x + b.w > a.x;
        const overlapsY = b.y < a.y + a.h && b.y + b.h > a.y;
        if (overlapsX && overlapsY) return;
        /** @param {number} distanceMm */
        const half = distanceMm => Math.max(0, distanceMm * scale / 2);
        if (overlapsX && b.y + b.h <= a.y) gap.top = Math.min(gap.top, half(a.y - (b.y + b.h)));
        if (overlapsX && b.y >= a.y + a.h) gap.bottom = Math.min(gap.bottom, half(b.y - (a.y + a.h)));
        if (overlapsY && b.x + b.w <= a.x) gap.left = Math.min(gap.left, half(a.x - (b.x + b.w)));
        if (overlapsY && b.x >= a.x + a.w) gap.right = Math.min(gap.right, half(b.x - (a.x + a.w)));
    });
    return gap;
}

/**
 * Marks a selected area: a blue halo just outside its border and a check badge in its bottom-right
 * corner. The area keeps its own colors, so it stays recognizable.
 * @param {SVGElement} svg
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 */
function drawSelectionMark(svg, x, y, w, h) {
    const color = "#2f7de1";
    svg.appendChild(svgEl("rect", {
        x: x - 2, y: y - 2, width: w + 4, height: h + 4, rx: 3,
        fill: "none", stroke: color, "stroke-width": 2, "pointer-events": "none",
    }));
    const cx = x + w - 5, cy = y + h - 5;
    svg.appendChild(svgEl("circle", {cx, cy, r: 4.5, fill: color, stroke: "#fff", "stroke-width": 1, "pointer-events": "none"}));
    svg.appendChild(svgEl("path", {
        d: `M ${cx - 2.2} ${cy} L ${cx - 0.6} ${cy + 1.6} L ${cx + 2.2} ${cy - 1.6}`,
        fill: "none", stroke: "#fff", "stroke-width": 1.3, "stroke-linecap": "round", "stroke-linejoin": "round",
        "pointer-events": "none",
    }));
}

/**
 * @param {LayoutData} data
 */
function renderTemplateGroups(data) {
    if (!currentViewModel) return;
    const {templateGroups} = currentViewModel;
    const groupsEl = /** @type {HTMLElement} */ (document.getElementById("template-groups"));
    groupsEl.innerHTML = "";

    templateGroups.forEach((group, groupIndex) => {
        const li = document.createElement("li");
        li.dataset.groupKey = group.key;
        li.innerHTML = renderTemplateGroupItem(group, groupIndex, data);

        li.querySelectorAll(".page-group").forEach((pgEl, ci) => {
            /** @type {HTMLElement} */ (pgEl).dataset.pageGroupKey = group.pageGroups[ci].key;
        });
        groupsEl.appendChild(li);
    });
}

/**
 * @param {TemplateGroup} group
 * @returns {string}
 */
function renderTemplateBadges(group) {
    return group.templateIds.map((id, idx) => `<span class="template-tag" data-template-id="${htmlEsc(id)}">${htmlEsc(group.templateNames[idx] ?? id)}</span>`).join("");
}

/**
 * A base template or base page name. All names are derived for now (from the representative
 * pages), so they are shown as proposals; `source` says where the name comes from.
 * @param {string} name
 * @param {string} source
 * @param {string} className
 * @returns {string}
 */
function renderDerivedName(name, source, className) {
    return `<span class="${className} derived" title="${htmlEsc(`Proposed name, derived from ${source}`)}">${htmlEsc(name)}</span>`;
}

/**
 * Hint on a template group: the most similar other group, i.e. the one it would merge with
 * first when the threshold is lowered.
 * @param {number} groupIndex
 * @returns {string}
 */
function renderClosestGroupHint(groupIndex) {
    if (!currentViewModel) return "";
    const closest = closestOtherTemplateGroup(currentViewModel, groupIndex);
    if (!closest) return "";
    const title = "Average similarity of this group's templates to the templates of the most similar other group. "
        + "Groups merge when it reaches the threshold (with the average strategy).";
    const name = currentBaseTemplates[closest.groupIndex]?.name ?? "";
    return `<span class="hint" title="${htmlEsc(title)}">closest: ${htmlEsc(name)} (${closest.score.toFixed(2)})</span>`;
}

/**
 * @param {ViewModel} viewModel
 * @param {number} groupIndex
 * @returns {{groupIndex: number, score: number}|null}
 */
function closestOtherTemplateGroup(viewModel, groupIndex) {
    const {templateLevel, templateGroups} = viewModel;
    /** @type {Map<string, number>} */
    const indexById = new Map(templateLevel.templates.map((t, i) => [t.templateId, i]));
    /** @param {TemplateGroup} group */
    const indicesOf = group => group.templateIds.map(id => /** @type {number} */ (indexById.get(id)));
    const own = indicesOf(templateGroups[groupIndex]);

    /** @type {{groupIndex: number, score: number}|null} */
    let best = null;
    templateGroups.forEach((other, otherIndex) => {
        if (otherIndex === groupIndex) return;
        const others = indicesOf(other);
        let sum = 0;
        own.forEach(a => others.forEach(b => { sum += templateLevel.matrix[a][b]; }));
        const score = sum / (own.length * others.length);
        if (!best || score > best.score) best = {groupIndex: otherIndex, score};
    });
    return best;
}

/**
 * Similarity of a page to the representative page of its base page, or null for the
 * representative itself.
 * @param {number} pageIndex
 * @returns {number|null}
 */
function similarityToRepresentative(pageIndex) {
    const basePage = currentBasePageByPage.get(pageIndex)?.basePage;
    if (!basePage || !currentViewModel || basePage.representativePageIndex === pageIndex) return null;
    return currentViewModel.pageLevel.matrix[pageIndex][basePage.representativePageIndex];
}

/**
 * @param {number} pageIndex
 * @returns {string}
 */
function renderSimilarityHint(pageIndex) {
    const score = similarityToRepresentative(pageIndex);
    if (score == null) return "";
    return `<span class="hint" title="Similarity to the representative page">${score.toFixed(2)}</span>`;
}

/**
 * @param {PageGroup} pageGroup
 * @param {LayoutData} data
 * @returns {string}
 */
function renderPageGroupRow(pageGroup, data) {
    const {pageLevel} = /** @type {ViewModel} */ (currentViewModel);
    const cohesion = minPairScore(pageGroup.pageIndices, pageLevel.matrix);
    const cohesionTitle = cohesion !== null ? `Cohesion (least similar pair): ${cohesion.toFixed(2)}` : "Single page";
    const basePage = currentBasePageByPage.get(pageGroup.pageIndices[0])?.basePage;
    const nameHtml = basePage
        ? renderDerivedName(basePage.name, `the representative page ${pageName(data.pages[basePage.representativePageIndex])}`, "pg-name")
        : "";
    return `<div class="page-group">`
        + `<div class="pg-row" data-action="toggle-preview">`
        + `<span class="pg-expand-icon">&#9654;</span>`
        + `<span class="pg-head">${nameHtml}`
        + `<span class="pg-cohesion" title="${cohesionTitle}"><span class="cohesion-dot ${cohesionClass(cohesion)}"></span>`
        + (cohesion !== null ? `<span class="hint">${cohesion.toFixed(2)}</span>` : "")
        + `</span></span>`
        + `<span class="page-labels">${pageGroup.pageIndices.map(pi =>
            `<span class="page-tag" data-template-id="${htmlEsc(data.pages[pi].templateId ?? "")}" title="${htmlEsc(pageTagTooltip(data.pages[pi]))}">`
            + `${representativeMark(pi)}${htmlEsc(pageTagLabel(data.pages[pi]))} ${renderSimilarityHint(pi)}</span>`
        ).join("")}</span>`
        + `</div>`
        + `<div class="pg-cards"></div>`
        + `</div>`;
}

/**
 * The page name, prefixed with its template name when the page name does not already contain
 * it, so every page can be told apart and traced to its template.
 * @param {PageEntry} page
 * @returns {string}
 */
function pageTagLabel(page) {
    const name = pageName(page);
    const templateName = page.templateName ?? "";
    return !templateName || name.includes(templateName) ? name : `${templateName} › ${name}`;
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageTagTooltip(page) {
    return `Template: ${page.templateName ?? "none (orphan page)"}
Page: ${pageName(page)}`;
}

/**
 * A star before the page tag of the representative page of its base page.
 * @param {number} pageIndex
 * @returns {string}
 */
function representativeMark(pageIndex) {
    const basePage = currentBasePageByPage.get(pageIndex)?.basePage;
    if (!basePage || basePage.representativePageIndex !== pageIndex) return "";
    const how = basePage.representativeIsManual ? "chosen manually" : "most similar to the others";
    return `<span class="rep-mark" title="Representative page (${how})">★</span>`;
}

/**
 * @param {TemplateGroup} group
 * @param {number} groupIndex
 * @param {LayoutData} data
 * @returns {string}
 */
function renderTemplateGroupItem(group, groupIndex, data) {
    const pageGroupsHtml = group.pageGroups
        .map(pageGroup => renderPageGroupRow(pageGroup, data))
        .join("");
    const baseTemplate = currentBaseTemplates[groupIndex];
    const firstRepresentative = baseTemplate?.pages[0] ? data.pages[baseTemplate.pages[0].representativePageIndex] : null;
    const source = firstRepresentative
        ? `the template of the first page's representative (${firstRepresentative.templateName ?? pageName(firstRepresentative)})`
        : "the first template of the group";
    return `<div class="tg-header">`
        + `<div class="tg-title">`
        + (baseTemplate ? renderDerivedName(baseTemplate.name, source, "tg-name") : "")
        + `<span class="tg-templates" title="Templates of this base template">${renderTemplateBadges(group)}</span>`
        + `${renderClosestGroupHint(groupIndex)}`
        + `</div>`
        + `</div>`
        + `<div class="page-groups">${pageGroupsHtml}</div>`;
}

/**
 * The representative control of a page card. It lives in the card header, apart from the page
 * drawing, which is reserved for working with areas.
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 * @returns {HTMLButtonElement}
 */
function buildRepresentativeButton(basePage, pageIndex) {
    const isRepresentative = basePage.representativePageIndex === pageIndex;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "rep-btn" + (isRepresentative ? " active" : "");
    button.textContent = isRepresentative ? "★" : "☆";
    if (isRepresentative && basePage.representativeIsManual) {
        button.classList.add("manual");
        button.title = "Representative page, chosen manually: its areas define the base page.\nClick to go back to the computed representative.";
    } else if (isRepresentative) {
        button.title = "Representative page: its areas define the base page.\nComputed as the page most similar to the others.\n"
            + "Click to keep it as the representative even when the computation changes.";
    } else {
        button.title = "Make this page the representative: its areas will define the base page.";
    }
    button.addEventListener("click", () => setRepresentative(basePage, pageIndex));
    return button;
}

/**
 * @param {number} pageIndex
 * @returns {HTMLElement}
 */
function buildPageCard(pageIndex) {
    const page = currentData.pages[pageIndex];
    const wrap = document.createElement("div");
    wrap.className = "page-card";
    wrap.dataset.pageIndex = String(pageIndex);
    // The card is as wide as its drawing; the header shortens the page name to fit.
    wrap.style.width = `${settings.canvasW + 2}px`;

    const header = document.createElement("div");
    header.className = "page-card-title";
    const title = document.createElement("span");
    title.className = "page-card-name";
    title.title = pageCardTooltip(page);
    title.appendChild(document.createTextNode(pageName(page)));
    header.appendChild(title);

    const base = currentBasePageByPage.get(pageIndex);
    const isRepresentative = base?.basePage.representativePageIndex === pageIndex;
    if (base) {
        const score = similarityToRepresentative(pageIndex);
        if (score != null) {
            const hint = document.createElement("span");
            hint.className = "hint";
            hint.title = "Similarity to the representative page";
            hint.textContent = score.toFixed(2);
            header.appendChild(hint);
        }
        header.appendChild(buildRepresentativeButton(base.basePage, pageIndex));
        if (isRepresentative) wrap.classList.add("representative");
    }
    wrap.appendChild(header);

    // Only the representative's areas can be merged or split: its area groups define the base
    // areas, the other pages' areas just go to the base area they lie in.
    const selectedAreas = isRepresentative && uiState.areaSelection?.pageIndex === pageIndex
        ? uiState.areaSelection.areaIndices
        : new Set();
    const svg = buildPageSvg(
        page,
        base?.basePage.areas ?? [],
        base?.basePage.baseAreaByArea.get(pageIndex) ?? [],
        isRepresentative,
        selectedAreas,
        isRepresentative ? (areaIndex, additive) => selectArea(pageIndex, areaIndex, additive) : null,
    );
    if (svg) wrap.appendChild(svg);
    wrap.appendChild(isRepresentative ? buildAreaActions(pageIndex, selectedAreas) : buildFollowerFooter());
    return wrap;
}

/**
 * Footer of a page that is not the representative: its areas cannot be edited, they go to the
 * base area they lie in. Same height as the representative's action bar, so cards line up.
 * @returns {HTMLElement}
 */
function buildFollowerFooter() {
    const footer = document.createElement("div");
    footer.className = "card-footer";
    const info = document.createElement("span");
    info.className = "hint";
    info.textContent = "Areas follow the ★ page";
    info.title = "Each area goes to the base area (red frame) it lies in. Merge and split areas on the representative page.";
    footer.appendChild(info);
    return footer;
}

/**
 * The merge/split bar of the representative page card. Always shown with the same buttons, which
 * are enabled when they apply, so selecting areas does not move anything.
 * @param {number} pageIndex
 * @param {Set<number>} selectedAreas
 * @returns {HTMLElement}
 */
function buildAreaActions(pageIndex, selectedAreas) {
    const page = currentData.pages[pageIndex];
    const isEdited = decisions.areaGroupsByPage.has(renderUnitKey(page, pageIndex));

    const bar = document.createElement("div");
    bar.className = "card-footer";
    const {canMerge, canSplit} = describeAreaSelection(currentAreaDrafts[pageIndex] ?? [], selectedAreas);

    /**
     * @param {string} label
     * @param {string} title
     * @param {boolean} enabled
     * @param {() => void} onClick
     */
    const addButton = (label, title, enabled, onClick) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.title = title;
        button.disabled = !enabled;
        button.addEventListener("click", onClick);
        bar.appendChild(button);
    };

    const info = document.createElement("span");
    info.className = "hint";
    info.textContent = selectedAreas.size ? `${selectedAreas.size} selected` : isEdited ? "edited" : "select areas";
    info.title = "Click an area to select it, Ctrl/Shift+click to select more, then merge or split them. Click outside the areas or press Esc to clear the selection.";
    bar.appendChild(info);

    addButton("Merge", "Join the selected areas (with the rest of their base areas) into one base area.\nSelect areas of at least two base areas.",
        canMerge, () => editAreaGroups(pageIndex, "merge"));
    addButton("Split", "Give each selected area a base area of its own.\nSelect an area that shares its base area with others.",
        canSplit, () => editAreaGroups(pageIndex, "split"));
    addButton("Reset", "Discard the merges and splits of this page and use the computed grouping again.",
        isEdited, () => resetAreaGroups(pageIndex));
    return bar;
}

/**
 * Updates the area selection after a click on a page drawing: a plain click selects only that
 * area (or clears the selection when it was the only one selected), a Ctrl/Shift click adds the
 * area to the selection or removes it, a click outside areas clears the selection. Selecting on
 * another page starts a new selection.
 * @param {number} pageIndex
 * @param {number|null} areaIndex
 * @param {boolean} additive
 */
function selectArea(pageIndex, areaIndex, additive) {
    const current = uiState.areaSelection?.pageIndex === pageIndex ? uiState.areaSelection.areaIndices : new Set();
    /** @type {Set<number>} */
    let next;
    if (areaIndex == null) {
        next = new Set();
    } else if (additive) {
        next = new Set(current);
        if (next.has(areaIndex)) next.delete(areaIndex); else next.add(areaIndex);
    } else {
        next = current.size === 1 && current.has(areaIndex) ? new Set() : new Set([areaIndex]);
    }
    const hadSelection = uiState.areaSelection != null;
    uiState.areaSelection = next.size ? {pageIndex, areaIndices: next} : null;
    if (hadSelection || uiState.areaSelection) refreshOpenPageGroups();
}

document.addEventListener("keydown", e => {
    if (e.key === "Escape" && uiState.areaSelection) {
        uiState.areaSelection = null;
        refreshOpenPageGroups();
    }
});

// Event delegation for page-group toggle
document.getElementById("template-groups").addEventListener("click", (e) => {
    const target = /** @type {HTMLElement} */ (e.target);
    const row = /** @type {HTMLElement|null} */ (target.closest("[data-action='toggle-preview']"));
    if (!row) return;
    togglePageCards(row);
});

/**
 * @param {HTMLElement} rowEl
 */
function togglePageCards(rowEl) {
    const pageGroupEl = /** @type {HTMLElement} */ (rowEl.closest(".page-group"));
    const preview = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-cards"));
    setPageGroupOpen(pageGroupEl, !preview.classList.contains("open"));
}

/**
 * Populates a .pg-cards container with page card elements.
 * @param {HTMLElement} preview
 * @param {number[]} indices
 */
function buildPageCards(preview, indices) {
    preview.innerHTML = "";
    indices.forEach(pi => {
        preview.appendChild(buildPageCard(pi));
    });
}

/**
 * @param {Set<string>} keys
 * @returns {void}
 */
function reopenPageGroups(keys) {
    document.querySelectorAll(".page-group").forEach(pgEl => {
        const groupEl = /** @type {HTMLElement} */ (pgEl);
        const key = groupEl.dataset.pageGroupKey ?? "";
        if (!keys.has(key)) return;
        if (!groupEl.querySelector(".pg-cards.open")) setPageGroupOpen(groupEl, true);
    });
}

/**
 * @param {HTMLElement} pageGroupEl
 * @returns {number[]}
 */
function pageGroupIndices(pageGroupEl) {
    if (!currentViewModel) return [];
    const key = pageGroupEl.dataset.pageGroupKey ?? "";
    return currentViewModel.pageGroupByKey[key]?.pageIndices ?? [];
}

/**
 * @returns {void}
 */
function refreshOpenPageGroups() {
    uiState.openPageGroups.forEach(key => refreshOpenPageCardsByKey(key));
}

/**
 * @param {string} key
 * @returns {void}
 */
function refreshOpenPageCardsByKey(key) {
    if (!currentViewModel) return;
    const indices = currentViewModel.pageGroupByKey[key]?.pageIndices;
    if (!indices) return;
    document.querySelectorAll(".page-group").forEach(pgEl => {
        const groupEl = /** @type {HTMLElement} */ (pgEl);
        if ((groupEl.dataset.pageGroupKey ?? "") !== key) return;
        const preview = /** @type {HTMLElement|null} */ (groupEl.querySelector(".pg-cards.open"));
        if (preview) buildPageCards(preview, indices);
    });
}

/**
 * @param {HTMLElement} pageGroupEl
 * @param {boolean} open
 * @returns {void}
 */
function setPageGroupOpen(pageGroupEl, open) {
    const preview = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-cards"));
    const icon = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-expand-icon"));
    const key = pageGroupEl.dataset.pageGroupKey ?? "";
    const indices = pageGroupIndices(pageGroupEl);

    preview.classList.toggle("open", open);
    if (open) uiState.openPageGroups.add(key);
    else uiState.openPageGroups.delete(key);
    icon.textContent = open ? "▼" : "▶";

    if (open) buildPageCards(preview, indices);
}

/**
 * @param {LayoutData} data
 * @param {LayoutAnalysis|null} previousAnalysis
 * @returns {LayoutAnalysis}
 */
function ensureAnalysis(data, previousAnalysis) {
    if (currentData === data && previousAnalysis != null) return previousAnalysis;
    return {
        similarity: buildSimilarity(data),
        pageBaseTemplateAreaDrafts: buildBaseTemplateAreaDrafts(data.pages, PROXIMITY_GAP_MM),
    };
}

/**
 * @param {LayoutData} data
 * @param {LayoutAnalysis} analysis
 * @param {Settings} activeSettings
 * @returns {ViewModel}
 */
function buildViewModel(data, analysis, activeSettings) {
    const {templateLevel, pageLevel} = analysis.similarity;
    const templateGroups = computeTemplateGroups(data, templateLevel, pageLevel.matrix, activeSettings);
    /** @type {Record<string, PageGroup>} */
    const pageGroupByKey = {};
    const pageGroupKeys = new Set();

    templateGroups.forEach(group => {
        group.pageGroups.forEach(pageGroup => {
            pageGroupKeys.add(pageGroup.key);
            pageGroupByKey[pageGroup.key] = pageGroup;
        });
    });

    return {templateLevel, pageLevel, templateGroups, pageGroupByKey, pageGroupKeys};
}

/**
 * @param {UiState} previousState
 * @param {ViewModel} viewModel
 * @param {boolean} dataChanged
 * @returns {UiState}
 */
function reconcileUiState(previousState, viewModel, dataChanged) {
    if (dataChanged) return {openPageGroups: new Set(), areaSelection: null};
    return {
        openPageGroups: new Set(
            [...previousState.openPageGroups].filter(key => viewModel.pageGroupKeys.has(key))
        ),
        areaSelection: previousState.areaSelection,
    };
}

/** @returns {Decisions} */
function emptyDecisions() {
    return {representativeByPageGroup: new Map(), areaGroupsByPage: new Map()};
}

/**
 * Area drafts of every page: the user's area groups where the page has them, otherwise the
 * computed proximity grouping.
 * @param {LayoutData} data
 * @param {LayoutAnalysis} analysis
 * @param {Decisions} decisions
 * @returns {BaseTemplateAreaDraft[][]}
 */
function effectiveAreaDrafts(data, analysis, decisions) {
    return data.pages.map((page, pageIndex) => {
        const manual = decisions.areaGroupsByPage.get(renderUnitKey(page, pageIndex));
        return manual ? draftsFromAreaGroups(page.areas, manual) : (analysis.pageBaseTemplateAreaDrafts[pageIndex] ?? []);
    });
}

/**
 * Merges the drafts that contain any of the selected areas into one draft.
 * @param {number[][]} areaGroups
 * @param {Set<number>} selected
 * @returns {number[][]}
 */
function mergeAreaGroups(areaGroups, selected) {
    const touched = areaGroups.filter(group => group.some(areaIndex => selected.has(areaIndex)));
    const untouched = areaGroups.filter(group => !touched.includes(group));
    return [...untouched, touched.flat()];
}

/**
 * Takes the selected areas out of their drafts, each into a draft of its own.
 * @param {number[][]} areaGroups
 * @param {Set<number>} selected
 * @returns {number[][]}
 */
function splitAreaGroups(areaGroups, selected) {
    const remaining = areaGroups
        .map(group => group.filter(areaIndex => !selected.has(areaIndex)))
        .filter(group => group.length);
    return [...remaining, ...[...selected].map(areaIndex => [areaIndex])];
}

/**
 * What merge and split would do with the selection: merging needs areas of at least two drafts,
 * splitting needs a selected area that shares its draft with another area.
 * @param {BaseTemplateAreaDraft[]} drafts
 * @param {Set<number>} selected
 * @returns {{canMerge: boolean, canSplit: boolean}}
 */
function describeAreaSelection(drafts, selected) {
    const touched = drafts.filter(draft => draft.areaIndices.some(areaIndex => selected.has(areaIndex)));
    return {
        canMerge: touched.length >= 2,
        canSplit: touched.some(draft => draft.areaIndices.length > 1),
    };
}

/**
 * Applies a merge or split of the selected areas of a page and stores the result as the page's
 * manual area groups. Every occurrence of the same page (shared by several templates) changes.
 * @param {number} pageIndex
 * @param {"merge"|"split"} operation
 */
function editAreaGroups(pageIndex, operation) {
    const selection = uiState.areaSelection;
    if (!currentData || !selection || selection.pageIndex !== pageIndex || !selection.areaIndices.size) return;
    const page = currentData.pages[pageIndex];
    const groups = (currentAreaDrafts[pageIndex] ?? []).map(draft => [...draft.areaIndices]);
    const edited = operation === "merge"
        ? mergeAreaGroups(groups, selection.areaIndices)
        : splitAreaGroups(groups, selection.areaIndices);
    decisions.areaGroupsByPage.set(renderUnitKey(page, pageIndex), edited);
    uiState.areaSelection = null;
    render(currentData);
}

/**
 * Drops the user's area groups of a page, so the computed grouping applies again.
 * @param {number} pageIndex
 */
function resetAreaGroups(pageIndex) {
    if (!currentData) return;
    decisions.areaGroupsByPage.delete(renderUnitKey(currentData.pages[pageIndex], pageIndex));
    uiState.areaSelection = null;
    render(currentData);
}

/**
 * Carries decisions over to the current grouping; all of them are dropped when other data was
 * loaded. A manually chosen representative stays the representative of whatever page group its
 * page ends up in (e.g. after a threshold change). When groups merge and several of their pages
 * were chosen, the earliest choice wins.
 * @param {Decisions} previous
 * @param {ViewModel} viewModel
 * @param {boolean} dataChanged
 * @returns {Decisions}
 */
function reconcileDecisions(previous, viewModel, dataChanged) {
    if (dataChanged) return emptyDecisions();

    /** @type {Map<number, string>} */
    const pageGroupKeyByPage = new Map();
    Object.values(viewModel.pageGroupByKey).forEach(pageGroup =>
        pageGroup.pageIndices.forEach(pageIndex => pageGroupKeyByPage.set(pageIndex, pageGroup.key)));

    /** @type {Map<string, number>} */
    const representativeByPageGroup = new Map();
    previous.representativeByPageGroup.forEach(pageIndex => {
        const key = pageGroupKeyByPage.get(pageIndex);
        if (key != null && !representativeByPageGroup.has(key)) representativeByPageGroup.set(key, pageIndex);
    });
    // Area groups belong to a page, not to a grouping, so they always carry over.
    return {representativeByPageGroup, areaGroupsByPage: previous.areaGroupsByPage};
}

/**
 * Makes the page the representative of its base page as a manual decision. This also works for
 * the computed representative, to keep it when the computation changes. Picking the current
 * manual representative again removes the decision, so the computed representative applies again.
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 */
function setRepresentative(basePage, pageIndex) {
    const manualPick = decisions.representativeByPageGroup.get(basePage.pageGroupKey);
    if (manualPick === pageIndex) {
        decisions.representativeByPageGroup.delete(basePage.pageGroupKey);
    } else {
        decisions.representativeByPageGroup.set(basePage.pageGroupKey, pageIndex);
    }
    if (currentData) render(currentData);
}

/**
 * @param {LayoutData} data
 * @returns {Similarity}
 */
function buildSimilarity(data) {
    const pageMatrix = buildSymmetricMatrix(data.pages.length, (i, j) => pageSimilarity(data.pages[i].areas, data.pages[j].areas));
    const templateLevel = {templates: data.templates, matrix: []};
    templateLevel.matrix = buildSymmetricMatrix(data.templates.length, (i, j) =>
        templateSimilarity(data.templates[i].pageIndices, data.templates[j].pageIndices, pageMatrix)
    );
    return {
        pageLevel: {matrix: pageMatrix},
        templateLevel,
    };
}

/**
 * @param {PageEntry[]} pages
 * @param {number} groupingGap
 * @returns {BaseTemplateAreaDraft[][]}
 */
function buildBaseTemplateAreaDrafts(pages, groupingGap) {
    return pages.map(page => groupByProximity(page.areas, groupingGap));
}

/**
 * @param {PageEntry[]} pages
 * @returns {TemplateEntry[]}
 */
function deriveTemplates(pages) {
    /** @type {Map<string, number[]>} */
    const templatePages = new Map();
    pages.forEach((page, pageIndex) => {
        const key = page.templateId ?? `orphan:${page.pageId}`;
        if (!templatePages.has(key)) templatePages.set(key, []);
        templatePages.get(key).push(pageIndex);
    });
    return [...templatePages.entries()].map(([key, pageIndices]) => {
        const sortedPageIndices = [...pageIndices].sort((a, b) => {
            const pageA = pages[a];
            const pageB = pages[b];
            return templatePageOrder(pageA) - templatePageOrder(pageB) || a - b;
        });
        const first = pages[sortedPageIndices[0]];
        const isOrphan = first.templateId == null;
        return {
            templateId: first.templateId ?? key,
            templateName: isOrphan
                ? `Orphan: ${first.pageName ?? first.pageId ?? "Unknown"}`
                : (first.templateName ?? first.templateId ?? key),
            pageIndices: sortedPageIndices,
        };
    });
}

/**
 * @param {number} size
 * @param {(i: number, j: number) => number} scoreFn
 * @returns {number[][]}
 */
function buildSymmetricMatrix(size, scoreFn) {
    /** @type {number[][]} */
    const matrix = [];
    for (let i = 0; i < size; i++) {
        matrix[i] = [];
        for (let j = 0; j < size; j++) {
            if (i === j) matrix[i][j] = 1;
            else if (j < i) matrix[i][j] = matrix[j][i];
            else matrix[i][j] = roundTo(scoreFn(i, j), 3);
        }
    }
    return matrix;
}

/**
 * @param {string[]} templateIds
 * @returns {string}
 */
function templateGroupKey(templateIds) {
    return `tmpl:${[...templateIds].sort().join("|")}`;
}

/**
 * @param {LayoutData} data
 * @param {number[]} pageIndices
 * @returns {string}
 */
function pageGroupKey(data, pageIndices) {
    return `pg:${pageIndices.map(i => renderUnitKey(data.pages[i], i)).sort().join("|")}`;
}

/**
 * @param {PageEntry} page
 * @param {number} pageIndex
 * @returns {string}
 */
function renderUnitKey(page, pageIndex) {
    if (page.pageId != null) return `page:${page.pageId}`;
    if (page.templateId != null) return `virtual:${page.templateId}:${pageIndex}`;
    return `index:${pageIndex}`;
}

/**
 * @param {PageEntry} page
 * @returns {number}
 */
function templatePageOrder(page) {
    return page.templatePageIndex ?? Number.MAX_SAFE_INTEGER;
}

/**
 * Automatic area grouping, a vertical sweep: areas whose Y ranges overlap or are within the
 * proximity gap of each other end up in the same base template area draft.
 * @param {AreaEntry[]} areas
 * @param {number} groupingGap
 * @returns {BaseTemplateAreaDraft[]}
 */
function groupByProximity(areas, groupingGap) {
    if (!areas.length) return [];
    const sortedIndices = areas.map((_, i) => i).sort((a, b) => areas[a].y - areas[b].y || areas[a].x - areas[b].x);
    /** @type {number[][]} */
    const groupedIndices = [];
    let current = [sortedIndices[0]];
    let curY2 = areas[sortedIndices[0]].y + areas[sortedIndices[0]].h;
    sortedIndices.slice(1).forEach(idx => {
        const area = areas[idx];
        if (area.y <= curY2 + groupingGap) {
            current.push(idx);
            curY2 = Math.max(curY2, area.y + area.h);
        } else {
            groupedIndices.push(current);
            current = [idx];
            curY2 = area.y + area.h;
        }
    });
    groupedIndices.push(current);
    return draftsFromAreaGroups(areas, groupedIndices);
}

/**
 * Builds area drafts from groups of area indices (computed or edited by the user), ordered top
 * to bottom, then left to right. Each draft spans the bounding box of its areas.
 * @param {AreaEntry[]} areas
 * @param {number[][]} areaGroups
 * @returns {BaseTemplateAreaDraft[]}
 */
function draftsFromAreaGroups(areas, areaGroups) {
    return areaGroups
        .filter(group => group.length)
        .map(group => [...group].sort((a, b) => a - b))
        .map(areaIndices => {
            const subset = areaIndices.map(index => areas[index]);
            const x = Math.min(...subset.map(area => area.x));
            const y = Math.min(...subset.map(area => area.y));
            return {areaIndices, x, y, x2: Math.max(...subset.map(area => area.x + area.w)), y2: Math.max(...subset.map(area => area.y + area.h))};
        })
        .sort((a, b) => a.y - b.y || a.x - b.x)
        .map(({areaIndices, x, y, x2, y2}, draftIndex) => {
            const areaName = areaIndices.map(idx => areas[idx].areaName).find(Boolean);
            const previewSource = areaIndices.map(idx => areas[idx].contentPreview).find(Boolean);
            return {
                areaIndices,
                position: {
                    x: roundTo(x, 2),
                    y: roundTo(y, 2),
                    w: roundTo(x2 - x, 2),
                    h: roundTo(y2 - y, 2),
                },
                name: areaName || parseFlowNameFromPreview(previewSource) || `Area ${draftIndex + 1}`,
                areaName: areaName || '',
            };
        });
}

/**
 * Compare two pages by greedy bipartite matching on area geometry.
 * Each area is described by (x, width) normalized to page reference width and
 * height with a log-ratio so a 3x difference scores about 1.0.
 * @param {AreaEntry[]} areasA
 * @param {AreaEntry[]} areasB
 * @param {number} [matchThreshold]
 * @returns {number}
 */
function pageSimilarity(areasA, areasB, matchThreshold = 0.5) {
    if (!areasA.length || !areasB.length) return 0;

    /** @type {{distance: number, indexA: number, indexB: number}[]} */
    const areaMatches = [];
    areasA.forEach((areaA, indexA) => {
        areasB.forEach((areaB, indexB) => {
            areaMatches.push({distance: geometryDistance(areaA, areaB, false), indexA, indexB});
        });
    });
    areaMatches.sort((a, b) => a.distance - b.distance);

    const matchedA = new Set();
    const matchedB = new Set();
    let total = 0;
    areaMatches.forEach(match => {
        if (matchedA.has(match.indexA) || matchedB.has(match.indexB)) return;
        matchedA.add(match.indexA);
        matchedB.add(match.indexB);
        total += Math.max(0, 1 - match.distance / matchThreshold);
    });
    const slots = Math.max(areasA.length, areasB.length);
    return slots > 0 ? total / slots : 0;
}

/**
 * Compare two templates by positional page matching (page 1<->1, page 2<->2, ...).
 * Unmatched pages contribute 0, penalizing different template lengths proportionally.
 * @param {number[]} pagesA
 * @param {number[]} pagesB
 * @param {number[][]} pageMatrix
 * @returns {number}
 */
function templateSimilarity(pagesA, pagesB, pageMatrix) {
    const maxLen = Math.max(pagesA.length, pagesB.length);
    if (maxLen === 0) return 0;
    let total = 0;
    for (let i = 0; i < Math.min(pagesA.length, pagesB.length); i++)
        total += pageMatrix[pagesA[i]]?.[pagesB[i]] ?? 0;
    return total / maxLen;
}

/**
 * @param {number} value
 * @param {number} decimals
 * @returns {number}
 */
function roundTo(value, decimals) {
    const factor = 10 ** decimals;
    return Math.round(value * factor) / factor;
}

/**
 * @param {HTMLInputElement} slider
 * @returns {number}
 */
function sliderStepDecimals(slider) {
    const step = slider.step;
    if (!step || step === "any") return 0;
    const dot = step.indexOf(".");
    return dot >= 0 ? step.length - dot - 1 : 0;
}

/**
 * @param {LayoutData} data
 * @param {TemplateLevel} templateLevel
 * @param {number[][]} pageMatrix
 * @param {Settings} activeSettings
 * @returns {TemplateGroup[]}
 */
function computeTemplateGroups(data, templateLevel, pageMatrix, activeSettings) {
    return groupPages(templateLevel.templates.map((_, i) => i), templateLevel.matrix, activeSettings)
        .map(templateIndices => ({
            key: templateGroupKey(templateIndices.map(i => templateLevel.templates[i].templateId)),
            templateIds: templateIndices.map(i => templateLevel.templates[i].templateId),
            templateNames: templateIndices.map(i => templateLevel.templates[i].templateName ?? templateLevel.templates[i].templateId),
            pageGroups: buildTemplatePageGroups(data, templateIndices, templateLevel, pageMatrix, activeSettings),
        }));
}

/**
 * @param {LayoutData} data
 * @param {number[]} templateIndices
 * @param {TemplateLevel} templateLevel
 * @param {number[][]} pageMatrix
 * @param {Settings} activeSettings
 * @returns {PageGroup[]}
 */
function buildTemplatePageGroups(data, templateIndices, templateLevel, pageMatrix, activeSettings) {
    const pageIndices = templateIndices
        .flatMap(templateIndex => templateLevel.templates[templateIndex].pageIndices)
        .sort((a, b) => a - b);
    return groupPages(pageIndices, pageMatrix, activeSettings)
        .map(pg => pg.sort((a, b) => a - b))
        .sort((a, b) => Math.min(...a) - Math.min(...b))
        .map(pg => ({key: pageGroupKey(data, pg), pageIndices: pg}));
}

/**
 * Agglomerative grouping that always merges the two most similar groups first, until no pair of
 * groups reaches the threshold. The similarity of two groups depends on the linkage strategy:
 * - single:   the best pair of members (loose)
 * - average:  the average of all member pairs (default)
 * - complete: the worst pair of members (strict)
 * The result does not depend on the order of `indices` except for ties, which go to the earlier
 * groups. Members and groups are returned in `indices` order.
 * @param {number[]} indices
 * @param {number[][]} matrix
 * @param {Settings} activeSettings
 * @returns {number[][]}
 */
function groupPages(indices, matrix, activeSettings) {
    const {groupStrategy, groupThreshold} = activeSettings;
    const count = indices.length;
    /** @type {(number[]|null)[]} */
    const groups = indices.map(i => [i]);
    // linkage[a][b]: similarity between groups a and b, updated in place when groups merge.
    const linkage = indices.map(a => Float64Array.from(indices, b => matrix[a]?.[b] ?? 0));

    for (;;) {
        let bestA = -1, bestB = -1, best = -Infinity;
        for (let a = 0; a < count; a++) {
            if (!groups[a]) continue;
            const row = linkage[a];
            for (let b = a + 1; b < count; b++) {
                if (groups[b] && row[b] > best) { best = row[b]; bestA = a; bestB = b; }
            }
        }
        if (bestA < 0 || best < groupThreshold) break;

        const groupA = /** @type {number[]} */ (groups[bestA]);
        const groupB = /** @type {number[]} */ (groups[bestB]);
        for (let k = 0; k < count; k++) {
            if (!groups[k] || k === bestA || k === bestB) continue;
            const scoreA = linkage[bestA][k], scoreB = linkage[bestB][k];
            const merged =
                groupStrategy === "single"   ? Math.max(scoreA, scoreB) :
                groupStrategy === "complete" ? Math.min(scoreA, scoreB) :
                (scoreA * groupA.length + scoreB * groupB.length) / (groupA.length + groupB.length);
            linkage[bestA][k] = merged;
            linkage[k][bestA] = merged;
        }
        groupA.push(...groupB);
        groups[bestB] = null;
    }

    const positionOf = new Map(indices.map((index, position) => [index, position]));
    /** @param {number} x @param {number} y */
    const byPosition = (x, y) => /** @type {number} */ (positionOf.get(x)) - /** @type {number} */ (positionOf.get(y));
    return /** @type {number[][]} */ (groups.filter(Boolean))
        .map(group => group.sort(byPosition))
        .sort((x, y) => byPosition(x[0], y[0]));
}

/**
 * @param {number[]} pageGroup
 * @param {number[][]} matrix
 * @returns {number|null}
 */
function minPairScore(pageGroup, matrix) {
    if (pageGroup.length < 2) return null;
    let min = 1;
    for (let i = 0; i < pageGroup.length; i++)
        for (let j = i + 1; j < pageGroup.length; j++)
            min = Math.min(min, matrix[pageGroup[i]]?.[pageGroup[j]] ?? 0);
    return min;
}

/**
 * @param {number|null} score
 * @returns {string}
 */
function cohesionClass(score) {
    if (score === null) return "cohesion-solo";
    if (score >= 0.75) return "cohesion-high";
    if (score >= 0.50) return "cohesion-mid";
    return "cohesion-low";
}

/**
 * @param {string} tag
 * @param {Record<string, string|number>} attrs
 * @returns {SVGElement}
 */
function svgEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, String(v)));
    return el;
}

/**
 * @param {string} text
 * @returns {SVGTitleElement}
 */
function svgTitle(text) {
    const title = /** @type {SVGTitleElement} */ (document.createElementNS("http://www.w3.org/2000/svg", "title"));
    title.textContent = text;
    return title;
}

/**
 * @param {number} mm
 * @param {number} scale
 * @returns {number}
 */
function svgPos(mm, scale) {
    return Math.round((mm * scale + PAD) * 10) / 10;
}

/**
 * @param {number} mm
 * @param {number} scale
 * @returns {number}
 */
function svgDim(mm, scale) {
    return Math.round(mm * scale * 10) / 10;
}

/**
 * Label for an area: its name when available, otherwise the first content preview chunk.
 * @param {AreaEntry} area
 * @returns {string}
 */
function areaLabel(area) {
    if (area.areaName) return area.areaName.slice(0, 40);
    const preview = area.contentPreview;
    if (!preview) return "";
    const firstChunk = preview.split(";")[0];
    return firstChunk.slice(0, 40);
}

/**
 * @param {string} s
 * @returns {string}
 */
function htmlEsc(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

/**
 * Makes a generated name valid for Inspire by replacing characters it does not allow in object
 * names (with surrounding whitespace) by "_", e.g. "Orphan: Page 1" -> "Orphan_Page 1", and
 * line breaks/tabs by a space. Extend INSPIRE_ILLEGAL_NAME_CHARS when more illegal characters are found.
 * @param {string} name
 * @returns {string}
 */
function inspireSafeName(name) {
    return name.replace(INSPIRE_ILLEGAL_NAME_CHARS, "_").replace(/\s+/g, " ").trim();
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageName(page) {
    return page.pageName ?? page.pageId ?? "Virtual page";
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageSizeLabel(page) {
    if (page.pageSize == null) return "default";
    return `${formatMm(page.pageSize.w)} x ${formatMm(page.pageSize.h)} mm`;
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageCardTooltip(page) {
    return `${pageName(page)}\npage size: ${pageSizeLabel(page)}`;
}

/**
 * @param {number} value
 * @returns {string}
 */
function formatMm(value) {
    return Number.isInteger(value) ? String(value) : String(roundTo(value, 2));
}
</script>
