        : bt.pages.some(page => page.pageGroupKey === inspected.key));
    if (inspected && baseTemplate) {
        if (inspected.kind === "template") renderTemplateInspector(baseTemplate);
        else renderPageInspector(baseTemplate, /** @type {BaseTemplatePageModel} */ (baseTemplate.pages.find(page => page.pageGroupKey === inspected.key)));
        return;
    }
}

/** @param {BaseTemplateModel} baseTemplate */
function renderTemplateInspector(baseTemplate) {
    inspectorEl.append(
        inspectorKind("Base template"),
        inspectorTextField("Name", {
            value: baseTemplate.nameDecision ? baseTemplate.name : "",
            proposed: baseTemplate.proposedName,
            edited: baseTemplate.nameSource === "edited",
            onChange: value => setBaseTemplateName(baseTemplate, value),
        }),
    );
}

/**
 * @param {BaseTemplateModel} baseTemplate
 * @param {BaseTemplatePageModel} basePage
 */
function renderPageInspector(baseTemplate, basePage) {
    inspectorEl.append(
        inspectorKind("Base page"),
        inspectorTextField("Name", {
            value: basePage.nameDecision ? basePage.name : "",
            proposed: basePage.proposedName,
            edited: basePage.nameSource === "edited",
            onChange: value => setBasePageName(basePage, value),
        }),
    );
}

/**
 * The base page of a page and the base areas its selected areas belong to.
 * @param {number} pageIndex
 * @param {Set<number>} selected
 * @returns {{base: {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}|undefined, areas: BaseAreaModel[]}}
 */
function baseAreasOfSelection(pageIndex, selected) {
    const base = currentBasePageByPage.get(pageIndex);
    const byArea = base?.basePage.baseAreaByArea.get(pageIndex);
    const indices = [...new Set([...selected].map(areaIndex => byArea?.[areaIndex]))].filter(index => index != null);
    return {base, areas: base ? indices.map(index => base.basePage.areas[/** @type {number} */ (index)]) : []};
}

/**
 * The base area of the selected areas. Editing needs areas of one base area; with several base
 * areas selected the fields are disabled.
 * @param {number} pageIndex
 * @param {Set<number>} selected
 */
function renderAreaInspector(pageIndex, selected) {
    const {base, areas} = baseAreasOfSelection(pageIndex, selected);
    if (!base || !areas.length) return;
    if (areas.length > 1) {
        // Several base areas: nothing to edit until the selection is one base area.
        inspectorEl.append(inspectorKind(`${areas.length} base areas`));
        return;
    }
    const area = areas[0];
    inspectorEl.append(
        inspectorKind("Base area"),
        inspectorTextField("Flow name", {
            value: area.flowNameSource === "edited" ? area.flowName : "",
            proposed: area.proposedFlowName,
            edited: area.flowNameSource === "edited",
            onChange: value => setFlowName(base.baseTemplate, base.basePage, area, value),
        }),
        inspectorTextField("Area name", {
            value: area.propertiesEdited.areaName ?? "",
            proposed: area.proposedAreaName || `${area.flowName}Area`,
            edited: area.propertiesEdited.areaName !== undefined,
            onChange: value => setAreaName(area, value),
        }),
        inspectorChecks([
            inspectorCheck("Flow to next page", area.flowToNextPage, area.propertiesEdited.flowToNextPage !== undefined,
                checked => setAreaProperty(area, "flowToNextPage", checked)),
            inspectorCheck("Dynamic height", area.dynamicHeight, area.propertiesEdited.dynamicHeight !== undefined,
                checked => setAreaProperty(area, "dynamicHeight", checked)),
        ]),
        inspectorPositionFields(area),
    );
}

// ─── 14. Drag and drop ───────────────────────────────────────────────────────────────────────────
//
// Moving templates and pages to other groups and reordering base pages; the moves are decisions
// (see Decisions). The listeners are in Event wiring, next to the one opening a dropped file.

/**
 * @param {HTMLElement|null} el
 * @param {string} className "drop-target", or "drop-before"/"drop-after" for an insertion line
 */
function setDropTarget(el, className = "drop-target") {
    dropTargetEl?.classList.remove("drop-target", "drop-before", "drop-after");
    dropTargetEl = el;
    el?.classList.add(className);
}

/**
 * @param {string} className
 * @param {string} text
 * @param {"li"|"div"} tag
 * @returns {HTMLElement}
 */
function createDropZone(className, text, tag) {
    const zone = document.createElement(tag);
    zone.className = "drop-zone " + className;
    zone.textContent = text;
    return zone;
}

/**
 * The element the dragged item would go to at this event, or null when it cannot be dropped here.
 * @param {DragEvent} e
 * @returns {HTMLElement|null}
 */
function dropTargetAt(e) {
    if (!dragged || !currentViewModel) return null;
    const target = /** @type {HTMLElement} */ (e.target);
    const li = /** @type {HTMLElement|null} */ (target.closest?.(".template-groups > li"));
    if (!li) return null;
    if (dragged.kind === "template") {
        if (li.classList.contains("new-template")) return li;
        return Number(li.dataset.groupIndex) !== dragged.groupIndex && li.dataset.groupIndex != null ? li : null;
    }
    if (Number(li.dataset.groupIndex) !== dragged.groupIndex) return null;
    if (dragged.kind === "basePage") {
        // Anywhere over the base template: the gap between base pages nearest to the pointer.
        const rows = /** @type {HTMLElement[]} */ ([...li.querySelectorAll(".page-group")]);
        const key = dragged.pageGroupKey;
        const from = rows.findIndex(row => row.dataset.pageGroupKey === key);
        let gap = 0, distance = Infinity;
        for (let i = 0; i <= rows.length; i++) {
            const y = i < rows.length ? rows[i].getBoundingClientRect().top : rows[rows.length - 1].getBoundingClientRect().bottom;
            if (Math.abs(e.clientY - y) < distance) { distance = Math.abs(e.clientY - y); gap = i; }
        }
        if (gap === from || gap === from + 1) return null; // the order would not change
        dropAfter = gap === rows.length;
        return rows[dropAfter ? rows.length - 1 : gap];
    }
    const zone = /** @type {HTMLElement|null} */ (target.closest(".new-page"));
    if (zone) return zone;
    const pageGroupEl = /** @type {HTMLElement|null} */ (target.closest(".page-group"));
    const pageGroup = pageGroupEl ? currentViewModel.pageGroupByKey[pageGroupEl.dataset.pageGroupKey ?? ""] : null;
    const pageIndex = dragged.pageIndex;
    return pageGroup && !pageGroup.pageIndices.includes(pageIndex) ? pageGroupEl : null;
}

function endDrag() {
    dragged = null;
    setDropTarget(null);
    templateGroupsEl.querySelectorAll(".drop-zone").forEach(zone => zone.remove());
    templateGroupsEl.querySelectorAll(".dragging-source").forEach(el => el.classList.remove("dragging-source"));
}

// ─── 15. Helpers ─────────────────────────────────────────────────────────────────────────────────
//
// Small formatting and utility functions.

/**
 * @param {() => void} fn
 * @param {number} ms
 * @returns {() => void}
 */
function debounce(fn, ms) {
    /** @type {ReturnType<typeof setTimeout>|undefined} */
    let timer;
    return () => { clearTimeout(timer); timer = setTimeout(fn, ms); };
}

/**
 * @param {number} value
 * @param {number} decimals
 * @returns {number}
 */
function roundTo(value, decimals) {
    const factor = 10 ** decimals;
    return Math.round(value * factor) / factor;
}

/**
 * @param {HTMLInputElement} slider
 * @returns {number}
 */
function sliderStepDecimals(slider) {
    const step = slider.step;
    if (!step || step === "any") return 0;
    const dot = step.indexOf(".");
    return dot >= 0 ? step.length - dot - 1 : 0;
}

/**
 * @param {string} s
 * @returns {string}
 */
function htmlEsc(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

/**
 * Makes a generated name valid for Inspire by replacing characters it does not allow in object
 * names (with surrounding whitespace) by "_", e.g. "Orphan: Page 1" -> "Orphan_Page 1", and
 * line breaks/tabs by a space. Extend INSPIRE_ILLEGAL_NAME_CHARS when more illegal characters are found.
 * @param {string} name
 * @returns {string}
 */
function inspireSafeName(name) {
    return name.replace(INSPIRE_ILLEGAL_NAME_CHARS, "_").replace(/\s+/g, " ").trim();
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageName(page) {
    return page.pageName ?? page.pageId ?? "Virtual page";
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageSizeLabel(page) {
    if (page.pageSize == null) return "default";
    return `${formatMm(page.pageSize.w)} x ${formatMm(page.pageSize.h)} mm`;
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageCardTooltip(page) {
    return `${pageName(page)}\npage size: ${pageSizeLabel(page)}`;
}

/**
 * @param {number} value
 * @returns {string}
 */
function formatMm(value) {
    return Number.isInteger(value) ? String(value) : String(roundTo(value, 2));
}

// ─── 16. Event wiring and startup ────────────────────────────────────────────────────────────────
//
// Event listeners and the initial state, in the order they run when the page loads.

document.getElementById("open-file")?.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
    const [file] = /** @type {FileList} */ (fileInput.files);
    if (file) loadFile(file);
});

saveCsvBtn.addEventListener("click", () => { saveCsv(); });

recalculateAllBtn.addEventListener("click", () => recalculateAll());

/** @param {boolean} open */
function setProposalOpen(open) {
    proposalPopover.hidden = !open;
    proposalBtn.setAttribute("aria-expanded", String(open));
}
proposalBtn.addEventListener("click", () => setProposalOpen(proposalPopover.hidden));
// Closes on a click outside it or on Esc (also while one of its controls has the focus).
document.addEventListener("mousedown", e => {
    if (!proposalPopover.hidden && !/** @type {HTMLElement} */ (e.target).closest(".popover-anchor")) setProposalOpen(false);
});
proposalPopover.addEventListener("keydown", e => {
    if (e.key === "Escape") { setProposalOpen(false); proposalBtn.focus(); }
});

undoBtn.addEventListener("click", () => stepHistory(false));

redoBtn.addEventListener("click", () => stepHistory(true));

templateGroupsEl.addEventListener("mouseover", e => highlightTemplatePages(e, true));

templateGroupsEl.addEventListener("mouseout", e => highlightTemplatePages(e, false));

templateGroupsEl.addEventListener("dragstart", e => {
    const target = /** @type {HTMLElement} */ (e.target);
    const chip = /** @type {HTMLElement|null} */ (target.closest?.(".template-tag, .page-tag, .pg-handle"));
    const li = /** @type {HTMLElement|null} */ (chip?.closest("li"));
    const group = currentViewModel?.templateGroups[Number(li?.dataset.groupIndex)];
    if (!chip || !li || !group || !e.dataTransfer) return;
    const groupIndex = Number(li.dataset.groupIndex);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", chip.textContent ?? "");
    if (chip.classList.contains("pg-handle")) {
        const pageGroupEl = /** @type {HTMLElement} */ (chip.closest(".page-group"));
        dragged = {kind: "basePage", pageGroupKey: pageGroupEl.dataset.pageGroupKey ?? "", groupIndex};
        requestAnimationFrame(() => pageGroupEl.classList.add("dragging-source"));
        return;
    }
    if (chip.classList.contains("template-tag")) {
        dragged = {kind: "template", templateId: chip.dataset.templateId ?? "", groupIndex};
        // A new base template only makes sense when the template does not stand alone already.
        if (group.templateIds.length > 1) templateGroupsEl.appendChild(createDropZone("new-template", "Drop here for a new base template", "li"));
    } else {
        const pageIndex = Number(chip.dataset.pageIndex);
        dragged = {kind: "page", pageIndex, groupIndex};
        const own = group.pageGroups.find(pageGroup => pageGroup.pageIndices.includes(pageIndex));
        if (own && own.pageIndices.length > 1) li.querySelector(".page-groups")?.appendChild(createDropZone("new-page", "Drop here for a new base page", "div"));
    }
    // Dim the source after the browser has taken its drag image.
    requestAnimationFrame(() => chip.classList.add("dragging-source"));
});

templateGroupsEl.addEventListener("dragover", e => {
    if (!dragged) return;
    const el = dropTargetAt(e);
    if (el && dragged.kind === "basePage") {
        setDropTarget(el, dropAfter ? "drop-after" : "drop-before");
    } else {
        setDropTarget(el);
    }
    if (!el || !e.dataTransfer) return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = "move";
});

templateGroupsEl.addEventListener("drop", e => {
    if (!dragged || !currentViewModel) return;
    e.preventDefault();
    e.stopPropagation();
    const el = dropTargetAt(e);
    const item = dragged;
    const after = dropAfter;
    const groups = currentViewModel.templateGroups;
    const from = groups[item.groupIndex];
    endDrag();
    if (!el || !from) return;
    if (item.kind === "basePage") {
        const moved = currentViewModel.pageGroupByKey[item.pageGroupKey];
        const target = currentViewModel.pageGroupByKey[el.dataset.pageGroupKey ?? ""];
        if (moved && target) reorderBasePage(from, moved, target, after);
    } else if (item.kind === "template") {
        moveTemplate(item.templateId, from, el.classList.contains("new-template") ? null : groups[Number(el.dataset.groupIndex)]);
    } else {
        movePage(item.pageIndex, from, el.classList.contains("new-page") ? null : currentViewModel.pageGroupByKey[el.dataset.pageGroupKey ?? ""] ?? null);
    }
});

templateGroupsEl.addEventListener("dragend", endDrag);

document.body.addEventListener("dragover", e => {
    // Moving a template or page: not droppable outside its targets, and not a file.
    if (dragged) { setDropTarget(null); return; }
    e.preventDefault();
    document.body.classList.add("drag-over");
});

document.body.addEventListener("dragleave", e => {
    if (e.relatedTarget == null) document.body.classList.remove("drag-over");
});

document.body.addEventListener("drop", e => {
    e.preventDefault();
    if (dragged) return;
    document.body.classList.remove("drag-over");
    const file = e.dataTransfer?.files[0];
    if (!file) return;
    // Show the dropped file in the file input too (setting files does not fire "change").
    const transfer = new DataTransfer();
    transfer.items.add(file);
    fileInput.files = transfer.files;
    loadFile(file);
});

document.getElementById("card-size").addEventListener("input", (e) => {
    settings.canvasW = parseInt(/** @type {HTMLInputElement} */ (e.target).value);
    scheduleRefreshCards();
});

document.getElementById("threshold").addEventListener("input", (e) => {
    settings.groupThreshold = parseFloat(/** @type {HTMLInputElement} */ (e.target).value);
    /** @type {HTMLOutputElement} */ (document.getElementById("threshold-out")).value = settings.groupThreshold.toFixed(2);
    scheduleRender();
});

document.getElementById("group-strategy").addEventListener("change", (e) => {
    settings.groupStrategy = /** @type {"single"|"average"|"complete"} */ (/** @type {HTMLSelectElement} */ (e.target).value);
    if (currentData) render(currentData);
});

document.querySelectorAll("input[type='range']").forEach(input => {
    input.addEventListener("wheel", (e) => {
        e.preventDefault();
        const slider = /** @type {HTMLInputElement} */ (e.currentTarget);
        const min = slider.min === "" ? 0 : parseFloat(slider.min);
        const max = slider.max === "" ? 100 : parseFloat(slider.max);
        const step = slider.step === "" || slider.step === "any" ? 1 : parseFloat(slider.step);
        const current = parseFloat(slider.value);
        const direction = e.deltaY < 0 ? 1 : -1;
        const next = Math.min(max, Math.max(min, current + direction * step));
        slider.value = String(roundTo(next, sliderStepDecimals(slider)));
        slider.dispatchEvent(new Event("input", {bubbles: true}));
    }, {passive: false});
});

document.addEventListener("keydown", e => {
    // Keys typed into a field (or used by a slider) belong to it.
    const typing = e.target instanceof HTMLElement && e.target.closest("input, select, textarea, [contenteditable]");
    if (typing) return;
    const key = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (key === "z" || key === "y")) {
        e.preventDefault();
        stepHistory(key === "y" || e.shiftKey);
        return;
    }
    if (e.key.startsWith("Arrow") && nudgeSelectedBaseArea(e)) {
        e.preventDefault();
        return;
    }
    if (e.key === "Escape" && !proposalPopover.hidden) {
        setProposalOpen(false);
        return;
    }
    if (e.key === "Escape" && uiState.areaSelection) {
        uiState.areaSelection = null;
        refreshOpenPageGroups();
        renderInspector();
    }
});

toggleInspectorBtn.addEventListener("click", () => setInspectorHidden(!document.body.classList.contains("inspector-hidden")));

setInspectorHidden((() => { try { return localStorage.getItem(INSPECTOR_HIDDEN_KEY) === "1"; } catch { return false; } })());

renderInspector();

// Event delegation for page-group toggle
document.getElementById("template-groups").addEventListener("click", (e) => {
    const target = /** @type {HTMLElement} */ (e.target);
    const inspect = /** @type {HTMLElement|null} */ (target.closest("[data-action='inspect-template'], [data-action='inspect-page']"));
    if (inspect) {
        inspectItem(inspect.dataset.action === "inspect-page" ? "page" : "template", inspect.dataset.key ?? "");
        return;
    }
    const fixToggle = /** @type {HTMLElement|null} */ (target.closest("[data-action='toggle-fix']"));
    if (fixToggle) {
        const group = currentViewModel?.templateGroups[Number(fixToggle.dataset.groupIndex)];
        if (group?.locked) unlockGroup(group);
        else if (group) fixGroup(group);
        return;
    }
    const useComputed = /** @type {HTMLElement|null} */ (target.closest("[data-action='use-computed']"));
    if (useComputed) {
        const basePage = currentBasePageByPage.get(Number(useComputed.dataset.pageIndex))?.basePage;
        if (basePage) useComputedRepresentative(basePage);
        return;
    }
    if (target.closest(".pg-handle")) return;
    const row = /** @type {HTMLElement|null} */ (target.closest("[data-action='toggle-preview']"));
    if (!row) return;
    togglePageCards(row);
});
</script>
