<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Layout Analysis</title>
    <style>
        :root {
            --fg: #111;
            --muted: #666;
            --line: #e6e6e6;
            --bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 24px;
            color: var(--fg);
            background: #fff;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        button, input[type="file"] {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--bg);
            cursor: pointer;
            font-size: 13px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .status {
            font-size: 13px;
            color: var(--muted);
        }

        .status.error {
            color: #c00;
        }

        .status.ok {
            color: #2a7a2a;
        }

        body.drag-over {
            outline: 3px dashed #6b9fd4;
            outline-offset: -12px;
        }

        /* Template groups */
        .template-groups {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .template-groups > li {
            margin-bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            transition: opacity 0.2s;
        }

        .tg-header {
            padding: 8px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .tg-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tg-title > .hint {
            margin-left: auto;
            flex-shrink: 0;
        }

        .tg-templates {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .template-tag:hover {
            border-color: #6b9fd4;
            color: var(--fg);
        }

        /* Pages of the template chip under the mouse. */
        .page-tag.highlight {
            background: #dbe8f8;
        }

        .tg-name {
            font-weight: 600;
            flex-shrink: 0;
        }

        .template-tag {
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            color: var(--muted);
            background: #fff;
        }

        /* A name the tool proposed (derived), as opposed to one the user set. */
        /* A name the tool proposed (derived), as opposed to one the user set: underlined dotted,
           like the dashed frames of the computed base areas. */
        .derived {
            text-decoration: underline dotted #aaa;
            text-underline-offset: 3px;
        }

        .page-groups {
            padding: 6px 0;
        }

        .page-group {
            border-bottom: 1px solid var(--line);
        }

        .page-group:last-child {
            border-bottom: none;
        }

        .pg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 14px;
            cursor: pointer;
            user-select: none;
        }

        .pg-row:hover {
            background: #f5f8ff;
        }

        .pg-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 200px;
            flex-shrink: 0;
            min-width: 0;
            font-size: 13px;
            line-height: 22px;
        }

        .pg-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .pg-cohesion {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .cohesion-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }


        .cohesion-high {
            background: #22c55e;
        }

        .cohesion-mid {
            background: #f59e0b;
        }

        .cohesion-low {
            background: #ef4444;
        }

        .cohesion-solo {
            background: #d1d5db;
        }

        .pg-expand-icon {
            width: 10px;
            font-size: 9px;
            line-height: 22px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .page-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            flex: 1;
        }

        .page-tag {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 12px;
            white-space: nowrap;
        }

        .pg-cards {
            display: none;
            flex-wrap: wrap;
            gap: 16px;
            padding: 10px 14px 14px 36px;
            background: #fafbff;
            border-top: 1px dashed var(--line);
        }

        .pg-cards.open {
            display: flex;
        }

        .page-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .page-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            font-size: 11px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }

        .page-card-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hint {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .page-card svg {
            display: block;
            background: #fff;
        }

        .page-svg.selectable .area-rect {
            cursor: pointer;
        }

        /* Every card has a footer of the same fixed height, so nothing moves when areas are selected. */
        .card-footer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            padding: 0 6px;
            border-top: 1px solid var(--line);
            background: var(--bg);
            overflow: hidden;
        }

        .card-footer .hint {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer button {
            flex-shrink: 0;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 11px;
            background: #fff;
        }

        .page-card.representative {
            border-color: #e0a800;
            box-shadow: 0 0 0 1px #e0a800;
        }

        .rep-btn {
            flex-shrink: 0;
            width: 22px;
            height: 20px;
            padding: 0;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1;
            color: #999;
            background: #fff;
        }

        .rep-btn:hover:not(:disabled) {
            border-color: #e0a800;
            color: #e0a800;
        }

        .rep-btn.active {
            border-color: #e0a800;
            color: #e0a800;
        }

        .rep-btn.active.manual {
            background: #e0a800;
            color: #fff;
        }

        .rep-mark {
            color: #e0a800;
            margin-right: 3px;
        }

        .toolbar-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .toolbar-control input[type="range"] {
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            width: 80px;
            accent-color: #6b9fd4;
        }

        .toolbar-control output {
            font-size: 12px;
            color: #4a7ab5;
            font-weight: 600;
            min-width: 2.8em;
        }

        .toolbar-control select {
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: var(--bg);
            font-size: 13px;
            cursor: pointer;
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: #ddd;
            margin: 0 4px;
        }

        code {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <label class="toolbar-control" title="Page card display size">
        Page size: <input type="range" id="card-size" min="180" max="700" step="10" value="400"/>
        <output id="card-size-out">400</output>
    </label>
    <div class="toolbar-sep"></div>
    <label class="toolbar-control" title="Similarity threshold for grouping pages and templates">
        Threshold: <input type="range" id="threshold" min="0.10" max="0.95" step="0.01" value="0.60"/>
        <output id="threshold-out">0.60</output>
    </label>
    <label class="toolbar-control" title="Grouping linkage strategy">
        Strategy:
        <select id="group-strategy">
            <option value="average" selected>Average</option>
            <option value="single">Single (any pair)</option>
            <option value="complete">Complete (all pairs)</option>
        </select>
    </label>
    <div class="toolbar-sep"></div>
    <input type="file" id="file" accept=".csv"/>
    <button id="save-csv" disabled title="Save the loaded CSV, optionally with edits, back to disk">Export</button>
    <div class="status" id="status"></div>
</div>

<div id="app" hidden>
    <ul class="template-groups" id="template-groups"></ul>
</div>

<script type="module">
// @ts-check

/**
 * @typedef {Object} LayoutData
 * @property {PageEntry[]} pages
 * @property {TemplateEntry[]} templates
 */

/**
 * The loaded layout CSV, kept so it can be written back losslessly (including columns the viewer
 * doesn't use).
 * @typedef {Object} CsvDocument
 * @property {string[]} headers         header cells as in the file (incl. " (read-only)" suffixes)
 * @property {string[][]} standardRows  non-Base data rows, padded to the header length
 * @property {number[]} standardRowLines 1-based file line of each standard row, for error messages
 * @property {string} fileName
 */

/**
 * @typedef {Object} LayoutAnalysis
 * @property {Similarity} similarity
 * @property {BaseTemplateAreaDraft[][]} pageBaseTemplateAreaDrafts
 */

/**
 * @typedef {Object} Similarity
 * @property {PageLevel} pageLevel
 * @property {TemplateLevel} templateLevel
 */

/**
 * @typedef {Object} PageLevel
 * @property {number[][]} matrix
 */

/**
 * @typedef {Object} TemplateLevel
 * @property {TemplateEntry[]} templates
 * @property {number[][]} matrix
 */

/**
 * @typedef {Object} TemplateEntry
 * @property {string} templateId
 * @property {string} templateName
 * @property {number[]} pageIndices
 */

/**
 * @typedef {Object} PageEntry
 * @property {string|null} pageId      - null for template-direct virtual pages (no real page object)
 * @property {string|null} pageName    - null for template-direct virtual pages
 * @property {PageSizeEntry|null} pageSize
 * @property {string|null} templateId  - null for orphan pages not belonging to any template
 * @property {string|null} templateName
 * @property {number|null} templatePageIndex
 * @property {AreaEntry[]} areas
 * @property {string[][]} sourceRows    - the CsvDocument row of each area (same order as areas)
 */

/**
 * @typedef {Object} PageSizeEntry
 * @property {number} w
 * @property {number} h
 */

/**
 * @typedef {Object} AreaEntry
 * @property {number} x
 * @property {number} y
 * @property {number} w
 * @property {number} h
 * @property {boolean} flowToNextPage
 * @property {string} interactiveFlowName
 * @property {string} areaName
 * @property {string} contentPreview
 * @property {number|null} containedIn
 */

/**
 * A candidate base template area: a cluster of nearby areas on a page (grouped by proximity)
 * that would become a single area/interactiveFlowName in a base template.
 * @typedef {Object} BaseTemplateAreaDraft
 * @property {number[]} areaIndices
 * @property {Position} position
 * @property {string} name
 * @property {string} areaName Name of the first named area in the draft, empty when none of its areas has a name
 */

/**
 * A proposed base template: one per template group.
 * @typedef {Object} BaseTemplateModel
 * @property {string} id
 * @property {string} name
 * @property {BaseTemplatePageModel[]} pages one per page group
 */

/**
 * @typedef {Object} BaseTemplatePageModel
 * @property {string} id
 * @property {string} name
 * @property {string} pageGroupKey
 * @property {PageSizeEntry|null} pageSize
 * @property {number} representativePageIndex the page whose area drafts define the base areas
 * @property {boolean} representativeIsManual   chosen by the user rather than computed
 * @property {BaseAreaModel[]} areas
 * @property {Map<number, (number|null)[]>} baseAreaByArea for every page of the group: the base
 *   area index each of its areas maps to
 */

/**
 * @typedef {Object} BaseAreaModel
 * @property {string} flowName
 * @property {string} areaName
 * @property {boolean} flowToNextPage
 * @property {Position} position
 */

/**
 * Decisions made by the user. They take priority over the computed proposal and are carried over
 * to a new grouping (e.g. after a threshold change), see reconcileDecisions.
 * @typedef {Object} Decisions
 * @property {Map<string, number>} representativeByPageGroup page group key -> representative page index
 * @property {Map<string, number[][]>} areaGroupsByPage page key (see renderUnitKey) -> the page's areas
 *   grouped into drafts by the user (merge/split); replaces the computed proximity grouping of that page
 */

/**
 * @typedef {Object} Position
 * @property {number} x
 * @property {number} y
 * @property {number} w
 * @property {number} h
 */

/**
 * @typedef {Object} PageGroup
 * @property {string} key
 * @property {number[]} pageIndices
 */

/**
 * @typedef {Object} TemplateGroup
 * @property {string} key
 * @property {string[]} templateIds
 * @property {string[]} templateNames
 * @property {PageGroup[]} pageGroups - sorted page clusters with stable membership-based keys
 */

/**
 * @typedef {Object} Settings
 * @property {number} canvasW
 * @property {number} groupThreshold
 * @property {"single"|"average"|"complete"} groupStrategy
 */

/**
 * @typedef {Object} UiState
 * @property {Set<string>} openPageGroups
 * @property {{pageIndex: number, areaIndices: Set<number>}|null} areaSelection areas selected on one page card, for merge/split
 */

/**
 * @typedef {Object} ViewModel
 * @property {TemplateLevel} templateLevel
 * @property {PageLevel} pageLevel
 * @property {TemplateGroup[]} templateGroups
 * @property {Record<string, PageGroup>} pageGroupByKey
 * @property {Set<string>} pageGroupKeys
 */

/**
 * One color per base area of a base page; an area is drawn in the color of the base area it
 * belongs to, so areas sharing a color are merged into one base area. Dark enough for labels.
 * @type {string[]}
 */
const BASE_AREA_COLORS = [
    "#4e79a7", "#f28e2b", "#e15759", "#499894", "#59a14f",
    "#b6992d", "#b07aa1", "#d37295", "#9d7660", "#79706e",
];
/** Areas that belong to no base area (the base page has no areas). */
const NO_BASE_AREA_COLOR = "#999";
/** Gap in px between a base area's frame and the areas it contains. */
const FRAME_GAP = 4;

const PAGE_REF_MM = 210;
/** Areas closer than this vertically are proposed as one base area. */
const PROXIMITY_GAP_MM = 5.3;
const PAD = 10;
/** Characters (and the whitespace around them) not allowed in Inspire object names. */
const INSPIRE_ILLEGAL_NAME_CHARS = /\s*:+\s*/g;
/** @type {Settings} */
const settings = {
    canvasW: 400,
    groupThreshold: 0.60,
    groupStrategy: "average",
};

/** @type {LayoutData|null} */
let currentData = null;
/** @type {LayoutAnalysis|null} */
let currentAnalysis = null;
/** @type {ViewModel|null} */
let currentViewModel = null;
/** @type {Decisions} */
let decisions = emptyDecisions();
/** @type {BaseTemplateAreaDraft[][]} area drafts of every page: manual area groups or the computed ones */
let currentAreaDrafts = [];
/** @type {BaseTemplateModel[]} */
let currentBaseTemplates = [];
/** @type {Map<number, {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}>} */
let currentBasePageByPage = new Map();
/** @type {UiState} */
let uiState = {
    openPageGroups: new Set(),
    areaSelection: null,
};

const statusEl = /** @type {HTMLElement} */ (document.getElementById("status"));
const fileInput = /** @type {HTMLInputElement} */ (document.getElementById("file"));

/**
 * @param {() => void} fn
 * @param {number} ms
 * @returns {() => void}
 */
function debounce(fn, ms) {
    /** @type {ReturnType<typeof setTimeout>|undefined} */
    let timer;
    return () => { clearTimeout(timer); timer = setTimeout(fn, ms); };
}

const scheduleRender = debounce(() => { if (currentData) render(currentData); }, 150);
const scheduleRefreshCards = debounce(refreshOpenPageGroups, 80);

/**
 * Parses CSV text (RFC 4180) into records. Quoted fields may contain commas, doubled quotes and
 * line breaks. As in Csv.groovy's split, a quote opens a quoted field only at the very start of a
 * field; anywhere else it is kept literally. A leading byte order mark (added by Excel) is ignored
 * and blank lines are skipped.
 * @param {string} text
 * @returns {{cells: string[], line: number}[]} records with the 1-based line they start on
 */
function parseCsv(text) {
    /** @type {{cells: string[], line: number}[]} */
    const records = [];
    /** @type {string[]} */
    let cells = [];
    let field = "", inQuotes = false, wasQuoted = false;
    let line = 1, recordLine = 1;
    const endField = () => { cells.push(field); field = ""; wasQuoted = false; };
    const endRecord = () => {
        endField();
        if (cells.length > 1 || cells[0] !== "") records.push({cells, line: recordLine});
        cells = [];
    };

    let i = text.charCodeAt(0) === 0xFEFF ? 1 : 0;
    for (; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
            else if (c === '"') { inQuotes = false; }
            else { if (c === "\n") line++; field += c; }
        } else if (c === ",") {
            endField();
        } else if (c === "\r" || c === "\n") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            endRecord();
            line++;
            recordLine = line;
        } else if (c === '"' && field === "" && !wasQuoted) {
            inQuotes = true;
            wasQuoted = true;
        } else {
            field += c;
        }
    }
    if (field !== "" || cells.length || wasQuoted) endRecord();
    return records;
}

/**
 * Parses a Size string (e.g. "210.0000mm", "595.2756pt", "8.2677in") to millimetres.
 * Returns null for empty or invalid input.
 * @param {string} str
 * @returns {number|null}
 */
function parseSizeMm(str) {
    if (!str || !str.trim()) return null;
    const m = str.trim().match(/^(-?\d*\.?\d+)\s*(pt|mm|cm|dm|m|in)$/i);
    if (!m) return null;
    const v = parseFloat(m[1]);
    let mm;
    switch (m[2].toLowerCase()) {
        case 'pt': mm = v * 25.4 / 72; break;
        case 'mm': mm = v; break;
        case 'cm': mm = v * 10; break;
        case 'dm': mm = v * 100; break;
        case 'm':  mm = v * 1000; break;
        case 'in': mm = v * 25.4; break;
        default:   return null;
    }
    return roundTo(mm, 2);
}

/**
 * Computes containment for each area: the index of its smallest enclosing area, or null.
 * @param {{x: number, y: number, w: number, h: number}[]} areas
 * @returns {(number|null)[]}
 */
function computeContainment(areas) {
    const tolerance = 0.7;
    const containment = /** @type {(number|null)[]} */ (new Array(areas.length).fill(null));
    for (let i = 0; i < areas.length; i++) {
        const inner = areas[i];
        const innerSize = inner.w * inner.h;
        for (let j = 0; j < areas.length; j++) {
            if (i === j) continue;
            const outer = areas[j];
            const outerSize = outer.w * outer.h;
            if (outerSize <= innerSize) continue;
            if (outer.x - tolerance <= inner.x && outer.y - tolerance <= inner.y
                    && (inner.x + inner.w) <= (outer.x + outer.w) + tolerance
                    && (inner.y + inner.h) <= (outer.y + outer.h) + tolerance) {
                const cur = containment[i];
                const curSize = cur != null ? areas[cur].w * areas[cur].h : Infinity;
                if (curSize > outerSize) containment[i] = j;
            }
        }
    }
    return containment;
}

/**
 * Reads the layout CSV into a {@link CsvDocument}. "Base" rows are dropped here; they are
 * regenerated from the current grouping on export.
 * @param {string} text
 * @param {string} fileName
 * @returns {CsvDocument}
 */
function readCsvDocument(text, fileName) {
    const [headerRecord, ...dataRecords] = parseCsv(text);
    if (!headerRecord) throw new Error("The file is empty.");
    const headers = headerRecord.cells;
    const typeIdx = columnIndex(headers, "type");

    /** @type {string[][]} */
    const standardRows = [];
    /** @type {number[]} */
    const standardRowLines = [];
    dataRecords.forEach(({cells, line}) => {
        if (typeIdx >= 0 && (cells[typeIdx] ?? "").trim().toLowerCase() === "base") return;
        while (cells.length < headers.length) cells.push("");
        standardRows.push(cells);
        standardRowLines.push(line);
    });
    return {headers, standardRows, standardRowLines, fileName};
}

/**
 * Builds the LayoutData from the standard rows of a layout CSV produced by LayoutExport.groovy.
 * Templates and templatePageIndex are derived from row order; containedIn is computed from geometry.
 * Every page keeps references to its source rows so the export can write values back to them.
 * @param {CsvDocument} doc
 * @returns {LayoutData}
 */
function buildLayoutData(doc) {
    /** @type {Map<string, number>} */
    const indexByName = new Map();
    doc.headers.forEach((header, idx) => {
        const name = normalizeHeaderName(header);
        if (!indexByName.has(name)) indexByName.set(name, idx);
    });

    /** @param {string[]} row @param {string} name @returns {string} */
    const col = (row, name) => { const idx = indexByName.get(name); return idx != null ? (row[idx] ?? '') : ''; };

    /** @type {Map<string, {meta: {pageId:string|null,pageName:string|null,templateId:string|null,templateName:string|null,pageWidth:string,pageHeight:string}, rows:string[][], lines:number[]}>} */
    const pageMap = new Map();
    for (let i = 0; i < doc.standardRows.length; i++) {
        const row = doc.standardRows[i];

        const pageId = col(row, 'pageId') || null;
        const templateId = col(row, 'templateId') || null;
        const pageKey = pageId && templateId
            ? `tmpl:${templateId}:page:${pageId}`
            : pageId
                ? `page:${pageId}`
                : templateId
                    ? `virtual:${templateId}`
                    : `row:${i}`;
        if (!pageMap.has(pageKey)) {
            pageMap.set(pageKey, {
                meta: {
                    pageId,
                    pageName: col(row, 'pageName') || null,
                    templateId,
                    templateName: col(row, 'templateName') || null,
                    pageWidth: col(row, 'pageWidth'),
                    pageHeight: col(row, 'pageHeight'),
                },
                rows: [],
                lines: [],
            });
        }
        pageMap.get(pageKey).rows.push(row);
        pageMap.get(pageKey).lines.push(doc.standardRowLines[i]);
    }

    /** @type {Map<string, number>} */
    const pageIndexMap = new Map();
    /** @type {Map<string, number>} */
    const tmplPageCounter = new Map();
    for (const [pageKey, { meta }] of pageMap) {
        if (!meta.templateId || !meta.pageId) continue;
        const n = tmplPageCounter.get(meta.templateId) ?? 0;
        pageIndexMap.set(pageKey, n);
        tmplPageCounter.set(meta.templateId, n + 1);
    }

    /** @type {PageEntry[]} */
    const pages = [];
    for (const [pageKey, { meta, rows, lines }] of pageMap) {
        const rawAreasWithRow = rows.map((row, idx) => {
            const x = parseSizeMm(col(row, 'x'));
            const y = parseSizeMm(col(row, 'y'));
            const w = parseSizeMm(col(row, 'width'));
            const h = parseSizeMm(col(row, 'height'));
            if (x == null || y == null || w == null || h == null) return null;
            const areaIndex = Number(col(row, 'areaIndex').trim());
            if (Number.isNaN(areaIndex)) {
                throw new Error(`Row on line ${lines[idx]} is missing a valid areaIndex value.`);
            }
            return {
                area: {
                    x, y, w, h,
                    flowToNextPage: col(row, 'flowToNextPage') === 'true',
                    interactiveFlowName: col(row, 'interactiveFlowName') || '',
                    areaName: col(row, 'areaName') || '',
                    contentPreview: col(row, 'contentPreview') || '',
                },
                row,
                areaIndex,
            };
        }).filter(a => a != null);
        rawAreasWithRow.sort((a, b) => a.areaIndex - b.areaIndex);
        const rawAreas = /** @type {{x:number,y:number,w:number,h:number,flowToNextPage:boolean,interactiveFlowName:string,areaName:string,contentPreview:string}[]} */ (
            rawAreasWithRow.map(a => a.area)
        );

        const containment = computeContainment(rawAreas);
        const areas = /** @type {AreaEntry[]} */ (rawAreas.map((a, idx) => ({ ...a, containedIn: containment[idx] })));

        const pw = parseSizeMm(meta.pageWidth);
        const ph = parseSizeMm(meta.pageHeight);
        pages.push(/** @type {PageEntry} */ ({
            pageId: meta.pageId,
            pageName: meta.pageName,
            pageSize: pw != null && ph != null ? { w: pw, h: ph } : null,
            templateId: meta.templateId,
            templateName: meta.templateName,
            templatePageIndex: pageIndexMap.get(pageKey) ?? null,
            areas,
            sourceRows: rawAreasWithRow.map(a => a.row),
        }));
    }

    return { pages, templates: deriveTemplates(pages) };
}

// The loaded CSV, kept alongside the parsed LayoutData so the file can be re-serialized
// losslessly (including columns/rows the viewer doesn't otherwise use) for saving back to disk.
/** @type {CsvDocument|null} */
let currentCsv = null;

const saveCsvBtn = /** @type {HTMLButtonElement} */ (document.getElementById("save-csv"));

/**
 * @param {File} file
 */
async function loadFile(file) {
    try {
        setStatus("");
        const doc = readCsvDocument(await file.text(), file.name || "layout.csv");
        const layoutData = buildLayoutData(doc);
        currentCsv = doc;
        saveCsvBtn.disabled = false;
        render(layoutData);
    } catch (err) {
        setStatus("Error: " + /** @type {Error} */ (err).message, "error");
    }
}

/**
 * @param {string} message
 * @param {"ok"|"error"} [kind]
 */
function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.classList.toggle("ok", kind === "ok");
    statusEl.classList.toggle("error", kind === "error");
}

fileInput.addEventListener("change", () => {
    const [file] = /** @type {FileList} */ (fileInput.files);
    if (file) loadFile(file);
});

/**
 * Header name without the " (read-only)" suffix added by Mapping.displayHeader.
 * @param {string} header
 * @returns {string}
 */
function normalizeHeaderName(header) {
    const s = (header ?? "").trim();
    return s.endsWith(" (read-only)") ? s.slice(0, -" (read-only)".length).trim() : s;
}

/**
 * @param {string[]} headers
 * @param {string} logicalName
 * @returns {number} -1 when the column is missing
 */
function columnIndex(headers, logicalName) {
    return headers.findIndex(h => normalizeHeaderName(h) === logicalName);
}

/**
 * Returns the index of the given column, inserting it (before contentPreview) when missing.
 * @param {string[]} headers
 * @param {string[][]} rows
 * @param {string} logicalName
 * @returns {number}
 */
function ensureCsvColumn(headers, rows, logicalName) {
    const idx = columnIndex(headers, logicalName);
    if (idx >= 0) return idx;
    const insertIdx = headers.findIndex(h => normalizeHeaderName(h) === "contentPreview");
    const at = insertIdx >= 0 ? insertIdx : headers.length;
    headers.splice(at, 0, logicalName);
    rows.forEach(row => { row.splice(at, 0, ""); });
    return at;
}

/**
 * @param {string} field
 * @returns {string}
 */
function csvEscapeField(field) {
    const s = field ?? "";
    if (/[",\r\n]/.test(s)) {
        return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
}

/**
 * @param {string[]} headers
 * @param {string[][]} rows
 * @returns {string}
 */
function serializeCsv(headers, rows) {
    const lines = [headers.map(csvEscapeField).join(",")];
    for (const row of rows) {
        lines.push(row.map(csvEscapeField).join(","));
    }
    return lines.join("\r\n") + "\r\n";
}

/**
 * Derives a human-friendly interactive flow name from an area's content preview,
 * e.g. "docRef: address" -> "address". Returns null if no usable name can be derived.
 * @param {string} contentPreview
 * @returns {string|null}
 */
function parseFlowNameFromPreview(contentPreview) {
    if (!contentPreview) return null;
    const first = contentPreview.split(";")[0]?.trim();
    if (!first) return null;
    const colonIdx = first.indexOf(": ");
    const value = colonIdx === -1 ? first : first.slice(colonIdx + 2).trim();
    return value || null;
}

// ─── Base template model ────────────────────────────────────────────────────────────────────
//
// One base template per template group and one base page per page group. Each base page takes
// its areas from a representative page: the page most similar to the rest of its group, unless
// the user picked another one (a manual decision). The area drafts of every other page in the
// group are matched to these base areas by geometry, which decides the interactiveFlowName
// written to their standard rows.

/**
 * Geometric distance between two rectangles, in units where ~0.5 is "clearly different".
 * x, y and width are normalized to the page reference width; height uses a log ratio so a 3x
 * difference counts as 1.0.
 * @param {{x: number, y: number, w: number, h: number}} a
 * @param {{x: number, y: number, w: number, h: number}} b
 * @param {boolean} includeY
 * @returns {number}
 */
function geometryDistance(a, b, includeY) {
    const xDist = Math.abs(a.x - b.x) / PAGE_REF_MM;
    const yDist = includeY ? Math.abs(a.y - b.y) / PAGE_REF_MM : 0;
    const wDist = Math.abs(a.w - b.w) / PAGE_REF_MM;
    const hRatio = Math.abs(Math.log(Math.max(a.h, 0.1) / Math.max(b.h, 0.1))) / Math.log(3);
    return Math.sqrt(xDist * xDist + yDist * yDist + wDist * wDist + hRatio * hRatio);
}

/**
 * The page most similar to all other pages of the group (highest summed similarity); ties go
 * to the earlier page.
 * @param {number[]} pageIndices
 * @param {number[][]} pageMatrix
 * @returns {number}
 */
function defaultRepresentative(pageIndices, pageMatrix) {
    let best = pageIndices[0], bestScore = -Infinity;
    pageIndices.forEach(candidate => {
        const score = pageIndices.reduce((sum, other) => other === candidate ? sum : sum + (pageMatrix[candidate]?.[other] ?? 0), 0);
        if (score > bestScore) { best = candidate; bestScore = score; }
    });
    return best;
}

/**
 * Maps every area of a page to the base area it lies in: the one covering the largest part of
 * it, or, when it overlaps none, the geometrically closest one. Every standard area therefore
 * ends up in an existing flow of the base template.
 * @param {AreaEntry[]} areas
 * @param {BaseTemplateAreaDraft[]} baseDrafts
 * @returns {(number|null)[]} base area index per area; null only when there are no base areas
 */
function mapAreasToBaseAreas(areas, baseDrafts) {
    return areas.map(area => {
        if (!baseDrafts.length) return null;
        let best = 0, bestCoverage = 0, bestDistance = Infinity;
        baseDrafts.forEach((base, baseIndex) => {
            const p = base.position;
            const overlapW = Math.min(area.x + area.w, p.x + p.w) - Math.max(area.x, p.x);
            const overlapH = Math.min(area.y + area.h, p.y + p.h) - Math.max(area.y, p.y);
            const coverage = overlapW > 0 && overlapH > 0 ? (overlapW * overlapH) / Math.max(area.w * area.h, 0.01) : 0;
            const distance = geometryDistance(area, p, true);
            if (coverage > bestCoverage || (coverage === bestCoverage && coverage === 0 && distance < bestDistance)) {
                best = baseIndex;
                bestCoverage = coverage;
                bestDistance = distance;
            }
        });
        return best;
    });
}

/**
 * Picks the name of a base area's interactive flow from its representative draft, in order of
 * preference: 1. the interactiveFlowName most used by the draft's areas, 2. the draft's area name,
 * 3. a name derived from its content preview. Names of other pages are not used: their areas may
 * be mapped to the base area only because nothing fits better. Generated names (2, 3) get a "Flow"
 * suffix. The result is Inspire-safe and unique in `usedNames`.
 * @param {AreaEntry[]} draftAreas the representative draft's areas
 * @param {BaseTemplateAreaDraft} representativeDraft
 * @param {Set<string>} usedNames names already used in the same base template; the result is added
 * @returns {string}
 */
function chooseFlowName(draftAreas, representativeDraft, usedNames) {
    /** @type {Map<string, number>} */
    const counts = new Map();
    draftAreas.forEach(area => {
        const name = area.interactiveFlowName.trim();
        if (name) counts.set(name, (counts.get(name) ?? 0) + 1);
    });
    let existing = "", existingCount = 0;
    counts.forEach((count, name) => { if (count > existingCount) { existing = name; existingCount = count; } });

    return uniqueName(inspireSafeName(existing || `${representativeDraft.name}Flow`), usedNames);
}

/**
 * `base`, or `base_2`, `base_3`... when already in `usedNames`; the result is added to `usedNames`.
 * @param {string} base
 * @param {Set<string>} usedNames
 * @returns {string}
 */
function uniqueName(base, usedNames) {
    let name = base;
    for (let n = 2; usedNames.has(name); n++) name = `${base}_${n}`;
    usedNames.add(name);
    return name;
}

/**
 * @param {LayoutData} data
 * @param {ViewModel} viewModel
 * @param {BaseTemplateAreaDraft[][]} areaDrafts area drafts of every page (manual or computed)
 * @param {Decisions} decisions
 * @returns {BaseTemplateModel[]}
 */
function buildBaseTemplates(data, viewModel, areaDrafts, decisions) {
    const pageMatrix = viewModel.pageLevel.matrix;
    /** @type {Set<string>} */
    const usedTemplateNames = new Set();
    return viewModel.templateGroups.map((templateGroup, templateGroupIndex) => {
        const usedFlowNames = new Set();
        /** @type {Set<string>} */
        const usedPageNames = new Set();
        const pages = templateGroup.pageGroups.map((pageGroup, pageGroupIndex) => {
            const manual = decisions.representativeByPageGroup.get(pageGroup.key);
            const representativePageIndex = manual ?? defaultRepresentative(pageGroup.pageIndices, pageMatrix);
            const representative = data.pages[representativePageIndex];
            const baseDrafts = areaDrafts[representativePageIndex] ?? [];

            // The representative's areas belong to the base area made from their draft; the areas
            // of the other pages go to the base area they lie in.
            /** @type {(number|null)[]} */
            const representativeMapping = new Array(representative.areas.length).fill(null);
            baseDrafts.forEach((draft, baseIndex) => draft.areaIndices.forEach(areaIndex => { representativeMapping[areaIndex] = baseIndex; }));
            /** @type {Map<number, (number|null)[]>} */
            const baseAreaByArea = new Map();
            pageGroup.pageIndices.forEach(pageIndex => {
                baseAreaByArea.set(pageIndex, pageIndex === representativePageIndex
                    ? representativeMapping
                    : mapAreasToBaseAreas(data.pages[pageIndex].areas, baseDrafts));
            });

            return {
                id: `page-${pageGroupIndex + 1}`,
                name: uniqueName(inspireSafeName(representative.pageName ?? `Page ${pageGroupIndex + 1}`), usedPageNames),
                pageGroupKey: pageGroup.key,
                pageSize: representative.pageSize,
                representativePageIndex,
                representativeIsManual: manual != null,
                areas: baseDrafts.map(draft => ({
                    flowName: chooseFlowName(draft.areaIndices.map(areaIndex => representative.areas[areaIndex]), draft, usedFlowNames),
                    areaName: draft.areaName,
                    flowToNextPage: draft.areaIndices.some(areaIndex => representative.areas[areaIndex]?.flowToNextPage),
                    position: draft.position,
                })),
                baseAreaByArea,
            };
        });
        // Named after the template of the first base page's representative.
        const firstRepresentative = pages.length ? data.pages[pages[0].representativePageIndex] : null;
        const templateName = firstRepresentative?.templateName ?? templateGroup.templateNames[0];
        return {
            id: `bt-${templateGroupIndex + 1}`,
            name: uniqueName(inspireSafeName(`${templateName}BaseTemplate`), usedTemplateNames),
            pages,
        };
    });
}

/**
 * Finds the base page (and its base template) a page belongs to.
 * @param {BaseTemplateModel[]} baseTemplates
 * @returns {Map<number, {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}>}
 */
function indexBasePagesByPage(baseTemplates) {
    /** @type {Map<number, {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}>} */
    const result = new Map();
    baseTemplates.forEach(baseTemplate => baseTemplate.pages.forEach(basePage => {
        basePage.baseAreaByArea.forEach((_, pageIndex) => result.set(pageIndex, {baseTemplate, basePage}));
    }));
    return result;
}

/**
 * Flow name of the base area each area of a page maps to ("" when the base page has no areas).
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 * @returns {string[]}
 */
function areaFlowNames(basePage, pageIndex) {
    return (basePage.baseAreaByArea.get(pageIndex) ?? []).map(baseIndex => baseIndex == null ? "" : basePage.areas[baseIndex].flowName);
}

/**
 * Builds the "Base" CSV rows of the base templates and, per page, the baseTemplateTargetId and
 * interactiveFlowName of each of its areas.
 * @param {BaseTemplateModel[]} baseTemplates
 * @returns {{baseRows: Record<string, string>[], overridesByPageIndex: Map<number, {flowNames: string[], targetId: string}>}}
 *   baseRows are keyed by logical column name; missing columns are written empty
 */
function buildExportData(baseTemplates) {
    /** @type {Record<string, string>[]} */
    const baseRows = [];
    /** @type {Map<number, {flowNames: string[], targetId: string}>} */
    const overridesByPageIndex = new Map();

    baseTemplates.forEach(baseTemplate => baseTemplate.pages.forEach(basePage => {
        const size = basePage.pageSize;
        basePage.areas.forEach((area, areaIndex) => baseRows.push({
            templateId: baseTemplate.id,
            templateName: baseTemplate.name,
            pageId: basePage.id,
            pageName: basePage.name,
            type: "Base",
            interactiveFlowName: area.flowName,
            areaName: area.areaName,
            flowToNextPage: String(area.flowToNextPage),
            areaIndex: String(areaIndex),
            x: `${area.position.x}mm`,
            y: `${area.position.y}mm`,
            width: `${area.position.w}mm`,
            height: `${area.position.h}mm`,
            pageWidth: size ? `${size.w}mm` : "",
            pageHeight: size ? `${size.h}mm` : "",
        }));

        basePage.baseAreaByArea.forEach((_, pageIndex) => {
            overridesByPageIndex.set(pageIndex, {flowNames: areaFlowNames(basePage, pageIndex), targetId: `$${baseTemplate.id}`});
        });
    }));

    return {baseRows, overridesByPageIndex};
}

/**
 * Pages used by several templates that ended up in different base templates. Their mapping is
 * stored once per page, so the import keeps only the last base template.
 * @param {BaseTemplateModel[]} baseTemplates
 * @param {LayoutData} data
 * @returns {string[]} one message per conflicting page
 */
function findSharedPageConflicts(baseTemplates, data) {
    /** @type {Map<string, Set<string>>} */
    const baseTemplateIdsByPageId = new Map();
    indexBasePagesByPage(baseTemplates).forEach(({baseTemplate}, pageIndex) => {
        const pageId = data.pages[pageIndex].pageId;
        if (pageId == null) return;
        if (!baseTemplateIdsByPageId.has(pageId)) baseTemplateIdsByPageId.set(pageId, new Set());
        /** @type {Set<string>} */ (baseTemplateIdsByPageId.get(pageId)).add(baseTemplate.id);
    });
    return [...baseTemplateIdsByPageId]
        .filter(([, ids]) => ids.size > 1)
        .map(([pageId, ids]) => `page ${pageId} is in ${[...ids].join(", ")}`);
}

async function saveCsv() {
    if (!currentCsv) {
        setStatus("No CSV loaded to save.", "error");
        return;
    }
    if (!currentData || !currentViewModel || !currentAnalysis) {
        setStatus("No layout data loaded to save.", "error");
        return;
    }

    const headers = [...currentCsv.headers];
    // Copies of the loaded rows, looked up by the original row the areas reference.
    /** @type {Map<string[], string[]>} */
    const copyBySourceRow = new Map(currentCsv.standardRows.map(row => [row, [...row]]));
    const rows = [...copyBySourceRow.values()];

    const typeIdx = ensureCsvColumn(headers, rows, "type");
    const targetIdIdx = ensureCsvColumn(headers, rows, "baseTemplateTargetId");
    const flowNameIdx = ensureCsvColumn(headers, rows, "interactiveFlowName");

    const { baseRows, overridesByPageIndex } = buildExportData(currentBaseTemplates);

    currentData.pages.forEach((page, pageIndex) => {
        const override = overridesByPageIndex.get(pageIndex);
        if (!override) return;
        page.sourceRows.forEach((sourceRow, areaIndex) => {
            const row = copyBySourceRow.get(sourceRow);
            if (!row) return;
            row[targetIdIdx] = override.targetId;
            const flowName = override.flowNames[areaIndex];
            if (flowName != null) row[flowNameIdx] = flowName;
        });
    });

    for (let i = rows.length - 1; i >= 0; i--) {
        if (rows[i].every(cell => cell === "")) {
            rows.splice(i, 1);
        } else if (!rows[i][typeIdx]) {
            rows[i][typeIdx] = "Standard";
        }
    }

    baseRows.forEach(baseRow => {
        rows.push(headers.map(h => baseRow[normalizeHeaderName(h)] ?? ""));
    });

    const text = serializeCsv(headers, rows);
    const fileName = currentCsv.fileName;
    const conflicts = findSharedPageConflicts(currentBaseTemplates, currentData);
    const warning = conflicts.length
        ? ` - warning: ${conflicts.join("; ")}; the import keeps only the last base template of such pages`
        : "";
    const resultKind = conflicts.length ? "error" : "ok";

    if (typeof window.showSaveFilePicker === "function") {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: "CSV file", accept: { "text/csv": [".csv"] } }],
            });
            const writable = await handle.createWritable();
            await writable.write(text);
            await writable.close();
            setStatus(`Saved ${handle.name}${warning}`, resultKind);
            return;
        } catch (err) {
            if (/** @type {Error} */ (err).name === "AbortError") return;
            setStatus("Error saving file: " + /** @type {Error} */ (err).message, "error");
            return;
        }
    }

    const blob = new Blob([text], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus(`Downloaded ${fileName}${warning}`, resultKind);
}

saveCsvBtn.addEventListener("click", () => { saveCsv(); });

// Hovering a template chip highlights the pages of that template.
/** @param {Event} e @param {boolean} on */
function highlightTemplatePages(e, on) {
    const chip = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (e.target).closest?.(".template-tag"));
    const groupEl = chip?.closest("li");
    if (!chip || !groupEl) return;
    groupEl.querySelectorAll(".page-tag").forEach(tag => {
        tag.classList.toggle("highlight", on && /** @type {HTMLElement} */ (tag).dataset.templateId === chip.dataset.templateId);
    });
}
const templateGroupsEl = /** @type {HTMLElement} */ (document.getElementById("template-groups"));
templateGroupsEl.addEventListener("mouseover", e => highlightTemplatePages(e, true));
templateGroupsEl.addEventListener("mouseout", e => highlightTemplatePages(e, false));

document.body.addEventListener("dragover", e => {
    e.preventDefault();
    document.body.classList.add("drag-over");
});
document.body.addEventListener("dragleave", e => {

document.getElementById("card-size").addEventListener("input", (e) => {
