<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Layout Analysis</title>
    <style>
        :root {
            --fg: #111;
            --muted: #666;
            --line: #e6e6e6;
            --bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 24px;
            color: var(--fg);
            background: #fff;
        }

        /* A fixed bar across the top; the page and the inspector start below it. */
        :root {
            --toolbar-height: 40px;
        }

        body {
            padding-top: calc(var(--toolbar-height) + 4px);
            margin-top: 12px;
        }

        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            height: var(--toolbar-height);
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            align-items: center;
            padding: 0 12px 0 16px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        .toolbar button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .toolbar .icon-btn {
            padding: 0;
            width: 28px;
            height: 28px;
        }

        .toolbar > * {
            flex-shrink: 0;
        }

        /* The file name and status give way first when the bar gets narrow. */
        .toolbar > .file-name, .toolbar > .status {
            flex-shrink: 1;
            min-width: 0;
        }

        .toolbar .file-name {
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            color: var(--muted);
        }

        .toolbar .status {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
        }

        #file {
            display: none;
        }

        @media (max-width: 1000px) {
            .toolbar {
                gap: 6px;
            }

            .toolbar-sep {
                display: none;
            }

            .zoom-control input[type="range"] {
                width: 56px;
            }
        }

        button, input[type="file"] {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--bg);
            cursor: pointer;
            font-size: 13px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .status {
            font-size: 13px;
            color: var(--muted);
        }

        .status.error {
            color: #c00;
        }

        .status.ok {
            color: #2a7a2a;
        }

        body.drag-over {
            outline: 3px dashed #6b9fd4;
            outline-offset: -12px;
        }

        /* Moving templates and pages between groups by drag and drop. Drop targets show only while
           dragging. */
        .template-tag[draggable="true"], .page-tag[draggable="true"] {
            cursor: grab;
        }

        .dragging-source {
            opacity: 0.4;
        }

        .template-groups > li.drop-target {
            border-color: #2f7de1;
            box-shadow: 0 0 0 2px #dbe8f8;
        }

        .page-group.drop-target > .pg-row {
            background: #e8f0fb;
        }

        .drop-zone {
            margin: 6px 14px;
            padding: 8px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .template-groups > li.drop-zone {
            margin: 0 0 14px;
            padding: 14px;
            border: 1px dashed #bbb;
            border-radius: 10px;
        }

        .drop-zone.drop-target, .template-groups > li.drop-zone.drop-target {
            border: 1px solid #2f7de1;
            background: #e8f0fb;
            color: var(--fg);
        }

        /* Inspector: a full-height sidebar on the right; the page makes room for it when open. */
        :root {
            --inspector-width: 360px;
        }

        body {
            transition: margin-right 0.2s ease;
        }

        body:not(.inspector-hidden) {
            margin-right: calc(var(--inspector-width) + 24px);
        }

        .inspector {
            position: fixed;
            top: var(--toolbar-height);
            right: 0;
            bottom: 0;
            width: var(--inspector-width);
            display: flex;
            flex-direction: column;
            background: #fff;
            border-left: 1px solid var(--line);
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.04);
            font-size: 13px;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        body.inspector-hidden .inspector {
            transform: translateX(100%);
            box-shadow: none;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 6px;
            background: none;
            color: var(--muted);
        }

        .icon-btn:hover {
            background: #f0f0f0;
            color: var(--fg);
        }

        .icon-btn:disabled {
            color: #ccc;
            background: none;
            cursor: default;
        }

        .icon-btn.active {
            color: #2f7de1;
        }

        .insp-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .insp-kind {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .insp-position-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .insp-position-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px 12px;
        }

        .insp-number {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .insp-number input {
            width: 100%;
            min-width: 0;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
            color: var(--fg);
        }

        .insp-number input:focus {
            outline: none;
            border-color: #2f7de1;
            box-shadow: 0 0 0 2px #dbe8f8;
        }

        .insp-number input.edited {
            border-color: #2f7de1;
        }

        .insp-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 4px 0;
        }

        .insp-label {
            width: 104px;
            flex-shrink: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .insp-field {
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            position: relative;
        }

        .insp-field .insp-reset {
            position: absolute;
            top: -4px;
            right: 0;
        }

        .insp-field input {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        .insp-field input:focus {
            outline: none;
            border-color: #2f7de1;
            box-shadow: 0 0 0 2px #dbe8f8;
        }

        .insp-field input.edited {
            border-color: #2f7de1;
        }

        .insp-reset {
            width: 26px;
            height: 26px;
        }

        .insp-checks {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .insp-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .insp-check input {
            margin: 0;
            accent-color: #2f7de1;
        }

        /* A flag the user changed from the proposal; clicking it again goes back. */
        .insp-check.edited {
            color: #2f7de1;
        }

        .name-link {
            cursor: pointer;
            border-radius: 3px;
        }

        .name-link:hover {
            background: #eef4fc;
        }

        .name-link.inspected {
            background: #dbe8f8;
        }

        /* Template groups */
        .template-groups {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .template-groups > li {
            margin-bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            transition: opacity 0.2s;
        }

        .tg-header {
            padding: 8px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .tg-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        /* Right side of the header: the closest-group hint and, behind a separator, the fix toggle. */
        .tg-side {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .tg-side .lock-mark {
            min-width: 46px;
        }

        .tg-side .hint {
            padding-right: 10px;
            border-right: 1px solid #ddd;
            line-height: 18px;
        }

        .tg-templates {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
            min-width: 240px;
        }

        .template-tag:hover {
            border-color: #6b9fd4;
            color: var(--fg);
        }

        /* Pages of the template chip under the mouse. */
        .page-tag.highlight {
            background: #dbe8f8;
        }

        .tg-name {
            font-weight: 600;
            flex-shrink: 0;
        }

        .template-tag {
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            color: var(--muted);
            background: #fff;
        }

        /* A name the tool proposed (derived), as opposed to one the user set. */
        /* A name the tool proposed (derived), as opposed to one the user set: underlined dotted,
           like the dashed frames of the computed base areas. */
        .derived {
            text-decoration: underline dotted #aaa;
            text-underline-offset: 3px;
        }

        .page-groups {
            padding: 6px 0;
        }

        .page-group {
            border-bottom: 1px solid var(--line);
        }

        .page-group:last-child {
            border-bottom: none;
        }

        .pg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 14px;
            cursor: pointer;
            user-select: none;
        }

        .pg-row:hover {
            background: #f5f8ff;
        }

        .pg-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 200px;
            flex-shrink: 0;
            min-width: 0;
            font-size: 13px;
            line-height: 22px;
        }

        .pg-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .pg-cohesion {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .cohesion-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }


        .cohesion-high {
            background: #22c55e;
        }

        .cohesion-mid {
            background: #f59e0b;
        }

        .cohesion-low {
            background: #ef4444;
        }

        .cohesion-solo {
            background: #d1d5db;
        }

        /* Drag handle to reorder the base pages; an empty placeholder keeps the rows aligned. */
        .pg-handle {
            width: 10px;
            flex-shrink: 0;
            margin-right: -4px;
            color: #bbb;
            font-size: 13px;
            line-height: 22px;
            text-align: center;
        }

        .pg-handle[draggable="true"] {
            cursor: grab;
        }

        .pg-handle[draggable="true"]:hover {
            color: var(--fg);
        }

        .page-group.drop-before > .pg-row {
            box-shadow: inset 0 2px 0 #2f7de1;
        }

        .page-group.drop-after > .pg-row {
            box-shadow: inset 0 -2px 0 #2f7de1;
        }

        .pg-expand-icon {
            width: 10px;
            font-size: 9px;
            line-height: 22px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .page-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            flex: 1;
        }

        .page-tag {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 12px;
            white-space: nowrap;
        }

        .pg-cards {
            display: none;
            flex-wrap: wrap;
            gap: 16px;
            padding: 10px 14px 14px 36px;
            background: #fafbff;
            border-top: 1px dashed var(--line);
        }

        .pg-cards.open {
            display: flex;
        }

        .page-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .page-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            font-size: 11px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }

        .page-card-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hint {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .page-card svg {
            display: block;
            background: #fff;
        }

        .page-svg.selectable .area-rect {
            cursor: pointer;
        }

        /* Every card has a footer of the same fixed height, so nothing moves when areas are selected. */
        .card-footer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            padding: 0 6px;
            border-top: 1px solid var(--line);
            background: var(--bg);
            overflow: hidden;
        }

        .card-footer .hint {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer button {
            flex-shrink: 0;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 11px;
            background: #fff;
        }

        .page-card.representative {
            border-color: #e0a800;
            box-shadow: 0 0 0 1px #e0a800;
        }

        .rep-btn {
            flex-shrink: 0;
            width: 22px;
            height: 20px;
            padding: 0;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1;
            color: #999;
            background: #fff;
        }

        .rep-btn:hover:not(:disabled) {
            border-color: #e0a800;
            color: #e0a800;
        }

        .rep-btn.active {
            border-color: #e0a800;
            color: #e0a800;
        }

        .rep-btn.active.manual {
            background: #e0a800;
            color: #fff;
        }

        .rep-mark {
            color: #e0a800;
            margin-right: 3px;
        }

        .lock-mark {
            flex-shrink: 0;
            padding: 0 6px;
            border: 1px solid #e0a800;
            border-radius: 4px;
            background: #fff8e1;
            color: #8a6d00;
            font-size: 11px;
            line-height: 18px;
        }

        .lock-mark.differs {
            background: #e0a800;
            color: #fff;
        }

        .lock-mark:hover {
            border-color: #b08400;
        }

        .lock-mark.unfixed {
            border: 1px dashed #ccc;
            background: none;
            color: #999;
        }

        .lock-mark.unfixed:hover {
            border-color: #e0a800;
            color: #8a6d00;
        }

        /* A fixed square with the glyph centred, so the star sits in the middle of the line, not on its baseline. */
        .rep-mark.pinned {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            background: #e0a800;
            color: #fff;
            border-radius: 3px;
            font-size: 11px;
            line-height: 1;
        }

        .rep-mark.unused, .edit-mark.unused {
            color: #bbb;
        }

        button.rep-mark.use-computed {
            border: none;
            background: none;
            padding: 0;
            font-size: inherit;
            line-height: inherit;
        }

        button.rep-mark.use-computed:hover {
            color: #b08400;
        }

        .edit-mark {
            margin-left: 3px;
            color: #2f7de1;
        }

        #recalculate-all.differs {
            border-color: #e0a800;
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: #ddd;
            margin: 0 4px;
        }

        /* Proposal settings in a popover under their button. */
        .popover-anchor {
            position: relative;
        }

        #toggle-proposal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        #toggle-proposal[aria-expanded="true"] {
            background: #eef4fc;
            border-color: #6b9fd4;
        }

        #toggle-proposal .caret {
            font-size: 9px;
            color: var(--muted);
        }

        /* The number of manual decisions; gold when some differ from the computed proposal. */
        .decision-badge {
            min-width: 16px;
            padding: 0 5px;
            border-radius: 8px;
            background: #e8e8e8;
            color: var(--fg);
            font-size: 11px;
            line-height: 16px;
            text-align: center;
        }

        .decision-badge.differs {
            background: #e0a800;
            color: #fff;
        }

        .popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 280px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            white-space: normal;
        }

        .popover[hidden] {
            display: none;
        }

        .pop-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .pop-label {
            width: 64px;
            flex-shrink: 0;
            color: var(--muted);
        }

        .pop-row input[type="range"] {
            flex: 1;
            min-width: 0;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            accent-color: #6b9fd4;
        }

        .pop-row output {
            min-width: 2.6em;
            color: #4a7ab5;
            font-weight: 600;
            text-align: right;
        }

        .pop-row select {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: var(--bg);
            font-size: 12px;
            cursor: pointer;
        }

        .pop-sep {
            height: 1px;
            background: var(--line);
        }

        .pop-summary {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .popover #recalculate-all {
            align-self: flex-start;
        }

        /* Page card size: a small zoom slider next to the inspector toggle. */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
        }

        .zoom-control input[type="range"] {
            width: 80px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            accent-color: #6b9fd4;
        }

        code {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file" accept=".csv"/>
    <button id="open-file" title="Open a layout CSV (or drop it on the page)">Open CSV…</button>
    <span class="file-name" id="file-name"></span>
    <button id="save-csv" disabled title="Save the loaded CSV, optionally with edits, back to disk">Export</button>
    <div class="toolbar-sep"></div>
    <button id="undo" class="icon-btn" disabled title="Undo (Ctrl+Z)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h7a3 3 0 0 1 0 6H7"/><path d="M6 4 3.5 6.5 6 9"/></svg></button>
    <button id="redo" class="icon-btn" disabled title="Redo (Ctrl+Y or Ctrl+Shift+Z)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6.5h-7a3 3 0 0 0 0 6H9"/><path d="M10 4l2.5 2.5L10 9"/></svg></button>
    <div class="toolbar-sep"></div>
    <div class="popover-anchor">
        <button id="toggle-proposal" aria-haspopup="true" aria-expanded="false" title="How the proposal is computed, and your decisions">
            Proposal<span class="decision-badge" id="decision-badge" hidden></span><span class="caret">▾</span>
        </button>
        <div class="popover" id="proposal-popover" hidden>
            <label class="pop-row" title="Similarity threshold for grouping pages and templates">
                <span class="pop-label">Threshold</span>
                <input type="range" id="threshold" min="0.10" max="0.95" step="0.01" value="0.60"/>
                <output id="threshold-out">0.60</output>
            </label>
            <label class="pop-row" title="Grouping linkage strategy">
                <span class="pop-label">Strategy</span>
                <select id="group-strategy">
                    <option value="average" selected>Average</option>
                    <option value="single">Single (any pair)</option>
                    <option value="complete">Complete (all pairs)</option>
                </select>
            </label>
            <div class="pop-sep"></div>
            <div class="pop-summary" id="decision-summary"></div>
            <button id="recalculate-all" disabled>Recalculate all</button>
        </div>
    </div>
    <div class="status" id="status"></div>
    <label class="zoom-control" title="Page card size">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.4" y1="10.4" x2="14" y2="14"/></svg>
        <input type="range" id="card-size" min="180" max="700" step="10" value="400"/>
    </label>

// ─── 3. CSV reading and writing ──────────────────────────────────────────────────────────────────
//
// The layout CSV of LayoutExport / LayoutImport: parsing, column lookup and serialization.

/**
 * Parses CSV text (RFC 4180) into records. Quoted fields may contain commas, doubled quotes and
 * line breaks. As in Csv.groovy's split, a quote opens a quoted field only at the very start of a
 * field; anywhere else it is kept literally. A leading byte order mark (added by Excel) is ignored
 * and blank lines are skipped.
 * @param {string} text
 * @returns {{cells: string[], line: number}[]} records with the 1-based line they start on
 */
function parseCsv(text) {
    /** @type {{cells: string[], line: number}[]} */
    const records = [];
    /** @type {string[]} */
    let cells = [];
    let field = "", inQuotes = false, wasQuoted = false;
    let line = 1, recordLine = 1;
    const endField = () => { cells.push(field); field = ""; wasQuoted = false; };
    const endRecord = () => {
        endField();
        if (cells.length > 1 || cells[0] !== "") records.push({cells, line: recordLine});
        cells = [];
    };

    let i = text.charCodeAt(0) === 0xFEFF ? 1 : 0;
    for (; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
            else if (c === '"') { inQuotes = false; }
            else { if (c === "\n") line++; field += c; }
        } else if (c === ",") {
            endField();
        } else if (c === "\r" || c === "\n") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            endRecord();
            line++;
            recordLine = line;
        } else if (c === '"' && field === "" && !wasQuoted) {
            inQuotes = true;
            wasQuoted = true;
        } else {
            field += c;
        }
    }
    if (field !== "" || cells.length || wasQuoted) endRecord();
    return records;
}

/**
 * Parses a Size string (e.g. "210.0000mm", "595.2756pt", "8.2677in") to millimetres.
 * Returns null for empty or invalid input.
 * @param {string} str
 * @returns {number|null}
 */
function parseSizeMm(str) {
    if (!str || !str.trim()) return null;
    const m = str.trim().match(/^(-?\d*\.?\d+)\s*(pt|mm|cm|dm|m|in)$/i);
    if (!m) return null;
    const v = parseFloat(m[1]);
    let mm;
    switch (m[2].toLowerCase()) {
        case 'pt': mm = v * 25.4 / 72; break;
        case 'mm': mm = v; break;
        case 'cm': mm = v * 10; break;
        case 'dm': mm = v * 100; break;
        case 'm':  mm = v * 1000; break;
        case 'in': mm = v * 25.4; break;
        default:   return null;
    }
    return roundTo(mm, 2);
}

/**
 * Reads the layout CSV into a {@link CsvDocument}. "Base" rows are kept apart from the standard
 * rows: they restore the base templates on load and are regenerated from the model on export.
 * @param {string} text
 * @param {string} fileName
 * @returns {CsvDocument}
 */
function readCsvDocument(text, fileName) {
    const [headerRecord, ...dataRecords] = parseCsv(text);
    if (!headerRecord) throw new Error("The file is empty.");
    const headers = headerRecord.cells;
    const typeIdx = columnIndex(headers, "type");

    /** @type {string[][]} */
    const standardRows = [];
    /** @type {number[]} */
    const standardRowLines = [];
    /** @type {string[][]} */
    const baseRows = [];
    dataRecords.forEach(({cells, line}) => {
        while (cells.length < headers.length) cells.push("");
        if (typeIdx >= 0 && (cells[typeIdx] ?? "").trim().toLowerCase() === "base") {
            baseRows.push(cells);
            return;
        }
        standardRows.push(cells);
        standardRowLines.push(line);
    });
    return {headers, standardRows, standardRowLines, baseRows, fileName};
}

/**
 * Header name without the " (read-only)" suffix added by Mapping.displayHeader.
 * @param {string} header
 * @returns {string}
 */
function normalizeHeaderName(header) {
    const s = (header ?? "").trim();
    return s.endsWith(" (read-only)") ? s.slice(0, -" (read-only)".length).trim() : s;
}

/**
 * @param {string[]} headers
 * @param {string} logicalName
 * @returns {number} -1 when the column is missing
 */
function columnIndex(headers, logicalName) {
    return headers.findIndex(h => normalizeHeaderName(h) === logicalName);
}

/**
 * Returns the index of the given column, inserting it (before contentPreview) when missing.
 * @param {string[]} headers
 * @param {string[][]} rows
 * @param {string} logicalName
 * @returns {number}
 */
function ensureCsvColumn(headers, rows, logicalName) {
    const idx = columnIndex(headers, logicalName);
    if (idx >= 0) return idx;
    const insertIdx = headers.findIndex(h => normalizeHeaderName(h) === "contentPreview");
    const at = insertIdx >= 0 ? insertIdx : headers.length;
    headers.splice(at, 0, logicalName);
    rows.forEach(row => { row.splice(at, 0, ""); });
    return at;
}

/**
 * @param {string} field
 * @returns {string}
 */
function csvEscapeField(field) {
    const s = field ?? "";
    if (/[",\r\n]/.test(s)) {
        return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
}

/**
 * @param {string[]} headers
 * @param {string[][]} rows
 * @returns {string}
 */
function serializeCsv(headers, rows) {
    const lines = [headers.map(csvEscapeField).join(",")];
    for (const row of rows) {
        lines.push(row.map(csvEscapeField).join(","));
    }
    return lines.join("\r\n") + "\r\n";
}

/**
 * Derives a human-friendly interactive flow name from an area's content preview,
 * e.g. "docRef: address" -> "address". Returns null if no usable name can be derived.
 * @param {string} contentPreview
 * @returns {string|null}
 */
function parseFlowNameFromPreview(contentPreview) {
    if (!contentPreview) return null;
    const first = contentPreview.split(";")[0]?.trim();
    if (!first) return null;
    const colonIdx = first.indexOf(": ");
    const value = colonIdx === -1 ? first : first.slice(colonIdx + 2).trim();
    return value || null;
}

// ─── 4. Layout data ──────────────────────────────────────────────────────────────────────────────
//
// Templates, pages and areas built from the standard rows, and the keys that identify them.

/**
 * Computes containment for each area: the index of its smallest enclosing area, or null.
 * @param {{x: number, y: number, w: number, h: number}[]} areas
 * @returns {(number|null)[]}
 */
function computeContainment(areas) {
    const tolerance = 0.7;
    const containment = /** @type {(number|null)[]} */ (new Array(areas.length).fill(null));
    for (let i = 0; i < areas.length; i++) {
        const inner = areas[i];
        const innerSize = inner.w * inner.h;
        for (let j = 0; j < areas.length; j++) {
            if (i === j) continue;
            const outer = areas[j];
            const outerSize = outer.w * outer.h;
            if (outerSize <= innerSize) continue;
            if (outer.x - tolerance <= inner.x && outer.y - tolerance <= inner.y
                    && (inner.x + inner.w) <= (outer.x + outer.w) + tolerance
                    && (inner.y + inner.h) <= (outer.y + outer.h) + tolerance) {
                const cur = containment[i];
                const curSize = cur != null ? areas[cur].w * areas[cur].h : Infinity;
                if (curSize > outerSize) containment[i] = j;
            }
        }
    }
    return containment;
}

/**
 * Builds the LayoutData from the standard rows of a layout CSV produced by LayoutExport.groovy.
 * Templates and templatePageIndex are derived from row order; containedIn is computed from geometry.
 * Every page keeps references to its source rows so the export can write values back to them.
 * @param {CsvDocument} doc
 * @returns {LayoutData}
 */
function buildLayoutData(doc) {
    /** @type {Map<string, number>} */
    const indexByName = new Map();
    doc.headers.forEach((header, idx) => {
        const name = normalizeHeaderName(header);
        if (!indexByName.has(name)) indexByName.set(name, idx);
    });

    /** @param {string[]} row @param {string} name @returns {string} */
    const col = (row, name) => { const idx = indexByName.get(name); return idx != null ? (row[idx] ?? '') : ''; };

    /** @type {Map<string, {meta: {pageId:string|null,pageName:string|null,templateId:string|null,templateName:string|null,pageWidth:string,pageHeight:string}, rows:string[][], lines:number[]}>} */
    const pageMap = new Map();
    for (let i = 0; i < doc.standardRows.length; i++) {
        const row = doc.standardRows[i];

        const pageId = col(row, 'pageId') || null;
        const templateId = col(row, 'templateId') || null;
        const pageKey = pageId && templateId
            ? `tmpl:${templateId}:page:${pageId}`
            : pageId
                ? `page:${pageId}`
                : templateId
                    ? `virtual:${templateId}`
                    : `row:${i}`;
        if (!pageMap.has(pageKey)) {
            pageMap.set(pageKey, {
                meta: {
                    pageId,
                    pageName: col(row, 'pageName') || null,
                    templateId,
                    templateName: col(row, 'templateName') || null,
                    pageWidth: col(row, 'pageWidth'),
                    pageHeight: col(row, 'pageHeight'),
                },
                rows: [],
                lines: [],
            });
        }
        pageMap.get(pageKey).rows.push(row);
        pageMap.get(pageKey).lines.push(doc.standardRowLines[i]);
    }

    /** @type {Map<string, number>} */
    const pageIndexMap = new Map();
    /** @type {Map<string, number>} */
    const tmplPageCounter = new Map();
    for (const [pageKey, { meta }] of pageMap) {
        if (!meta.templateId || !meta.pageId) continue;
        const n = tmplPageCounter.get(meta.templateId) ?? 0;
        pageIndexMap.set(pageKey, n);
        tmplPageCounter.set(meta.templateId, n + 1);
    }

    /** @type {PageEntry[]} */
    const pages = [];
    for (const [pageKey, { meta, rows, lines }] of pageMap) {
        const rawAreasWithRow = rows.map((row, idx) => {
            const x = parseSizeMm(col(row, 'x'));
            const y = parseSizeMm(col(row, 'y'));
            const w = parseSizeMm(col(row, 'width'));
            const h = parseSizeMm(col(row, 'height'));
            if (x == null || y == null || w == null || h == null) return null;
            const areaIndex = Number(col(row, 'areaIndex').trim());
            if (Number.isNaN(areaIndex)) {
                throw new Error(`Row on line ${lines[idx]} is missing a valid areaIndex value.`);
            }
            return {
                area: {
                    x, y, w, h,
                    flowToNextPage: col(row, 'flowToNextPage') === 'true',
                    dynamicHeight: col(row, 'dynamicHeight') === 'true',
                    interactiveFlowName: col(row, 'interactiveFlowName') || '',
                    areaName: col(row, 'areaName') || '',
                    contentPreview: col(row, 'contentPreview') || '',
                },
                row,
                areaIndex,
            };
        }).filter(a => a != null);
        rawAreasWithRow.sort((a, b) => a.areaIndex - b.areaIndex);
        const rawAreas = /** @type {{x:number,y:number,w:number,h:number,flowToNextPage:boolean,dynamicHeight:boolean,interactiveFlowName:string,areaName:string,contentPreview:string}[]} */ (
            rawAreasWithRow.map(a => a.area)
        );

        const containment = computeContainment(rawAreas);
        const areas = /** @type {AreaEntry[]} */ (rawAreas.map((a, idx) => ({ ...a, containedIn: containment[idx] })));

        const pw = parseSizeMm(meta.pageWidth);
        const ph = parseSizeMm(meta.pageHeight);
        pages.push(/** @type {PageEntry} */ ({
            pageId: meta.pageId,
            pageName: meta.pageName,
            pageSize: pw != null && ph != null ? { w: pw, h: ph } : null,
            templateId: meta.templateId,
            templateName: meta.templateName,
            templatePageIndex: pageIndexMap.get(pageKey) ?? null,
            areas,
            sourceRows: rawAreasWithRow.map(a => a.row),
            baseTemplateTargetId: rows.map(row => col(row, 'baseTemplateTargetId').trim()).find(Boolean) ?? '',
        }));
    }

    return { pages, templates: deriveTemplates(pages) };
}

/**
 * @param {PageEntry[]} pages
 * @returns {TemplateEntry[]}
 */
function deriveTemplates(pages) {
    /** @type {Map<string, number[]>} */
    const templatePages = new Map();
    pages.forEach((page, pageIndex) => {
        const key = page.templateId ?? `orphan:${page.pageId}`;
        if (!templatePages.has(key)) templatePages.set(key, []);
        templatePages.get(key).push(pageIndex);
    });
    return [...templatePages.entries()].map(([key, pageIndices]) => {
        const sortedPageIndices = [...pageIndices].sort((a, b) => {
            const pageA = pages[a];
            const pageB = pages[b];
            return templatePageOrder(pageA) - templatePageOrder(pageB) || a - b;
        });
        const first = pages[sortedPageIndices[0]];
        const isOrphan = first.templateId == null;
        return {
            templateId: first.templateId ?? key,
            templateName: isOrphan
                ? `Orphan: ${first.pageName ?? first.pageId ?? "Unknown"}`
                : (first.templateName ?? first.templateId ?? key),
            pageIndices: sortedPageIndices,
        };
    });
}

/**
 * @param {string[]} templateIds
 * @returns {string}
 */
function templateGroupKey(templateIds) {
    return `tmpl:${[...templateIds].sort().join("|")}`;
}

/**
 * @param {LayoutData} data
 * @param {number[]} pageIndices
 * @returns {string}
 */
function pageGroupKey(data, pageIndices) {
    return `pg:${pageIndices.map(i => renderUnitKey(data.pages[i], i)).sort().join("|")}`;
}

/**
 * @param {PageEntry} page
 * @param {number} pageIndex
 * @returns {string}
 */
function renderUnitKey(page, pageIndex) {
    if (page.pageId != null) return `page:${page.pageId}`;
    if (page.templateId != null) return `virtual:${page.templateId}:${pageIndex}`;
    return `index:${pageIndex}`;
}

/**
 * @param {PageEntry} page
 * @returns {number}
 */
function templatePageOrder(page) {
    return page.templatePageIndex ?? Number.MAX_SAFE_INTEGER;
}

// ─── 5. Similarity and grouping ──────────────────────────────────────────────────────────────────
//
// How similar pages and templates are, and the proposed grouping: templates into template groups
// (base templates), their pages into page groups (base pages). Fixed groups are kept as they are.

/**
 * Geometric distance between two rectangles, in units where ~0.5 is "clearly different".
 * x, y and width are normalized to the page reference width; height uses a log ratio so a 3x
 * difference counts as 1.0.
 * @param {{x: number, y: number, w: number, h: number}} a
 * @param {{x: number, y: number, w: number, h: number}} b
 * @param {boolean} includeY
 * @returns {number}
 */
function geometryDistance(a, b, includeY) {
    const xDist = Math.abs(a.x - b.x) / PAGE_REF_MM;
    const yDist = includeY ? Math.abs(a.y - b.y) / PAGE_REF_MM : 0;
    const wDist = Math.abs(a.w - b.w) / PAGE_REF_MM;
    const hRatio = Math.abs(Math.log(Math.max(a.h, 0.1) / Math.max(b.h, 0.1))) / Math.log(3);
    return Math.sqrt(xDist * xDist + yDist * yDist + wDist * wDist + hRatio * hRatio);
}

/**
 * @param {LayoutData} data
 * @param {LayoutAnalysis|null} previousAnalysis
 * @returns {LayoutAnalysis}
 */
function ensureAnalysis(data, previousAnalysis) {
    if (currentData === data && previousAnalysis != null) return previousAnalysis;
    return {
        similarity: buildSimilarity(data),
        pageBaseTemplateAreaDrafts: buildBaseTemplateAreaDrafts(data.pages, PROXIMITY_GAP_MM),
    };
}

/**
 * @param {LayoutData} data
 * @param {LayoutAnalysis} analysis
 * @param {Settings} activeSettings
 * @param {LockedGroup[]} lockedGroups
 * @returns {ViewModel}
 */
function buildViewModel(data, analysis, activeSettings, lockedGroups) {
    const {templateLevel, pageLevel} = analysis.similarity;
    const templateGroups = computeTemplateGroups(data, templateLevel, pageLevel.matrix, activeSettings, lockedGroups);
    /** @type {Record<string, PageGroup>} */
    const pageGroupByKey = {};
    const pageGroupKeys = new Set();

    templateGroups.forEach(group => {
        group.pageGroups.forEach(pageGroup => {
            pageGroupKeys.add(pageGroup.key);
            pageGroupByKey[pageGroup.key] = pageGroup;
        });
    });

    return {templateLevel, pageLevel, templateGroups, pageGroupByKey, pageGroupKeys};
}

/**
 * @param {LayoutData} data
 * @returns {Similarity}
 */
function buildSimilarity(data) {
    const pageMatrix = buildSymmetricMatrix(data.pages.length, (i, j) => pageSimilarity(data.pages[i].areas, data.pages[j].areas));
    const templateLevel = {templates: data.templates, matrix: []};
    templateLevel.matrix = buildSymmetricMatrix(data.templates.length, (i, j) =>
        templateSimilarity(data.templates[i].pageIndices, data.templates[j].pageIndices, pageMatrix)
    );
    return {
        pageLevel: {matrix: pageMatrix},
        templateLevel,
    };
}

/**
 * @param {number} size
 * @param {(i: number, j: number) => number} scoreFn
 * @returns {number[][]}
 */
function buildSymmetricMatrix(size, scoreFn) {
    /** @type {number[][]} */
    const matrix = [];
    for (let i = 0; i < size; i++) {
        matrix[i] = [];
        for (let j = 0; j < size; j++) {
            if (i === j) matrix[i][j] = 1;
            else if (j < i) matrix[i][j] = matrix[j][i];
            else matrix[i][j] = roundTo(scoreFn(i, j), 3);
        }
    }
    return matrix;
}

/**
 * Compare two pages by greedy bipartite matching on area geometry.
 * Each area is described by (x, width) normalized to page reference width and
 * height with a log-ratio so a 3x difference scores about 1.0.
 * @param {AreaEntry[]} areasA
 * @param {AreaEntry[]} areasB
 * @param {number} [matchThreshold]
 * @returns {number}
 */
function pageSimilarity(areasA, areasB, matchThreshold = 0.5) {
    if (!areasA.length || !areasB.length) return 0;

    /** @type {{distance: number, indexA: number, indexB: number}[]} */
    const areaMatches = [];
    areasA.forEach((areaA, indexA) => {
        areasB.forEach((areaB, indexB) => {
            areaMatches.push({distance: geometryDistance(areaA, areaB, false), indexA, indexB});
        });
    });
    areaMatches.sort((a, b) => a.distance - b.distance);

    const matchedA = new Set();
    const matchedB = new Set();
    let total = 0;
    areaMatches.forEach(match => {
        if (matchedA.has(match.indexA) || matchedB.has(match.indexB)) return;
        matchedA.add(match.indexA);
        matchedB.add(match.indexB);
        total += Math.max(0, 1 - match.distance / matchThreshold);
    });
    const slots = Math.max(areasA.length, areasB.length);
    return slots > 0 ? total / slots : 0;
}

/**
 * Compare two templates by positional page matching (page 1<->1, page 2<->2, ...).
 * Unmatched pages contribute 0, penalizing different template lengths proportionally.
 * @param {number[]} pagesA
 * @param {number[]} pagesB
 * @param {number[][]} pageMatrix
 * @returns {number}
 */
function templateSimilarity(pagesA, pagesB, pageMatrix) {
    const maxLen = Math.max(pagesA.length, pagesB.length);
    if (maxLen === 0) return 0;
    let total = 0;
    for (let i = 0; i < Math.min(pagesA.length, pagesB.length); i++)
        total += pageMatrix[pagesA[i]]?.[pagesB[i]] ?? 0;
    return total / maxLen;
}

/**
 * @param {LayoutData} data
 * @param {TemplateLevel} templateLevel
 * @param {number[][]} pageMatrix
 * @param {Settings} activeSettings
 * @param {LockedGroup[]} lockedGroups
 * @returns {TemplateGroup[]}
 */
function computeTemplateGroups(data, templateLevel, pageMatrix, activeSettings, lockedGroups) {
    const templates = templateLevel.templates;
    /** @type {Map<string, number>} */
    const indexById = new Map(templates.map((template, i) => [template.templateId, i]));
    /** @type {{templateIndices: number[], locked: LockedGroup|null}[]} */
    const groups = lockedGroups
        .map(locked => ({
            templateIndices: /** @type {number[]} */ (locked.templateIds.map(id => indexById.get(id)).filter(i => i != null)).sort((a, b) => a - b),
            locked,
        }))
        .filter(group => group.templateIndices.length);
    // Templates outside the fixed groups are grouped among themselves.
    const lockedIndices = new Set(groups.flatMap(group => group.templateIndices));
    const free = templates.map((_, i) => i).filter(i => !lockedIndices.has(i));
    groupPages(free, templateLevel.matrix, activeSettings).forEach(templateIndices => groups.push({templateIndices, locked: null}));
    groups.sort((a, b) => a.templateIndices[0] - b.templateIndices[0]);

    // Which groups the computation alone would form, to show where fixed groups differ.
    const computedKeys = new Set(lockedGroups.length
        ? groupPages(templates.map((_, i) => i), templateLevel.matrix, activeSettings)
            .map(templateIndices => templateGroupKey(templateIndices.map(i => templates[i].templateId)))
        : []);

    return groups.map(({templateIndices, locked}) => {
        const key = templateGroupKey(templateIndices.map(i => templates[i].templateId));
        const pageGroups = buildTemplatePageGroups(data, templateIndices, templateLevel, pageMatrix, activeSettings, locked?.pageGroups ?? []);
        let matchesComputed = !locked || computedKeys.has(key);
        if (locked && matchesComputed) {
            // The same templates; are their pages also grouped and ordered as computed?
            const order = (/** @type {PageGroup[]} */ list) => list.map(pageGroup => pageGroup.key).join("|");
            matchesComputed = order(pageGroups) === order(buildTemplatePageGroups(data, templateIndices, templateLevel, pageMatrix, activeSettings, []));
        }
        return {
            key,
            templateIds: templateIndices.map(i => templates[i].templateId),
            templateNames: templateIndices.map(i => templates[i].templateName ?? templates[i].templateId),
            pageGroups,
            locked,
            matchesComputed,
        };
    });
}

/**
 * @param {LayoutData} data
 * @param {number[]} templateIndices
 * @param {TemplateLevel} templateLevel
 * @param {number[][]} pageMatrix
 * @param {Settings} activeSettings
 * @param {number[][]} lockedPageGroups fixed page groups in base page order (pages of other templates
 *   are ignored); the remaining pages are grouped among themselves and follow them
 * @returns {PageGroup[]}
 */
function buildTemplatePageGroups(data, templateIndices, templateLevel, pageMatrix, activeSettings, lockedPageGroups) {
    const pageIndices = templateIndices
        .flatMap(templateIndex => templateLevel.templates[templateIndex].pageIndices)
        .sort((a, b) => a - b);
    const own = new Set(pageIndices);
    const locked = lockedPageGroups
        .map(group => group.filter(pageIndex => own.has(pageIndex)))
        .filter(group => group.length);
    const lockedPages = new Set(locked.flat());
    const free = pageIndices.filter(pageIndex => !lockedPages.has(pageIndex));
    /** @param {number[]} pg */
    const sorted = pg => [...pg].sort((a, b) => a - b);
    // Fixed page groups keep their order (the order of the base pages); the others follow, by first page.
    return [
        ...locked.map(pg => ({pageIndices: sorted(pg), locked: true})),
        ...groupPages(free, pageMatrix, activeSettings).map(pg => ({pageIndices: sorted(pg), locked: false}))
            .sort((a, b) => a.pageIndices[0] - b.pageIndices[0]),
    ].map(({pageIndices: pg, locked: isLocked}) => ({key: pageGroupKey(data, pg), pageIndices: pg, locked: isLocked}));
}

/**
 * Agglomerative grouping that always merges the two most similar groups first, until no pair of
 * groups reaches the threshold. The similarity of two groups depends on the linkage strategy:
 * - single:   the best pair of members (loose)
 * - average:  the average of all member pairs (default)
 * - complete: the worst pair of members (strict)
 * The result does not depend on the order of `indices` except for ties, which go to the earlier
 * groups. Members and groups are returned in `indices` order.
 * @param {number[]} indices
 * @param {number[][]} matrix
 * @param {Settings} activeSettings
 * @returns {number[][]}
 */
function groupPages(indices, matrix, activeSettings) {
    const {groupStrategy, groupThreshold} = activeSettings;
    const count = indices.length;
    /** @type {(number[]|null)[]} */
    const groups = indices.map(i => [i]);
    // linkage[a][b]: similarity between groups a and b, updated in place when groups merge.
    const linkage = indices.map(a => Float64Array.from(indices, b => matrix[a]?.[b] ?? 0));

    for (;;) {
        let bestA = -1, bestB = -1, best = -Infinity;
        for (let a = 0; a < count; a++) {
            if (!groups[a]) continue;
            const row = linkage[a];
            for (let b = a + 1; b < count; b++) {
                if (groups[b] && row[b] > best) { best = row[b]; bestA = a; bestB = b; }
            }
        }
        if (bestA < 0 || best < groupThreshold) break;

        const groupA = /** @type {number[]} */ (groups[bestA]);
        const groupB = /** @type {number[]} */ (groups[bestB]);
        for (let k = 0; k < count; k++) {
            if (!groups[k] || k === bestA || k === bestB) continue;
            const scoreA = linkage[bestA][k], scoreB = linkage[bestB][k];
            const merged =
                groupStrategy === "single"   ? Math.max(scoreA, scoreB) :
                groupStrategy === "complete" ? Math.min(scoreA, scoreB) :
                (scoreA * groupA.length + scoreB * groupB.length) / (groupA.length + groupB.length);
            linkage[bestA][k] = merged;
            linkage[k][bestA] = merged;
        }
        groupA.push(...groupB);
        groups[bestB] = null;
    }

    const positionOf = new Map(indices.map((index, position) => [index, position]));
    /** @param {number} x @param {number} y */
    const byPosition = (x, y) => /** @type {number} */ (positionOf.get(x)) - /** @type {number} */ (positionOf.get(y));
    return /** @type {number[][]} */ (groups.filter(Boolean))
        .map(group => group.sort(byPosition))
        .sort((x, y) => byPosition(x[0], y[0]));
}

/**
 * @param {number[]} pageGroup
 * @param {number[][]} matrix
 * @returns {number|null}
 */
function minPairScore(pageGroup, matrix) {
    if (pageGroup.length < 2) return null;
    let min = 1;
    for (let i = 0; i < pageGroup.length; i++)
        for (let j = i + 1; j < pageGroup.length; j++)
            min = Math.min(min, matrix[pageGroup[i]]?.[pageGroup[j]] ?? 0);
    return min;
}

// ─── 6. Area drafts ──────────────────────────────────────────────────────────────────────────────
//
// The areas of a page grouped into drafts of base areas: by proximity, or as merged/split by the user.

/**
 * Area drafts of every page: the user's area groups where the page has them, otherwise the
 * computed proximity grouping.
 * @param {LayoutData} data
 * @param {LayoutAnalysis} analysis
 * @param {Decisions} decisions
 * @returns {BaseTemplateAreaDraft[][]}
 */
function effectiveAreaDrafts(data, analysis, decisions) {
    return data.pages.map((page, pageIndex) => {
        const manual = decisions.areaGroupsByPage.get(renderUnitKey(page, pageIndex));
        return manual ? draftsFromAreaGroups(page.areas, manual) : (analysis.pageBaseTemplateAreaDrafts[pageIndex] ?? []);
    });
}

/**
 * Merges the drafts that contain any of the selected areas into one draft.
 * @param {number[][]} areaGroups
 * @param {Set<number>} selected
 * @returns {number[][]}
 */
function mergeAreaGroups(areaGroups, selected) {
    const touched = areaGroups.filter(group => group.some(areaIndex => selected.has(areaIndex)));
    const untouched = areaGroups.filter(group => !touched.includes(group));
    return [...untouched, touched.flat()];
}

/**
 * Takes the selected areas out of their drafts, each into a draft of its own.
 * @param {number[][]} areaGroups
 * @param {Set<number>} selected
 * @returns {number[][]}
 */
function splitAreaGroups(areaGroups, selected) {
    const remaining = areaGroups
        .map(group => group.filter(areaIndex => !selected.has(areaIndex)))
        .filter(group => group.length);
    return [...remaining, ...[...selected].map(areaIndex => [areaIndex])];
}

/**
 * What merge and split would do with the selection: merging needs areas of at least two drafts,
 * splitting needs a selected area that shares its draft with another area.
 * @param {BaseTemplateAreaDraft[]} drafts
 * @param {Set<number>} selected
 * @returns {{canMerge: boolean, canSplit: boolean}}
 */
function describeAreaSelection(drafts, selected) {
    const touched = drafts.filter(draft => draft.areaIndices.some(areaIndex => selected.has(areaIndex)));
    return {
        canMerge: touched.length >= 2,
        canSplit: touched.some(draft => draft.areaIndices.length > 1),
    };
}

/**
 * @param {number[][]} a
 * @param {number[][]} b
 * @returns {boolean} whether both group the same areas together, in any order
 */
function sameAreaGroups(a, b) {
    /** @param {number[][]} groups */
    const normalize = groups => groups.map(group => [...group].sort((x, y) => x - y).join(",")).sort().join("|");
    return normalize(a) === normalize(b);
}

/**
 * @param {PageEntry[]} pages
 * @param {number} groupingGap
 * @returns {BaseTemplateAreaDraft[][]}
 */
function buildBaseTemplateAreaDrafts(pages, groupingGap) {
    return pages.map(page => groupByProximity(page.areas, groupingGap));
}

/**
 * Automatic area grouping, a vertical sweep: areas whose Y ranges overlap or are within the
 * proximity gap of each other end up in the same base template area draft.
 * @param {AreaEntry[]} areas
 * @param {number} groupingGap
 * @returns {BaseTemplateAreaDraft[]}
 */
function groupByProximity(areas, groupingGap) {
    if (!areas.length) return [];
    const sortedIndices = areas.map((_, i) => i).sort((a, b) => areas[a].y - areas[b].y || areas[a].x - areas[b].x);
    /** @type {number[][]} */
    const groupedIndices = [];
    let current = [sortedIndices[0]];
    let curY2 = areas[sortedIndices[0]].y + areas[sortedIndices[0]].h;
    sortedIndices.slice(1).forEach(idx => {
        const area = areas[idx];
        if (area.y <= curY2 + groupingGap) {
            current.push(idx);
            curY2 = Math.max(curY2, area.y + area.h);
        } else {
            groupedIndices.push(current);
            current = [idx];
            curY2 = area.y + area.h;
        }
    });
    groupedIndices.push(current);
    return draftsFromAreaGroups(areas, groupedIndices);
}

/**
 * Builds area drafts from groups of area indices (computed or edited by the user), ordered top
 * to bottom, then left to right. Each draft spans the bounding box of its areas.
 * @param {AreaEntry[]} areas
 * @param {number[][]} areaGroups
 * @returns {BaseTemplateAreaDraft[]}
 */
function draftsFromAreaGroups(areas, areaGroups) {
    return areaGroups
        .filter(group => group.length)
        .map(group => [...group].sort((a, b) => a - b))
        .map(areaIndices => {
            const subset = areaIndices.map(index => areas[index]);
            const x = Math.min(...subset.map(area => area.x));
            const y = Math.min(...subset.map(area => area.y));
            return {areaIndices, x, y, x2: Math.max(...subset.map(area => area.x + area.w)), y2: Math.max(...subset.map(area => area.y + area.h))};
        })
        .sort((a, b) => a.y - b.y || a.x - b.x)
        .map(({areaIndices, x, y, x2, y2}, draftIndex) => {
            const areaName = areaIndices.map(idx => areas[idx].areaName).find(Boolean);
            const previewSource = areaIndices.map(idx => areas[idx].contentPreview).find(Boolean);
            return {
                areaIndices,
                position: {
                    x: roundTo(x, 2),
                    y: roundTo(y, 2),
                    w: roundTo(x2 - x, 2),
                    h: roundTo(y2 - y, 2),
                },
                name: areaName || parseFlowNameFromPreview(previewSource) || `Area ${draftIndex + 1}`,
                areaName: areaName || '',
            };
        });
}

// ─── 7. Base template model ──────────────────────────────────────────────────────────────────────
//
// One base template per template group and one base page per page group. Each base page takes
// its areas from a representative page: the page most similar to the rest of its group, unless
// the user picked another one (a manual decision). The area drafts of every other page in the
// group are matched to these base areas by geometry, which decides the interactiveFlowName
// written to their standard rows.

/**
 * The page most similar to all other pages of the group (highest summed similarity); ties go
 * to the earlier page.
 * @param {number[]} pageIndices
 * @param {number[][]} pageMatrix
 * @returns {number}
 */
function defaultRepresentative(pageIndices, pageMatrix) {
    let best = pageIndices[0], bestScore = -Infinity;
    pageIndices.forEach(candidate => {
        const score = pageIndices.reduce((sum, other) => other === candidate ? sum : sum + (pageMatrix[candidate]?.[other] ?? 0), 0);
        if (score > bestScore) { best = candidate; bestScore = score; }
    });
    return best;
}

/**
 * Maps every area of a page to the base area it lies in: the one covering the largest part of
 * it, or, when it overlaps none, the geometrically closest one. Every standard area therefore
 * ends up in an existing flow of the base template.
 * @param {AreaEntry[]} areas
 * @param {BaseTemplateAreaDraft[]} baseDrafts
 * @returns {(number|null)[]} base area index per area; null only when there are no base areas
 */
function mapAreasToBaseAreas(areas, baseDrafts) {
    return areas.map(area => {
        if (!baseDrafts.length) return null;
        let best = 0, bestCoverage = 0, bestDistance = Infinity;
        baseDrafts.forEach((base, baseIndex) => {
            const p = base.position;
            const overlapW = Math.min(area.x + area.w, p.x + p.w) - Math.max(area.x, p.x);
            const overlapH = Math.min(area.y + area.h, p.y + p.h) - Math.max(area.y, p.y);
            const coverage = overlapW > 0 && overlapH > 0 ? (overlapW * overlapH) / Math.max(area.w * area.h, 0.01) : 0;
            const distance = geometryDistance(area, p, true);
            if (coverage > bestCoverage || (coverage === bestCoverage && coverage === 0 && distance < bestDistance)) {
                best = baseIndex;
                bestCoverage = coverage;
                bestDistance = distance;
            }
        });
        return best;
    });
}

/**
 * Picks the name of a base area's interactive flow from its representative draft, in order of
 * preference: 1. the interactiveFlowName most used by the draft's areas, 2. the draft's area name,
 * 3. a name derived from its content preview. Names of other pages are not used: their areas may
 * be mapped to the base area only because nothing fits better. Generated names (2, 3) get a "Flow"
 * suffix. The result is Inspire-safe and unique in `usedNames`.
 * @param {AreaEntry[]} draftAreas the representative draft's areas
 * @param {BaseTemplateAreaDraft} representativeDraft
 * @param {Set<string>} usedNames names already used in the same base template; the result is added
 * @returns {string}
 */
function chooseFlowName(draftAreas, representativeDraft, usedNames) {
    /** @type {Map<string, number>} */
    const counts = new Map();
    draftAreas.forEach(area => {
        const name = area.interactiveFlowName.trim();
        if (name) counts.set(name, (counts.get(name) ?? 0) + 1);
    });
    let existing = "", existingCount = 0;
    counts.forEach((count, name) => { if (count > existingCount) { existing = name; existingCount = count; } });

    return uniqueName(inspireSafeName(existing || `${representativeDraft.name}Flow`), usedNames);
}

/**
 * `base`, or `base_2`, `base_3`... when already in `usedNames`; the result is added to `usedNames`.
 * @param {string} base
 * @param {Set<string>} usedNames
 * @returns {string}
 */
function uniqueName(base, usedNames) {
    let name = base;
    for (let n = 2; usedNames.has(name); n++) name = `${base}_${n}`;
    usedNames.add(name);
    return name;
}

/**
 * @param {LayoutData} data
 * @param {ViewModel} viewModel
 * @param {BaseTemplateAreaDraft[][]} areaDrafts area drafts of every page (manual or computed)
 * @param {Decisions} decisions
 * @param {LoadedIdentity} identity base templates of the loaded file, whose ids and names are kept
 * @returns {BaseTemplateModel[]}
 */
function buildBaseTemplates(data, viewModel, areaDrafts, decisions, identity) {
    const pageMatrix = viewModel.pageLevel.matrix;
    /** @type {Set<string>} */
    const usedTemplateNames = new Set();
    // New ids never reuse the id of a loaded base template, which may already exist in the DB.
    const reservedIds = new Set(identity.baseTemplateIds);
    let nextId = 1;
    const newId = () => {
        while (reservedIds.has(`bt-${nextId}`)) nextId++;
        reservedIds.add(`bt-${nextId}`);
        return `bt-${nextId}`;
    };
    const {templateByGroup, pageByPageGroup} = assignLoadedIdentity(viewModel.templateGroups, identity);
    const templateNameByGroup = assignNameDecisions(
        viewModel.templateGroups.map(group => ({group, pageIndices: group.pageGroups.flatMap(pageGroup => pageGroup.pageIndices)})),
        decisions.baseTemplateNames);
    const pageNameByPageGroup = assignNameDecisions(
        viewModel.templateGroups.flatMap(group => group.pageGroups).map(group => ({group, pageIndices: group.pageIndices})),
        decisions.basePageNames);
    return viewModel.templateGroups.map(templateGroup => {
        const usedFlowNames = new Set();
        /** @type {Set<string>} */
        const usedPageNames = new Set();
        const pages = templateGroup.pageGroups.map((pageGroup, pageGroupIndex) => {
            const pins = decisions.pinnedRepresentatives.filter(pageIndex => pageGroup.pageIndices.includes(pageIndex));
            const computedRepresentativePageIndex = defaultRepresentative(pageGroup.pageIndices, pageMatrix);
            const representativePageIndex = pins[0] ?? computedRepresentativePageIndex;
            const representative = data.pages[representativePageIndex];
            const representativeKey = renderUnitKey(representative, representativePageIndex);
            // The user's positions replace the bounding boxes of the drafts.
            const baseDrafts = (areaDrafts[representativePageIndex] ?? []).map(draft => {
                const position = decisions.positionByDraft.get(draftKey(representativeKey, draft.areaIndices));
                return position ? {...draft, position} : draft;
            });

            // The representative's areas belong to the base area made from their draft; the areas
            // of the other pages go to the base area they lie in.
            /** @type {(number|null)[]} */
            const representativeMapping = new Array(representative.areas.length).fill(null);
            baseDrafts.forEach((draft, baseIndex) => draft.areaIndices.forEach(areaIndex => { representativeMapping[areaIndex] = baseIndex; }));
            /** @type {Map<number, (number|null)[]>} */
            const baseAreaByArea = new Map();
            pageGroup.pageIndices.forEach(pageIndex => {
                baseAreaByArea.set(pageIndex, pageIndex === representativePageIndex
                    ? representativeMapping
                    : mapAreasToBaseAreas(data.pages[pageIndex].areas, baseDrafts));
            });

            const loadedPage = pageByPageGroup.get(pageGroup);
            const pageNameDecision = pageNameByPageGroup.get(pageGroup) ?? null;
            const proposedPageName = loadedPage?.name ?? inspireSafeName(representative.pageName ?? `Page ${pageGroupIndex + 1}`);
            /** @param {number} areaIndex */
            const editedFlowName = areaIndex => decisions.flowNameByArea.get(`${representativeKey}#${areaIndex}`);
            return {
                id: `page-${pageGroupIndex + 1}`,
                name: uniqueName(pageNameDecision?.name ?? proposedPageName, usedPageNames),
                nameSource: pageNameDecision ? "edited" : loadedPage ? "loaded" : "derived",
                proposedName: proposedPageName,
                nameDecision: pageNameDecision,
                pageGroupKey: pageGroup.key,
                pageSize: representative.pageSize,
                representativePageIndex,
                representativeIsManual: pins.length > 0,
                computedRepresentativePageIndex,
                unusedPins: pins.slice(1),
                areas: baseDrafts.map(draft => {
                    const draftAreas = draft.areaIndices.map(areaIndex => representative.areas[areaIndex]);
                    const propertiesEdited = decisions.areaPropertiesByDraft.get(draftKey(representativeKey, draft.areaIndices)) ?? {};
                    const proposedFlowToNextPage = draftAreas.some(area => area?.flowToNextPage);
                    const proposedDynamicHeight = draftAreas.some(area => area?.dynamicHeight);
                    const edited = draft.areaIndices.map(editedFlowName).find(Boolean);
                    const proposedFlowName = chooseFlowName(draftAreas, draft, new Set());
                    return {
                    flowName: uniqueName(edited ?? proposedFlowName, usedFlowNames),
                    flowNameSource: edited ? "edited" : draftAreas.some(area => area.interactiveFlowName.trim()) ? "data" : "generated",
                    proposedFlowName,
                    areaIndices: draft.areaIndices,
                    proposedPosition: (areaDrafts[representativePageIndex] ?? []).find(d => d.areaIndices === draft.areaIndices)?.position ?? draft.position,
                    positionEdited: decisions.positionByDraft.has(draftKey(representativeKey, draft.areaIndices)),
                    positionKey: draftKey(representativeKey, draft.areaIndices),
                    areaName: propertiesEdited.areaName ?? draft.areaName,
                    proposedAreaName: draft.areaName,
                    flowToNextPage: propertiesEdited.flowToNextPage ?? proposedFlowToNextPage,
                    proposedFlowToNextPage,
                    dynamicHeight: propertiesEdited.dynamicHeight ?? proposedDynamicHeight,
                    proposedDynamicHeight,
                    propertiesEdited,
                    position: draft.position,
                    };
                }),
                baseAreaByArea,
            };
        });
        // A loaded base template keeps its id and name (see assignLoadedIdentity); otherwise the
        // base template is named after the template of the first base page's representative.
        const loaded = templateByGroup.get(templateGroup);
        const firstRepresentative = pages.length ? data.pages[pages[0].representativePageIndex] : null;
        const templateName = firstRepresentative?.templateName ?? templateGroup.templateNames[0];
        const templateNameDecision = templateNameByGroup.get(templateGroup) ?? null;
        const proposedTemplateName = loaded?.name ?? inspireSafeName(`${templateName}BaseTemplate`);
        return {
            id: loaded?.id ?? newId(),
            name: uniqueName(templateNameDecision?.name ?? proposedTemplateName, usedTemplateNames),
            nameSource: templateNameDecision ? "edited" : loaded ? "loaded" : "derived",
            proposedName: proposedTemplateName,
            nameDecision: templateNameDecision,
            templateGroupKey: templateGroup.key,
            pages,
        };
    });
}

/**
 * Key of a draft (a group of a page's areas) for decisions about the base area made from it.
 * @param {string} pageKey see renderUnitKey
 * @param {number[]} areaIndices sorted
 * @returns {string}
 */
function draftKey(pageKey, areaIndices) {
    return `${pageKey}#${areaIndices.join(",")}`;
}

/**
 * Finds the base page (and its base template) a page belongs to.
 * @param {BaseTemplateModel[]} baseTemplates
 * @returns {Map<number, {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}>}
 */
function indexBasePagesByPage(baseTemplates) {
    /** @type {Map<number, {baseTemplate: BaseTemplateModel, basePage: BaseTemplatePageModel}>} */
    const result = new Map();
    baseTemplates.forEach(baseTemplate => baseTemplate.pages.forEach(basePage => {
        basePage.baseAreaByArea.forEach((_, pageIndex) => result.set(pageIndex, {baseTemplate, basePage}));
    }));
    return result;
}

/**
 * Flow name of the base area each area of a page maps to ("" when the base page has no areas).
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 * @returns {string[]}
 */
function areaFlowNames(basePage, pageIndex) {
    return (basePage.baseAreaByArea.get(pageIndex) ?? []).map(baseIndex => baseIndex == null ? "" : basePage.areas[baseIndex].flowName);
}

/**
 * Pages used by several templates that ended up in different base templates. Their mapping is
 * stored once per page, so the import keeps only the last base template.
 * @param {BaseTemplateModel[]} baseTemplates
 * @param {LayoutData} data
 * @returns {string[]} one message per conflicting page
 */
function findSharedPageConflicts(baseTemplates, data) {
    /** @type {Map<string, Set<string>>} */
    const baseTemplateIdsByPageId = new Map();
    indexBasePagesByPage(baseTemplates).forEach(({baseTemplate}, pageIndex) => {
        const pageId = data.pages[pageIndex].pageId;
        if (pageId == null) return;
        if (!baseTemplateIdsByPageId.has(pageId)) baseTemplateIdsByPageId.set(pageId, new Set());
        /** @type {Set<string>} */ (baseTemplateIdsByPageId.get(pageId)).add(baseTemplate.id);
    });
    return [...baseTemplateIdsByPageId]
        .filter(([, ids]) => ids.size > 1)
        .map(([pageId, ids]) => `page ${pageId} is in ${[...ids].join(", ")}`);
}

// ─── 8. Decisions ────────────────────────────────────────────────────────────────────────────────
//
// The user's manual decisions (see Decisions): each edit records one and renders again; each can be
// reverted on its own or all at once with Recalculate all.

/**
 * Sets (or with null, or the bounding box itself, removes) the user's position of a base area.
 * @param {BaseAreaModel} area
 * @param {Position|null} position
 */
function setBaseAreaPosition(area, position) {
    const same = position && /** @type {(keyof Position)[]} */ (["x", "y", "w", "h"])
        .every(side => Math.abs(position[side] - area.proposedPosition[side]) < 0.005);
    if (position && !same) decisions.positionByDraft.set(area.positionKey, position);
    else decisions.positionByDraft.delete(area.positionKey);
    if (currentData) render(currentData);
}

/**
 * Sets one property of a base area; a value equal to the proposal (or undefined) removes it.
 * @param {BaseAreaModel} area
 * @param {keyof AreaProperties} property
 * @param {string|boolean|undefined} value
 */
function setAreaProperty(area, property, value) {
    const proposed = {areaName: area.proposedAreaName, flowToNextPage: area.proposedFlowToNextPage, dynamicHeight: area.proposedDynamicHeight}[property];
    /** @type {Record<string, string|boolean>} */
    const properties = {...decisions.areaPropertiesByDraft.get(area.positionKey)};
    if (value === undefined || value === proposed) delete properties[property];
    else properties[property] = value;
    if (Object.keys(properties).length) decisions.areaPropertiesByDraft.set(area.positionKey, properties);
    else decisions.areaPropertiesByDraft.delete(area.positionKey);
    if (currentData) render(currentData);
}

/**
 * @param {BaseAreaModel} area
 * @param {string} value empty: back to the proposed name
 */
function setAreaName(area, value) {
    const name = value ? inspireSafeName(value) : "";
    // Without a proposed name the deployment's default counts as the proposal.
    const isDefault = !area.proposedAreaName && name === `${area.flowName}Area`;
    setAreaProperty(area, "areaName", name && !isDefault ? name : undefined);
}

/**
 * Replaces (or, with an empty value or the proposed one, removes) the user's name of a group.
 * @param {NameDecision[]} names
 * @param {NameDecision|null} current
 * @param {number[]} pageIndices
 * @param {string} value
 * @param {string} proposed
 * @returns {NameDecision[]}
 */
function updateNameDecisions(names, current, pageIndices, value, proposed) {
    const rest = names.filter(name => name !== current);
    const name = value ? inspireSafeName(value) : "";
    return name && name !== proposed ? [...rest, {pageIndices: [...pageIndices], name}] : rest;
}

/**
 * @param {BaseTemplateModel} baseTemplate
 * @param {string} value
 */
function setBaseTemplateName(baseTemplate, value) {
    const pageIndices = baseTemplate.pages.flatMap(page => [...page.baseAreaByArea.keys()]);
    decisions.baseTemplateNames = updateNameDecisions(decisions.baseTemplateNames, baseTemplate.nameDecision, pageIndices, value, baseTemplate.proposedName);
    if (currentData) render(currentData);
}

/**
 * @param {BaseTemplatePageModel} basePage
 * @param {string} value
 */
function setBasePageName(basePage, value) {
    decisions.basePageNames = updateNameDecisions(decisions.basePageNames, basePage.nameDecision, [...basePage.baseAreaByArea.keys()], value, basePage.proposedName);
    if (currentData) render(currentData);
}

/**
 * Sets the flow name of a base area on the representative's areas forming it (removing it with an
 * empty value or the proposed one). Flow names must be unique within the base template.
 * @param {BaseTemplateModel} baseTemplate
 * @param {BaseTemplatePageModel} basePage
 * @param {BaseAreaModel} area
 * @param {string} value
 */
function setFlowName(baseTemplate, basePage, area, value) {
    const name = value ? inspireSafeName(value) : "";
    const takenBy = name && baseTemplate.pages.flatMap(page => page.areas).find(other => other !== area && other.flowName === name);
    if (takenBy) {
        setStatus(`The flow name "${name}" is already used by another base area of ${baseTemplate.name}.`, "error");
        renderInspector();
        return;
    }
    const representative = currentData.pages[basePage.representativePageIndex];
    const key = renderUnitKey(representative, basePage.representativePageIndex);
    area.areaIndices.forEach(areaIndex => {
        if (name && name !== area.proposedFlowName) decisions.flowNameByArea.set(`${key}#${areaIndex}`, name);
        else decisions.flowNameByArea.delete(`${key}#${areaIndex}`);
    });
    render(currentData);
}

/** @returns {Decisions} */
function emptyDecisions() {
    return {pinnedRepresentatives: [], areaGroupsByPage: new Map(), lockedGroups: [], baseTemplateNames: [], basePageNames: [], flowNameByArea: new Map(), positionByDraft: new Map(), areaPropertiesByDraft: new Map()};
}

/**
 * Applies a merge or split of the selected areas of a page and stores the result as the page's
 * manual area groups. Every occurrence of the same page (shared by several templates) changes.
 * @param {number} pageIndex
 * @param {"merge"|"split"} operation
 */
function editAreaGroups(pageIndex, operation) {
    const selection = uiState.areaSelection;
    if (!currentData || !selection || selection.pageIndex !== pageIndex || !selection.areaIndices.size) return;
    const page = currentData.pages[pageIndex];
    const groups = (currentAreaDrafts[pageIndex] ?? []).map(draft => [...draft.areaIndices]);
    const edited = operation === "merge"
        ? mergeAreaGroups(groups, selection.areaIndices)
        : splitAreaGroups(groups, selection.areaIndices);
    const key = renderUnitKey(page, pageIndex);
    if (sameAreaGroups(edited, (currentAnalysis.pageBaseTemplateAreaDrafts[pageIndex] ?? []).map(draft => draft.areaIndices))) {
        decisions.areaGroupsByPage.delete(key); // back to the computed grouping: no decision needed
    } else {
        decisions.areaGroupsByPage.set(key, edited);
    }
    uiState.areaSelection = null;
    render(currentData);
}

/**
 * Drops the user's area groups of a page, so the computed grouping applies again.
 * @param {number} pageIndex
 */
function resetAreaGroups(pageIndex) {
    if (!currentData) return;
    decisions.areaGroupsByPage.delete(renderUnitKey(currentData.pages[pageIndex], pageIndex));
    uiState.areaSelection = null;
    render(currentData);
}

/**
 * Makes the page the representative of its base page as a manual decision (a pin). This also
 * works for the computed representative, to keep it when the computation changes. Picking the
 * pinned representative again removes the pins of the group, so the computed one applies again.
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 */
function setRepresentative(basePage, pageIndex) {
    const unpin = basePage.representativeIsManual && basePage.representativePageIndex === pageIndex;
    unpinGroup(basePage);
    if (!unpin) decisions.pinnedRepresentatives.push(pageIndex);
    if (currentData) render(currentData);
}

/**
 * Takes the computed representative of a base page: removes the pins of its group.
 * @param {BaseTemplatePageModel} basePage
 */
function useComputedRepresentative(basePage) {
    unpinGroup(basePage);
    if (currentData) render(currentData);
}

/** @param {BaseTemplatePageModel} basePage */
function unpinGroup(basePage) {
    decisions.pinnedRepresentatives = decisions.pinnedRepresentatives.filter(pageIndex => !basePage.baseAreaByArea.has(pageIndex));
}

/**
 * Counts the manual decisions and those that differ from what the computation proposes now: a
 * pinned representative other than the computed one, a pin not used because an earlier pin is in
 * the same group, and area groups that differ from the computed grouping.
 * @returns {{manual: number, differing: number}}
 */
function describeDecisions() {
    let differing = decisions.areaGroupsByPage.size + decisions.positionByDraft.size + decisions.areaPropertiesByDraft.size
        + currentViewModel.templateGroups.filter(group => group.locked && !group.matchesComputed).length;
    currentBaseTemplates.forEach(baseTemplate => baseTemplate.pages.forEach(basePage => {
        if (basePage.representativeIsManual && basePage.representativePageIndex !== basePage.computedRepresentativePageIndex) differing++;
        differing += basePage.unusedPins.length;
    }));
    const names = decisions.baseTemplateNames.length + decisions.basePageNames.length + new Set(decisions.flowNameByArea.values()).size;
