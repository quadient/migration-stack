    return {manual: decisions.pinnedRepresentatives.length + decisions.areaGroupsByPage.size + decisions.lockedGroups.length + names + decisions.positionByDraft.size + decisions.areaPropertiesByDraft.size, differing};
}

/**
 * Fixes a computed template group as it is, with its page groups.
 * @param {TemplateGroup} group
 */
function fixGroup(group) {
    decisions.lockedGroups.push({templateIds: [...group.templateIds], pageGroups: group.pageGroups.map(pageGroup => [...pageGroup.pageIndices])});
    if (currentData) render(currentData);
}

/**
 * Releases a fixed template group: its templates are grouped by threshold and strategy again.
 * Asks first when the computation groups them differently, as fixing again would not bring the
 * group back.
 * @param {TemplateGroup} group
 */
function unlockGroup(group) {
    if (!group.matchesComputed && !confirm("Release this fixed group? Threshold and strategy group its templates or pages differently, so fixing again will not bring this group back.")) return;
    decisions.lockedGroups = decisions.lockedGroups.filter(locked => locked !== group.locked);
    if (currentData) render(currentData);
}

/**
 * Replaces the decisions fixing the given groups (computed groups have none) with new fixed groups.
 * @param {TemplateGroup[]} groups
 * @param {LockedGroup[]} lockedGroups
 */
function replaceLockedGroups(groups, lockedGroups) {
    const old = new Set(groups.map(group => group.locked).filter(Boolean));
    decisions.lockedGroups = decisions.lockedGroups.filter(locked => !old.has(locked))
        .concat(lockedGroups.filter(locked => locked.templateIds.length));
}

/**
 * Adds pages to page groups: each to the page group most similar to it (average over its pages)
 * when that reaches the threshold, otherwise to a new page group of its own.
 * @param {number[][]} pageGroups modified in place
 * @param {number[]} pageIndices
 * @returns {number[][]}
 */
function placePages(pageGroups, pageIndices) {
    const matrix = /** @type {ViewModel} */ (currentViewModel).pageLevel.matrix;
    pageIndices.forEach(pageIndex => {
        let best = null, bestScore = -Infinity;
        pageGroups.forEach(pageGroup => {
            const score = pageGroup.reduce((sum, other) => sum + (matrix[pageIndex]?.[other] ?? 0), 0) / pageGroup.length;
            if (score > bestScore) { bestScore = score; best = pageGroup; }
        });
        if (best && bestScore >= settings.groupThreshold) best.push(pageIndex);
        else pageGroups.push([pageIndex]);
    });
    return pageGroups;
}

/**
 * Moves a template, with all its pages, to another base template, or to a new one of its own when
 * `to` is null. Both groups become fixed groups, so threshold and strategy no longer change them;
 * the moved pages join the most similar base pages of the target.
 * @param {string} templateId
 * @param {TemplateGroup} from
 * @param {TemplateGroup|null} to
 */
function moveTemplate(templateId, from, to) {
    if (!currentData || from === to) return;
    const template = currentData.templates.find(t => t.templateId === templateId);
    if (!template) return;
    const moved = new Set(template.pageIndices);
    const fromLocked = {
        templateIds: from.templateIds.filter(id => id !== templateId),
        pageGroups: from.pageGroups.map(pageGroup => pageGroup.pageIndices.filter(pageIndex => !moved.has(pageIndex))).filter(pageGroup => pageGroup.length),
    };
    const toLocked = to
        ? {templateIds: [...to.templateIds, templateId], pageGroups: placePages(to.pageGroups.map(pageGroup => [...pageGroup.pageIndices]), template.pageIndices)}
        : {templateIds: [templateId], pageGroups: placePages([], template.pageIndices)};
    replaceLockedGroups(to ? [from, to] : [from], [fromLocked, toLocked]);
    const name = template.templateName ?? templateId;
    render(currentData);
    setStatus(to ? `Moved ${name} to another base template; both groups are fixed now.` : `Moved ${name} to a new base template; both groups are fixed now.`, "ok");
}

/**
 * Moves a page to another base page of its base template, or to a new base page when `to` is
 * null. The template group becomes a fixed group with these page groups.
 * @param {number} pageIndex
 * @param {TemplateGroup} group
 * @param {PageGroup|null} to
 */
function movePage(pageIndex, group, to) {
    if (!currentData) return;
    const pageGroups = group.pageGroups.map(pageGroup => pageGroup.pageIndices.filter(other => other !== pageIndex));
    if (to) pageGroups[group.pageGroups.indexOf(to)].push(pageIndex);
    else pageGroups.push([pageIndex]);
    replaceLockedGroups([group], [{templateIds: [...group.templateIds], pageGroups: pageGroups.filter(pageGroup => pageGroup.length)}]);
    render(currentData);
    setStatus(`Moved ${pageName(currentData.pages[pageIndex])} to ${to ? "another" : "a new"} base page; the group is fixed now.`, "ok");
}

/**
 * Moves a base page before or after another one of its base template. The template group becomes a
 * fixed group with this order.
 * @param {TemplateGroup} group
 * @param {PageGroup} moved
 * @param {PageGroup} target
 * @param {boolean} after
 */
function reorderBasePage(group, moved, target, after) {
    if (!currentData || moved === target) return;
    const order = group.pageGroups.filter(pageGroup => pageGroup !== moved);
    order.splice(order.indexOf(target) + (after ? 1 : 0), 0, moved);
    if (order.every((pageGroup, i) => pageGroup === group.pageGroups[i])) return;
    replaceLockedGroups([group], [{templateIds: [...group.templateIds], pageGroups: order.map(pageGroup => [...pageGroup.pageIndices])}]);
    render(currentData);
    setStatus("Changed the order of the base pages; the group is fixed now.", "ok");
}

/**
 * @param {Decisions} value
 * @returns {string}
 */
function decisionsJson(value) {
    return JSON.stringify(value, (_, v) => v instanceof Map ? [...v] : v);
}

/**
 * Called by render: when the decisions changed since the last render, the earlier state becomes an
 * undo step (one step for edits with the same key in a row) and the redo states are dropped.
 * @param {boolean} dataChanged a new file: the history starts anew
 */
function recordDecisions(dataChanged) {
    const json = decisionsJson(decisions);
    if (dataChanged) {
        undoStack = [];
        redoStack = [];
        lastEdit = {key: "", time: 0};
    } else if (json !== lastDecisionsJson) {
        const now = Date.now();
        const sameEdit = nextEditKey !== "" && nextEditKey === lastEdit.key && now - lastEdit.time < 1500;
        if (!sameEdit) {
            undoStack.push(lastDecisions);
            if (undoStack.length > 200) undoStack.shift();
        }
        redoStack = [];
        lastEdit = {key: nextEditKey, time: now};
    }
    nextEditKey = "";
    lastDecisions = structuredClone(decisions);
    lastDecisionsJson = json;
}

/**
 * Brings back the decisions of the previous (undo) or the undone (redo) state.
 * @param {boolean} forward redo instead of undo
 */
function stepHistory(forward) {
    const from = forward ? redoStack : undoStack;
    const to = forward ? undoStack : redoStack;
    const state = from.pop();
    if (!currentData || !state) return;
    to.push(lastDecisions);
    decisions = state;
    lastDecisions = structuredClone(state);
    lastDecisionsJson = decisionsJson(state);
    lastEdit = {key: "", time: 0};
    render(currentData);
    setStatus(forward ? "Redone." : "Undone.", "ok");
}

/**
 * Moves the base area of the selected areas with an arrow key, or with Ctrl resizes it from its
 * top-left corner (→/↓ wider/taller, ←/↑ narrower/shorter): by 1 mm, by 10 mm with Shift. Presses
 * in a row are one undo step.
 * @param {KeyboardEvent} e
 * @returns {boolean} the key moved or resized a base area
 */
function nudgeSelectedBaseArea(e) {
    if (!currentData || !uiState.areaSelection || e.altKey || e.metaKey) return false;
    const {areas} = baseAreasOfSelection(uiState.areaSelection.pageIndex, uiState.areaSelection.areaIndices);
    if (areas.length !== 1) return false;
    const step = e.shiftKey ? 10 : 1;
    const dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
    const dy = e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0;
    if (!dx && !dy) return false;
    const area = areas[0];
    const {x, y, w, h} = area.position;
    const resize = e.ctrlKey;
    nextEditKey = (resize ? "resize:" : "nudge:") + area.positionKey;
    setBaseAreaPosition(area, resize
        ? {x, y, w: roundTo(Math.max(MIN_AREA_SIZE_MM, w + dx), 2), h: roundTo(Math.max(MIN_AREA_SIZE_MM, h + dy), 2)}
        : {x: roundTo(Math.max(0, x + dx), 2), y: roundTo(Math.max(0, y + dy), 2), w, h});
    return true;
}

/** Discards every manual decision, so the whole proposal is computed again. */
function recalculateAll() {
    const {manual} = describeDecisions();
    if (!currentData || !manual) return;
    if (!confirm(`Discard all ${manual} manual decision(s) (fixed groups, pinned representatives, merged/split areas, names, positions, area settings) and use the computed proposal?`)) return;
    decisions = emptyDecisions();
    uiState.areaSelection = null;
    render(currentData);
}

// ─── 9. Loaded base templates ────────────────────────────────────────────────────────────────────
//
// A file exported earlier (by this tool, or by LayoutExport after LayoutImport) holds "Base"
// rows and, on the standard rows, the baseTemplateTargetId and interactiveFlowName written by
// the export. Everything the tool decided can be derived from them, so nothing tool-specific
// has to be stored in the DB:
// - the base page of a page: the base page of its target base template that has its flow names
//   (flow names are unique within a base template),
// - the representative: the page whose areas, grouped by flow name, span exactly the base areas
//   (base areas are made from the representative's area groups),
// - the area groups of the representative: its areas grouped by flow name.
// They are restored as manual decisions (pinned representative, area groups), and the ids and
// names of the loaded base templates are kept.

/** @returns {LoadedIdentity} */
function emptyIdentity() {
    return {basePageByPage: new Map(), baseTemplateIds: new Set(), representativeByBasePage: new Map()};
}

/**
 * Reads the base templates from the "Base" rows: grouped by templateId, then by pageId (in the
 * order of the file), areas ordered by areaIndex.
 * @param {CsvDocument} doc
 * @returns {LoadedBaseTemplate[]}
 */
function parseLoadedBaseTemplates(doc) {
    /** @param {string[]} row @param {string} name */
    const get = (row, name) => { const i = columnIndex(doc.headers, name); return i >= 0 ? (row[i] ?? "").trim() : ""; };
    /** @type {Map<string, {id: string, name: string, pages: Map<string, {name: string, areas: {index: number, flowName: string, position: Position, areaName: string, flowToNextPage: boolean, dynamicHeight: boolean}[]}>}>} */
    const byId = new Map();
    doc.baseRows.forEach(row => {
        const id = get(row, "templateId");
        if (!id) return;
        if (!byId.has(id)) byId.set(id, {id, name: get(row, "templateName") || id, pages: new Map()});
        const template = /** @type {NonNullable<ReturnType<typeof byId.get>>} */ (byId.get(id));
        const pageKey = get(row, "pageId") || id;
        if (!template.pages.has(pageKey)) template.pages.set(pageKey, {name: get(row, "pageName") || pageKey, areas: []});
        const [x, y, w, h] = ["x", "y", "width", "height"].map(name => parseSizeMm(get(row, name)));
        if (x == null || y == null || w == null || h == null) return;
        /** @type {NonNullable<ReturnType<typeof template.pages.get>>} */ (template.pages.get(pageKey)).areas.push({
            index: Number(get(row, "areaIndex")) || 0,
            flowName: get(row, "interactiveFlowName"),
            position: {x, y, w, h},
            areaName: get(row, "areaName"),
            flowToNextPage: get(row, "flowToNextPage") === "true",
            dynamicHeight: get(row, "dynamicHeight") === "true",
        });
    });
    return [...byId.values()].map(template => ({
        id: template.id,
        name: template.name,
        pages: [...template.pages.values()].map(page => ({
            name: page.name,
            areas: page.areas.sort((a, b) => a.index - b.index).map(({index, ...area}) => area),
        })),
    }));
}

/**
 * Groups the areas of a page by interactive flow name; areas without one get a group each.
 * @param {AreaEntry[]} areas
 * @returns {number[][]}
 */
function areaGroupsByFlowName(areas) {
    /** @type {Map<string, number[]>} */
    const byName = new Map();
    /** @type {number[][]} */
    const unnamed = [];
    areas.forEach((area, areaIndex) => {
        const name = area.interactiveFlowName.trim();
        if (!name) { unnamed.push([areaIndex]); return; }
        if (!byName.has(name)) byName.set(name, []);
        /** @type {number[]} */ (byName.get(name)).push(areaIndex);
    });
    return [...byName.values(), ...unnamed];
}

/**
 * How far the areas of a page, grouped by flow name, are from forming the base areas. Structural:
 * base areas without areas plus areas whose flow is not a base area. Geometric: how far the
 * bounding boxes of the flow-name groups are from the base area positions (0 when they match; a
 * difference means the user moved or resized the base area).
 * @param {AreaEntry[]} areas
 * @param {LoadedBasePage} basePage
 * @returns {{structural: number, geometric: number}}
 */
function representativeMismatch(areas, basePage) {
    const baseFlowNames = new Set(basePage.areas.map(area => area.flowName));
    let structural = areas.filter(area => !baseFlowNames.has(area.interactiveFlowName.trim())).length;
    let geometric = 0;
    basePage.areas.forEach(baseArea => {
        const own = areas.filter(area => area.interactiveFlowName.trim() === baseArea.flowName);
        if (!own.length) { structural += 1; return; }
        const x = Math.min(...own.map(area => area.x)), y = Math.min(...own.map(area => area.y));
        const box = {x, y, w: Math.max(...own.map(area => area.x + area.w)) - x, h: Math.max(...own.map(area => area.y + area.h)) - y};
        geometric += geometryDistance(box, baseArea.position, true);
    });
    return {structural, geometric};
}

/**
 * Restores the decisions behind the loaded base templates (see the section comment) and the
 * identity (ids, names) to keep.
 * @param {LayoutData} data
 * @param {LoadedBaseTemplate[]} loaded
 * @param {LayoutAnalysis} analysis
 * @returns {{decisions: Decisions, identity: LoadedIdentity, report: RestoreReport}}
 */
function restoreFromLoaded(data, loaded, analysis) {
    const decisions = emptyDecisions();
    const identity = emptyIdentity();
    /** @type {RestoreReport} */
    const report = {loadedBaseTemplates: loaded.length, baseTemplates: 0, basePages: 0, unmatchedPages: [], inexactBasePages: []};
    if (!loaded.length) return {decisions, identity, report};
    loaded.forEach(baseTemplate => identity.baseTemplateIds.add(baseTemplate.id));
    const loadedById = new Map(loaded.map(baseTemplate => [baseTemplate.id, baseTemplate]));

    data.pages.forEach((page, pageIndex) => {
        const target = page.baseTemplateTargetId;
        if (!target.startsWith("$") && !target.startsWith("@")) return; // none, or a literal Inspire path
        const baseTemplate = loadedById.get(target.slice(1));
        const flowNames = new Set(page.areas.map(area => area.interactiveFlowName.trim()).filter(Boolean));
        /** @type {LoadedBasePage|null} */
        let best = null, bestCount = 0;
        baseTemplate?.pages.forEach(basePage => {
            const count = basePage.areas.filter(area => flowNames.has(area.flowName)).length;
            if (count > bestCount) { best = basePage; bestCount = count; }
        });
        if (!baseTemplate || !best) { report.unmatchedPages.push(pageName(page)); return; }
        identity.basePageByPage.set(pageIndex, {baseTemplate, basePage: best});
    });

    /** @type {Map<LoadedBasePage, number[]>} */
    const pagesByBasePage = new Map();
    identity.basePageByPage.forEach(({basePage}, pageIndex) => {
        if (!pagesByBasePage.has(basePage)) pagesByBasePage.set(basePage, []);
        /** @type {number[]} */ (pagesByBasePage.get(basePage)).push(pageIndex);
    });
    pagesByBasePage.forEach((pageIndices, basePage) => {
        let representative = pageIndices[0], best = {structural: Infinity, geometric: Infinity};
        pageIndices.forEach(pageIndex => {
            const mismatch = representativeMismatch(data.pages[pageIndex].areas, basePage);
            if (mismatch.structural < best.structural || (mismatch.structural === best.structural && mismatch.geometric < best.geometric)) {
                representative = pageIndex;
                best = mismatch;
            }
        });
        if (best.structural) report.inexactBasePages.push(basePage.name);
        decisions.pinnedRepresentatives.push(representative);
        identity.representativeByBasePage.set(basePage, representative);
        const page = data.pages[representative];
        const groups = areaGroupsByFlowName(page.areas);
        const computed = (analysis.pageBaseTemplateAreaDrafts[representative] ?? []).map(draft => draft.areaIndices);
        if (!sameAreaGroups(groups, computed)) decisions.areaGroupsByPage.set(renderUnitKey(page, representative), groups);
        // A base area whose position differs from the bounding box of its areas was moved or
        // resized by the user: keep its position.
        draftsFromAreaGroups(page.areas, groups).forEach(draft => {
            const flowName = page.areas[draft.areaIndices[0]].interactiveFlowName.trim();
            const loadedArea = flowName ? basePage.areas.find(area => area.flowName === flowName) : null;
            if (!loadedArea) return;
            const differs = /** @type {(keyof Position)[]} */ (["x", "y", "w", "h"])
                .some(side => Math.abs(loadedArea.position[side] - draft.position[side]) > 0.01);
            if (differs) {
                const p = loadedArea.position;
                decisions.positionByDraft.set(draftKey(renderUnitKey(page, representative), draft.areaIndices),
                    {x: roundTo(p.x, 2), y: roundTo(p.y, 2), w: roundTo(p.w, 2), h: roundTo(p.h, 2)});
            }
            // The same for the area name and flags that differ from what its areas propose.
            const draftAreas = draft.areaIndices.map(areaIndex => page.areas[areaIndex]);
            /** @type {AreaProperties} */
            const properties = {};
            if (loadedArea.areaName && loadedArea.areaName !== draft.areaName) properties.areaName = loadedArea.areaName;
            if (loadedArea.flowToNextPage !== draftAreas.some(area => area.flowToNextPage)) properties.flowToNextPage = loadedArea.flowToNextPage;
            if (loadedArea.dynamicHeight !== draftAreas.some(area => area.dynamicHeight)) properties.dynamicHeight = loadedArea.dynamicHeight;
            if (Object.keys(properties).length) decisions.areaPropertiesByDraft.set(draftKey(renderUnitKey(page, representative), draft.areaIndices), properties);
        });
    });

    decisions.lockedGroups = lockedGroupsFromLoaded(data, identity);

    report.baseTemplates = new Set([...identity.basePageByPage.values()].map(({baseTemplate}) => baseTemplate)).size;
    report.basePages = pagesByBasePage.size;
    return {decisions, identity, report};
}

/**
 * The grouping of the loaded file: a template belongs to the loaded base template most of its
 * pages target; within it, pages with the same loaded base page form a page group. Templates
 * without a loaded base template are left to the computation.
 * @param {LayoutData} data
 * @param {LoadedIdentity} identity
 * @returns {LockedGroup[]}
 */
function lockedGroupsFromLoaded(data, identity) {
    /** @type {Map<LoadedBaseTemplate, {templateIds: string[], pagesByBasePage: Map<LoadedBasePage, number[]>}>} */
    const byBaseTemplate = new Map();
    data.templates.forEach(template => {
        /** @type {Map<LoadedBaseTemplate, number>} */
        const counts = new Map();
        template.pageIndices.forEach(pageIndex => {
            const loaded = identity.basePageByPage.get(pageIndex)?.baseTemplate;
            if (loaded) counts.set(loaded, (counts.get(loaded) ?? 0) + 1);
        });
        /** @type {LoadedBaseTemplate|null} */
        let baseTemplate = null, best = 0;
        counts.forEach((count, loaded) => { if (count > best) { baseTemplate = loaded; best = count; } });
        if (!baseTemplate) return;
        if (!byBaseTemplate.has(baseTemplate)) byBaseTemplate.set(baseTemplate, {templateIds: [], pagesByBasePage: new Map()});
        const group = /** @type {NonNullable<ReturnType<typeof byBaseTemplate.get>>} */ (byBaseTemplate.get(baseTemplate));
        group.templateIds.push(template.templateId);
        template.pageIndices.forEach(pageIndex => {
            const loaded = identity.basePageByPage.get(pageIndex);
            if (loaded?.baseTemplate !== baseTemplate) return; // e.g. a shared page stored with another base template
            if (!group.pagesByBasePage.has(loaded.basePage)) group.pagesByBasePage.set(loaded.basePage, []);
            /** @type {number[]} */ (group.pagesByBasePage.get(loaded.basePage)).push(pageIndex);
        });
    });
    // Base pages in the order of the file (the Base rows), which is their order in the base template.
    return [...byBaseTemplate.entries()].map(([baseTemplate, {templateIds, pagesByBasePage}]) => ({
        templateIds,
        pageGroups: [...pagesByBasePage.entries()]
            .sort(([a], [b]) => baseTemplate.pages.indexOf(a) - baseTemplate.pages.indexOf(b))
            .map(([, pageIndices]) => pageIndices),
    }));
}

/**
 * @param {RestoreReport} report
 * @returns {string} "" when the file had no base templates
 */
function describeRestoreReport(report) {
    if (!report.loadedBaseTemplates) return "";
    const parts = [`Restored ${report.baseTemplates} base template(s) with ${report.basePages} base page(s) from the file`];
    const unused = report.loadedBaseTemplates - report.baseTemplates;
    if (unused) parts.push(`${unused} base template(s) in the file are used by no page`);
    if (report.unmatchedPages.length) {
        parts.push(`${report.unmatchedPages.length} page(s) match no base page of the file and are grouped as computed: ${report.unmatchedPages.slice(0, 5).join(", ")}${report.unmatchedPages.length > 5 ? ", ..." : ""}`);
    }
    if (report.inexactBasePages.length) {
        parts.push(`the flows of ${report.inexactBasePages.join(", ")} match no page exactly; the closest page is used`);
    }
    return parts.join("; ");
}

/**
 * Assigns the user's names to groups: each name goes to the group holding most of the pages it
 * was given with, each group gets one name at most; the largest overlaps are served first.
 * @template G
 * @param {{group: G, pageIndices: number[]}[]} groups
 * @param {NameDecision[]} names
 * @returns {Map<G, NameDecision>}
 */
function assignNameDecisions(groups, names) {
    /** @type {{group: G, name: NameDecision, weight: number}[]} */
    const claims = [];
    names.forEach(name => {
        const pages = new Set(name.pageIndices);
        groups.forEach(({group, pageIndices}) => {
            const weight = pageIndices.filter(pageIndex => pages.has(pageIndex)).length;
            if (weight) claims.push({group, name, weight});
        });
    });
    claims.sort((a, b) => b.weight - a.weight);
    /** @type {Map<G, NameDecision>} */
    const result = new Map();
    const taken = new Set();
    claims.forEach(({group, name}) => {
        if (result.has(group) || taken.has(name)) return;
        result.set(group, name);
        taken.add(name);
    });
    return result;
}

/**
 * Decides which template group and page group keep the id and name of which loaded base
 * template and base page, each loaded one going to one group at most. A group's claim on a
 * loaded one is the number of its pages that belonged to it, far more when it contains the
 * restored representative; the strongest claims are served first.
 * @param {TemplateGroup[]} templateGroups
 * @param {LoadedIdentity} identity
 * @returns {{templateByGroup: Map<TemplateGroup, LoadedBaseTemplate>, pageByPageGroup: Map<PageGroup, LoadedBasePage>}}
 */
function assignLoadedIdentity(templateGroups, identity) {
    /** @type {Set<number>} */
    const representatives = new Set(identity.representativeByBasePage.values());
    /**
     * @template G, L
     * @param {{group: G, pageIndices: number[]}[]} groups
     * @param {(pageIndex: number) => L|undefined} loadedOf
     * @returns {Map<G, L>}
     */
    const assign = (groups, loadedOf) => {
        /** @type {{group: G, loaded: L, weight: number}[]} */
        const claims = [];
        groups.forEach(({group, pageIndices}) => {
            /** @type {Map<L, number>} */
            const weights = new Map();
            pageIndices.forEach(pageIndex => {
                const loaded = loadedOf(pageIndex);
                if (loaded == null) return;
                weights.set(loaded, (weights.get(loaded) ?? 0) + (representatives.has(pageIndex) ? 1000 : 1));
            });
            weights.forEach((weight, loaded) => claims.push({group, loaded, weight}));
        });
        claims.sort((x, y) => y.weight - x.weight); // stable: earlier groups win ties
        /** @type {Map<G, L>} */
        const result = new Map();
        const taken = new Set();
        claims.forEach(({group, loaded}) => {
            if (result.has(group) || taken.has(loaded)) return;
            result.set(group, loaded);
            taken.add(loaded);
        });
        return result;
    };
    const pageGroups = templateGroups.flatMap(templateGroup => templateGroup.pageGroups);
    return {
        templateByGroup: assign(
            templateGroups.map(group => ({group, pageIndices: group.pageGroups.flatMap(pageGroup => pageGroup.pageIndices)})),
            pageIndex => identity.basePageByPage.get(pageIndex)?.baseTemplate),
        pageByPageGroup: assign(
            pageGroups.map(group => ({group, pageIndices: group.pageIndices})),
            pageIndex => identity.basePageByPage.get(pageIndex)?.basePage),
    };
}

// ─── 10. Load and export ─────────────────────────────────────────────────────────────────────────
//
// Opening a CSV, and saving it back with the Base rows and the targets and flow names of the pages.

/**
 * @param {File} file
 */
async function loadFile(file) {
    try {
        setStatus("");
        const doc = readCsvDocument(await file.text(), file.name || "layout.csv");
        const fileNameEl = /** @type {HTMLElement} */ (document.getElementById("file-name"));
        fileNameEl.textContent = doc.fileName;
        fileNameEl.title = doc.fileName;
        const layoutData = buildLayoutData(doc);
        currentCsv = doc;
        saveCsvBtn.disabled = false;
        const report = render(layoutData, parseLoadedBaseTemplates(doc));
        const message = report ? describeRestoreReport(report) : "";
        if (message) setStatus(message, report && (report.unmatchedPages.length || report.inexactBasePages.length) ? undefined : "ok");
    } catch (err) {
        setStatus("Error: " + /** @type {Error} */ (err).message, "error");
    }
}

/**
 * @param {string} message
 * @param {"ok"|"error"} [kind]
 */
function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.title = message;
    statusEl.classList.toggle("ok", kind === "ok");
    statusEl.classList.toggle("error", kind === "error");
}

/**
 * Builds the "Base" CSV rows of the base templates and, per page, the baseTemplateTargetId and
 * interactiveFlowName of each of its areas.
 * @param {BaseTemplateModel[]} baseTemplates
 * @returns {{baseRows: Record<string, string>[], overridesByPageIndex: Map<number, {flowNames: string[], targetId: string}>}}
 *   baseRows are keyed by logical column name; missing columns are written empty
 */
function buildExportData(baseTemplates) {
    /** @type {Record<string, string>[]} */
    const baseRows = [];
    /** @type {Map<number, {flowNames: string[], targetId: string}>} */
    const overridesByPageIndex = new Map();

    baseTemplates.forEach(baseTemplate => baseTemplate.pages.forEach(basePage => {
        const size = basePage.pageSize;
        basePage.areas.forEach((area, areaIndex) => baseRows.push({
            templateId: baseTemplate.id,
            templateName: baseTemplate.name,
            pageId: basePage.id,
            pageName: basePage.name,
            type: "Base",
            interactiveFlowName: area.flowName,
            areaName: area.areaName,
            flowToNextPage: String(area.flowToNextPage),
            dynamicHeight: String(area.dynamicHeight),
            areaIndex: String(areaIndex),
            x: `${area.position.x}mm`,
            y: `${area.position.y}mm`,
            width: `${area.position.w}mm`,
            height: `${area.position.h}mm`,
            pageWidth: size ? `${size.w}mm` : "",
            pageHeight: size ? `${size.h}mm` : "",
        }));

        basePage.baseAreaByArea.forEach((_, pageIndex) => {
            overridesByPageIndex.set(pageIndex, {flowNames: areaFlowNames(basePage, pageIndex), targetId: `$${baseTemplate.id}`});
        });
    }));

    return {baseRows, overridesByPageIndex};
}

async function saveCsv() {
    if (!currentCsv) {
        setStatus("No CSV loaded to save.", "error");
        return;
    }
    if (!currentData || !currentViewModel || !currentAnalysis) {
        setStatus("No layout data loaded to save.", "error");
        return;
    }

    const headers = [...currentCsv.headers];
    // Copies of the loaded rows, looked up by the original row the areas reference.
    /** @type {Map<string[], string[]>} */
    const copyBySourceRow = new Map(currentCsv.standardRows.map(row => [row, [...row]]));
    const rows = [...copyBySourceRow.values()];

    const typeIdx = ensureCsvColumn(headers, rows, "type");
    const targetIdIdx = ensureCsvColumn(headers, rows, "baseTemplateTargetId");
    const flowNameIdx = ensureCsvColumn(headers, rows, "interactiveFlowName");

    const { baseRows, overridesByPageIndex } = buildExportData(currentBaseTemplates);
    // Columns the base areas need that the file does not have yet (e.g. a file from an older export).
    if (baseRows.some(row => row.areaName)) ensureCsvColumn(headers, rows, "areaName");
    if (baseRows.some(row => row.flowToNextPage === "true")) ensureCsvColumn(headers, rows, "flowToNextPage");
    if (baseRows.some(row => row.dynamicHeight === "true")) ensureCsvColumn(headers, rows, "dynamicHeight");

    currentData.pages.forEach((page, pageIndex) => {
        const override = overridesByPageIndex.get(pageIndex);
        if (!override) return;
        page.sourceRows.forEach((sourceRow, areaIndex) => {
            const row = copyBySourceRow.get(sourceRow);
            if (!row) return;
            row[targetIdIdx] = override.targetId;
            const flowName = override.flowNames[areaIndex];
            if (flowName != null) row[flowNameIdx] = flowName;
        });
    });

    for (let i = rows.length - 1; i >= 0; i--) {
        if (rows[i].every(cell => cell === "")) {
            rows.splice(i, 1);
        } else if (!rows[i][typeIdx]) {
            rows[i][typeIdx] = "Standard";
        }
    }

    baseRows.forEach(baseRow => {
        rows.push(headers.map(h => baseRow[normalizeHeaderName(h)] ?? ""));
    });

    const text = serializeCsv(headers, rows);
    const fileName = currentCsv.fileName;
    const conflicts = findSharedPageConflicts(currentBaseTemplates, currentData);
    const warning = conflicts.length
        ? ` - warning: ${conflicts.join("; ")}; the import keeps only the last base template of such pages`
        : "";
    const resultKind = conflicts.length ? "error" : "ok";

    if (typeof window.showSaveFilePicker === "function") {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: "CSV file", accept: { "text/csv": [".csv"] } }],
            });
            const writable = await handle.createWritable();
            await writable.write(text);
            await writable.close();
            setStatus(`Saved ${handle.name}${warning}`, resultKind);
            return;
        } catch (err) {
            if (/** @type {Error} */ (err).name === "AbortError") return;
            setStatus("Error saving file: " + /** @type {Error} */ (err).message, "error");
            return;
        }
    }

    const blob = new Blob([text], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus(`Downloaded ${fileName}${warning}`, resultKind);
}

// ─── 11. List rendering ──────────────────────────────────────────────────────────────────────────
//
// The list of base templates (template groups) with their base pages (page groups).

/** Shows the number of manual decisions, and how many differ from the computation, on the Recalculate all button. */
function renderDecisionSummary() {
    const {manual, differing} = describeDecisions();
    recalculateAllBtn.disabled = manual === 0;
    recalculateAllBtn.textContent = manual ? `Recalculate all (${manual})` : "Recalculate all";
    recalculateAllBtn.classList.toggle("differs", differing > 0);
    undoBtn.disabled = !undoStack.length;
    redoBtn.disabled = !redoStack.length;
    recalculateAllBtn.title = manual
        ? `${manual} manual decision(s), ${differing} of them differ from what the computation proposes now.\n`
            + "Click to discard all of them and use the computed proposal."
        : "No manual decisions: everything shown is computed.";
    const summary = manual
        ? `${manual} manual decision(s)${differing ? `, ${differing} differing from the computed proposal` : ""}.`
        : "No manual decisions: everything shown is computed.";
    /** @type {HTMLElement} */ (document.getElementById("decision-summary")).textContent = summary;
    const badge = /** @type {HTMLElement} */ (document.getElementById("decision-badge"));
    badge.hidden = manual === 0;
    badge.textContent = String(manual);
    badge.classList.toggle("differs", differing > 0);
    badge.title = summary;
}

// Hovering a template chip highlights the pages of that template.
/** @param {Event} e @param {boolean} on */
function highlightTemplatePages(e, on) {
    const chip = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (e.target).closest?.(".template-tag"));
    const groupEl = chip?.closest("li");
    if (!chip || !groupEl) return;
    groupEl.querySelectorAll(".page-tag").forEach(tag => {
        tag.classList.toggle("highlight", on && /** @type {HTMLElement} */ (tag).dataset.templateId === chip.dataset.templateId);
    });
}

/**
 * Renders the data. New data starts with the decisions restored from its base templates
 * (`loaded`); otherwise the current decisions are kept, as they are kept by page.
 * @param {LayoutData} data
 * @param {LoadedBaseTemplate[]} [loaded] base templates of the file, for new data
 * @returns {RestoreReport|null} for new data, what was restored
 */
function render(data, loaded = []) {
    const dataChanged = currentData !== data;
    currentAnalysis = ensureAnalysis(data, currentAnalysis);
    currentData = data;
    /** @type {RestoreReport|null} */
    let report = null;
    if (dataChanged) {
        const restored = restoreFromLoaded(data, loaded, currentAnalysis);
        decisions = restored.decisions;
        loadedIdentity = restored.identity;
        report = restored.report;
    }
    recordDecisions(dataChanged);
    currentViewModel = buildViewModel(data, currentAnalysis, settings, decisions.lockedGroups);
    uiState = reconcileUiState(uiState, currentViewModel, dataChanged);
    currentAreaDrafts = effectiveAreaDrafts(data, currentAnalysis, decisions);
    currentBaseTemplates = buildBaseTemplates(data, currentViewModel, currentAreaDrafts, decisions, loadedIdentity);
    currentBasePageByPage = indexBasePagesByPage(currentBaseTemplates);

    document.getElementById("app").hidden = false;
    renderTemplateGroups(data);
    reopenPageGroups(uiState.openPageGroups);
    renderDecisionSummary();
    renderInspector();
    return report;
}

/**
 * @param {LayoutData} data
 */
function renderTemplateGroups(data) {
    if (!currentViewModel) return;
    const {templateGroups} = currentViewModel;
    const groupsEl = /** @type {HTMLElement} */ (document.getElementById("template-groups"));
    groupsEl.innerHTML = "";

    templateGroups.forEach((group, groupIndex) => {
        const li = document.createElement("li");
        li.dataset.groupKey = group.key;
        li.dataset.groupIndex = String(groupIndex);
        li.innerHTML = renderTemplateGroupItem(group, groupIndex, data);

        li.querySelectorAll(".page-group").forEach((pgEl, ci) => {
            /** @type {HTMLElement} */ (pgEl).dataset.pageGroupKey = group.pageGroups[ci].key;
        });
        groupsEl.appendChild(li);
    });
}

/**
 * @param {TemplateGroup} group
 * @returns {string}
 */
function renderTemplateBadges(group) {
    return group.templateIds.map((id, idx) => `<span class="template-tag" draggable="true" data-template-id="${htmlEsc(id)}" `
        + `title="Drag onto another base template to move this template there">${htmlEsc(group.templateNames[idx] ?? id)}</span>`).join("");
}

/**
 * The fix toggle of a template group. A computed group shows a faint "fix": clicking it makes the
 * group a decision that threshold and strategy no longer change. A fixed group (fixed here or
 * loaded from the file) shows "fixed", highlighted when the computation would group its templates
 * differently; clicking it releases the group.
 * @param {TemplateGroup} group
 * @param {number} groupIndex
 * @returns {string}
 */
function renderLockMark(group, groupIndex) {
    if (!group.locked) {
        return `<button type="button" class="lock-mark unfixed" data-action="toggle-fix" data-group-index="${groupIndex}" `
            + `title="Computed group: threshold and strategy may change it.\nClick to fix it as it is.">fix</button>`;
    }
    const title = (group.matchesComputed
        ? "Fixed group; the computation forms the same group."
        : "Fixed group; threshold and strategy would group these templates or their pages differently, or order the base pages differently.")
        + "\nThe threshold and strategy do not change it. Click to release it and group its templates as computed.";
    return `<button type="button" class="lock-mark${group.matchesComputed ? "" : " differs"}" data-action="toggle-fix" data-group-index="${groupIndex}" title="${htmlEsc(title)}">fixed</button>`;
}

/**
 * A base template or base page name: taken from the loaded file, or derived from the
 * representative pages and then shown as a proposal; `source` says what it is derived from.
 * @param {string} name
 * @param {NameSource} nameSource
 * @param {string} source
 * @param {string} className
 * @param {string} attributes extra HTML attributes (data-action etc.)
 * @returns {string}
 */
function renderName(name, nameSource, source, className, attributes) {
    const title = nameSource === "edited" ? "Name set by you"
        : nameSource === "loaded" ? "Name from the loaded file"
        : `Proposed name, derived from ${source}`;
    return `<span class="${className} name-link${nameSource === "derived" ? " derived" : ""}" ${attributes} `
        + `title="${htmlEsc(title + "\nClick to show it in the inspector.")}">${htmlEsc(name)}</span>`;
}

/**
 * Hint on a template group: the most similar other group, i.e. the one it would merge with
 * first when the threshold is lowered.
 * @param {number} groupIndex
 * @returns {string}
 */
function renderClosestGroupHint(groupIndex) {
    if (!currentViewModel) return "";
    const closest = closestOtherTemplateGroup(currentViewModel, groupIndex);
    if (!closest) return "";
    const title = "Average similarity of this group's templates to the templates of the most similar other group. "
        + "Groups merge when it reaches the threshold (with the average strategy).";
    const name = currentBaseTemplates[closest.groupIndex]?.name ?? "";
    return `<span class="hint" title="${htmlEsc(title)}">closest: ${htmlEsc(name)} (${closest.score.toFixed(2)})</span>`;
}

/**
 * @param {ViewModel} viewModel
 * @param {number} groupIndex
 * @returns {{groupIndex: number, score: number}|null}
 */
function closestOtherTemplateGroup(viewModel, groupIndex) {
    const {templateLevel, templateGroups} = viewModel;
    /** @type {Map<string, number>} */
    const indexById = new Map(templateLevel.templates.map((t, i) => [t.templateId, i]));
    /** @param {TemplateGroup} group */
    const indicesOf = group => group.templateIds.map(id => /** @type {number} */ (indexById.get(id)));
    const own = indicesOf(templateGroups[groupIndex]);

    /** @type {{groupIndex: number, score: number}|null} */
    let best = null;
    templateGroups.forEach((other, otherIndex) => {
        if (otherIndex === groupIndex) return;
        const others = indicesOf(other);
        let sum = 0;
        own.forEach(a => others.forEach(b => { sum += templateLevel.matrix[a][b]; }));
        const score = sum / (own.length * others.length);
        if (!best || score > best.score) best = {groupIndex: otherIndex, score};
    });
    return best;
}

/**
 * Similarity of a page to the representative page of its base page, or null for the
 * representative itself.
 * @param {number} pageIndex
 * @returns {number|null}
 */
function similarityToRepresentative(pageIndex) {
    const basePage = currentBasePageByPage.get(pageIndex)?.basePage;
    if (!basePage || !currentViewModel || basePage.representativePageIndex === pageIndex) return null;
    return currentViewModel.pageLevel.matrix[pageIndex][basePage.representativePageIndex];
}

/**
 * @param {number} pageIndex
 * @returns {string}
 */
function renderSimilarityHint(pageIndex) {
    const score = similarityToRepresentative(pageIndex);
    if (score == null) return "";
    return `<span class="hint" title="Similarity to the representative page">${score.toFixed(2)}</span>`;
}

/**
 * @param {PageGroup} pageGroup
 * @param {LayoutData} data
 * @param {boolean} reorderable the base template has more base pages, so this one gets a drag handle
 * @returns {string}
 */
function renderPageGroupRow(pageGroup, data, reorderable) {
    const {pageLevel} = /** @type {ViewModel} */ (currentViewModel);
    const cohesion = minPairScore(pageGroup.pageIndices, pageLevel.matrix);
    const cohesionTitle = cohesion !== null ? `Cohesion (least similar pair): ${cohesion.toFixed(2)}` : "Single page";
    const basePage = currentBasePageByPage.get(pageGroup.pageIndices[0])?.basePage;
    const nameHtml = basePage
        ? renderName(basePage.name, basePage.nameSource, `the representative page ${pageName(data.pages[basePage.representativePageIndex])}`,
            "pg-name" + (uiState.inspected?.kind === "page" && uiState.inspected.key === pageGroup.key ? " inspected" : ""),
            `data-action="inspect-page" data-key="${htmlEsc(pageGroup.key)}"`)
        : "";
    return `<div class="page-group">`
        + `<div class="pg-row" data-action="toggle-preview">`
        + (reorderable
            ? `<span class="pg-handle" draggable="true" title="Drag to change the order of the base pages">&#8801;</span>`
            : `<span class="pg-handle"></span>`)
        + `<span class="pg-expand-icon">&#9654;</span>`
        + `<span class="pg-head">${nameHtml}`
        + `<span class="pg-cohesion" title="${cohesionTitle}"><span class="cohesion-dot ${cohesionClass(cohesion)}"></span>`
        + (cohesion !== null ? `<span class="hint">${cohesion.toFixed(2)}</span>` : "")
        + `</span></span>`
        + `<span class="page-labels">${pageGroup.pageIndices.map(pi =>
            `<span class="page-tag" draggable="true" data-page-index="${pi}" data-template-id="${htmlEsc(data.pages[pi].templateId ?? "")}" `
            + `title="${htmlEsc(pageTagTooltip(data.pages[pi]) + "\nDrag onto another base page of this base template to move the page there")}">`
            + `${representativeMark(pi)}${htmlEsc(pageTagLabel(data.pages[pi]))}${areaEditMark(pi)} ${renderSimilarityHint(pi)}</span>`
        ).join("")}</span>`
        + `</div>`
        + `<div class="pg-cards"></div>`
        + `</div>`;
}

/**
 * The page name, prefixed with its template name when the page name does not already contain
 * it, so every page can be told apart and traced to its template.
 * @param {PageEntry} page
 * @returns {string}
 */
function pageTagLabel(page) {
    const name = pageName(page);
    const templateName = page.templateName ?? "";
    return !templateName || name.includes(templateName) ? name : `${templateName} › ${name}`;
}

/**
 * @param {PageEntry} page
 * @returns {string}
 */
function pageTagTooltip(page) {
    return `Template: ${page.templateName ?? "none (orphan page)"}
Page: ${pageName(page)}`;
}

/**
 * The star before a page tag: ★ the representative (on gold when pinned by the user), a ☆ button
 * on the computed representative when a pinned page is used instead, a grey ★ on a pinned page
 * that is not used because an earlier pin is in the same group.
 * @param {number} pageIndex
 * @returns {string}
 */
function representativeMark(pageIndex) {
    const basePage = currentBasePageByPage.get(pageIndex)?.basePage;
    if (!basePage) return "";
    const computedName = pageName(currentData.pages[basePage.computedRepresentativePageIndex]);
    if (basePage.representativePageIndex === pageIndex) {
        if (!basePage.representativeIsManual) {
            return `<span class="rep-mark" title="Representative page, computed: the most similar to the others">★</span>`;
        }
        const title = basePage.computedRepresentativePageIndex === pageIndex
            ? "Representative page, pinned by you (also the computed one)"
            : `Representative page, pinned by you.\nThe computation now proposes ${computedName} (☆).`;
        return `<span class="rep-mark pinned" title="${htmlEsc(title)}">★</span>`;
    }
    if (basePage.unusedPins.includes(pageIndex)) {
        return `<span class="rep-mark unused" title="Pinned as representative, but not used: another pinned page of this group was pinned earlier">★</span>`;
    }
    if (basePage.computedRepresentativePageIndex === pageIndex && basePage.representativeIsManual) {
        return `<button type="button" class="rep-mark use-computed" data-action="use-computed" data-page-index="${pageIndex}" `
            + `title="The computation proposes this page as the representative; a pinned page is used instead.\nClick to use this one (removes the pin).">☆</button>`;
    }
    return "";
}

/**
 * A pencil after a page tag when the user merged or split the page's areas; grey while the page
 * is not the representative (its edits are kept, but not used).
 * @param {number} pageIndex
 * @returns {string}
 */
function areaEditMark(pageIndex) {
    if (!decisions.areaGroupsByPage.has(renderUnitKey(currentData.pages[pageIndex], pageIndex))) return "";
    const used = currentBasePageByPage.get(pageIndex)?.basePage.representativePageIndex === pageIndex;
    const title = used
        ? "Areas merged/split by you"
        : "Areas merged/split by you; not used while this page is not the representative";
    return `<span class="edit-mark${used ? "" : " unused"}" title="${title}">✎</span>`;
}

/**
 * @param {TemplateGroup} group
 * @param {number} groupIndex
 * @param {LayoutData} data
 * @returns {string}
 */
function renderTemplateGroupItem(group, groupIndex, data) {
    const pageGroupsHtml = group.pageGroups
        .map(pageGroup => renderPageGroupRow(pageGroup, data, group.pageGroups.length > 1))
        .join("");
    const baseTemplate = currentBaseTemplates[groupIndex];
    const firstRepresentative = baseTemplate?.pages[0] ? data.pages[baseTemplate.pages[0].representativePageIndex] : null;
    const source = firstRepresentative
        ? `the template of the first page's representative (${firstRepresentative.templateName ?? pageName(firstRepresentative)})`
        : "the first template of the group";
    return `<div class="tg-header">`
        + `<div class="tg-title">`
        + (baseTemplate ? renderName(baseTemplate.name, baseTemplate.nameSource, source,
            "tg-name" + (uiState.inspected?.kind === "template" && uiState.inspected.key === group.key ? " inspected" : ""),
            `data-action="inspect-template" data-key="${htmlEsc(group.key)}"`) : "")
        + `<span class="tg-templates" title="Templates of this base template">${renderTemplateBadges(group)}</span>`
        + `<span class="tg-side">${renderClosestGroupHint(groupIndex)}${renderLockMark(group, groupIndex)}</span>`
        + `</div>`
        + `</div>`
        + `<div class="page-groups">${pageGroupsHtml}</div>`;
}

/**
 * @param {UiState} previousState
 * @param {ViewModel} viewModel
 * @param {boolean} dataChanged
 * @returns {UiState}
 */
function reconcileUiState(previousState, viewModel, dataChanged) {
    if (dataChanged) return {openPageGroups: new Set(), areaSelection: null, inspected: null};
    const inspected = previousState.inspected;
    const inspectedExists = inspected?.kind === "page"
        ? viewModel.pageGroupKeys.has(inspected.key)
        : viewModel.templateGroups.some(group => group.key === inspected?.key);
    return {
        openPageGroups: new Set(
            [...previousState.openPageGroups].filter(key => viewModel.pageGroupKeys.has(key))
        ),
        areaSelection: previousState.areaSelection,
        inspected: inspectedExists ? inspected : null,
    };
}

/**
 * @param {number|null} score
 * @returns {string}
 */
function cohesionClass(score) {
    if (score === null) return "cohesion-solo";
    if (score >= 0.75) return "cohesion-high";
    if (score >= 0.50) return "cohesion-mid";
    return "cohesion-low";
}

// ─── 12. Page cards and areas ────────────────────────────────────────────────────────────────────
//
// The page cards of an opened base page: the page drawing with its areas and the base area frames,
// area selection (merge/split) and the representative controls.

/**
 * @param {AreaEntry} ar
 * @param {number} idx
 * @returns {string}
 */
function areaTip(ar, idx) {
    const name = areaLabel(ar) || `area_${idx}`;
    return `${name}\nw ${ar.w}mm · h ${ar.h}mm · x ${ar.x}mm · y ${ar.y}mm`
        + (ar.flowToNextPage ? " · [↓]" : "")
        + (ar.interactiveFlowName ? ` · flow:${ar.interactiveFlowName}` : "");
}

/**
 * Draws a page: its areas and, as red frames, the base areas of its base page (on the
 * representative they are made from its own areas, on other pages they are laid over them).
 * @param {PageEntry} page
 * @param {BaseAreaModel[]} baseAreas
 * @param {(number|null)[]} baseAreaByArea index of the base area each area of the page maps to
 * @param {boolean} isRepresentative the page defines its base page's areas
 * @param {Set<number>} selectedAreas indices of the selected areas, drawn highlighted
 * @param {((areaIndex: number|null, additive: boolean) => void)|null} onAreaClick called with null
 *   for clicks outside areas; null when the areas cannot be selected
 * @returns {SVGElement|null}
 */
function buildPageSvg(page, baseAreas, baseAreaByArea, isRepresentative, selectedAreas, onAreaClick) {
    const areas = page.areas;
    if (!areas.length) return null;

    const maxX2 = Math.max(...areas.map(a => a.x + a.w), ...baseAreas.map(b => b.position.x + b.position.w));
    const maxY2 = Math.max(...areas.map(a => a.y + a.h), ...baseAreas.map(b => b.position.y + b.position.h));
    const scale = (settings.canvasW - 2 * PAD) / Math.max(maxX2, 210);
    const svgH = Math.ceil(maxY2 * scale + 2 * PAD);
    const svg = svgEl("svg", {width: settings.canvasW, height: svgH, class: "page-svg" + (onAreaClick ? " selectable" : "")});
    svg.appendChild(svgTitle(pageCardTooltip(page)));
    if (onAreaClick) {
        // Clicks on an area select it; clicks anywhere else on the drawing clear the selection.
        svg.addEventListener("click", e => {
            const target = /** @type {Element} */ (e.target);
            const areaIndex = target.getAttribute("data-area-index");
            onAreaClick(areaIndex == null ? null : Number(areaIndex), e.ctrlKey || e.metaKey || e.shiftKey);
        });
    }

    /** @param {number} baseIndex */
    const baseAreaTip = baseIndex => {
        const {flowName, position: p} = baseAreas[baseIndex];
        return `Base area ${flowName}\nw ${p.w}mm · h ${p.h}mm · x ${p.x}mm · y ${p.y}mm`;
    };

    /** @param {number|null|undefined} baseIndex */
    const baseAreaColor = baseIndex => baseIndex == null ? NO_BASE_AREA_COLOR : BASE_AREA_COLORS[baseIndex % BASE_AREA_COLORS.length];

    baseAreas.forEach((baseArea, baseIndex) => {
        const p = baseArea.position;
        const color = baseAreaColor(baseIndex);
        // The frame stands a little outside the areas, so it does not coincide with their borders;
        // towards a neighbouring base area it stands at most halfway, so the two frames do not cross.
        const gap = frameGaps(baseAreas, baseIndex, scale);
        const gx = svgPos(p.x, scale) - gap.left, gy = svgPos(p.y, scale) - gap.top,
            gw = svgDim(p.w, scale) + gap.left + gap.right, gh = svgDim(p.h, scale) + gap.top + gap.bottom;

        const bg = svgEl("rect", {
            x: gx, y: gy, width: gw, height: gh,
            fill: "transparent", stroke: "none", "pointer-events": "all"
        });
        bg.appendChild(svgTitle(baseAreaTip(baseIndex)));
        svg.appendChild(bg);

        const border = svgEl("rect", {
            x: gx, y: gy, width: gw, height: gh, rx: 3,
            fill: "none", stroke: color, "stroke-width": 1.3, "stroke-dasharray": "5,3",
            "pointer-events": "none"
        });
        svg.appendChild(border);

        // The label goes above the frame; when another base area is right above, there is no room
        // there, so it goes inside the frame's top-right corner (the area's own label is top-left).
        const labelInside = gap.top < FRAME_GAP;
        const label = svgEl("text", {
            x: labelInside ? gx + gw - 3 : gx + 2, y: labelInside ? gy + 9 : gy - 2,
            "text-anchor": labelInside ? "end" : "start",
            "font-size": 7, fill: color, "font-weight": "bold", "pointer-events": "none"
        });
        label.textContent = baseArea.flowName.length > 28 ? baseArea.flowName.slice(0, 28) : baseArea.flowName;
        svg.appendChild(label);
    });

    // Larger areas first, so smaller (often overlapping or nested) areas stay on top and clickable.
    const drawOrder = areas.map((_, i) => i).sort((m, n) => (areas[n].w * areas[n].h) - (areas[m].w * areas[m].h));
    drawOrder.forEach(i => {
        const a = areas[i];
        const color = baseAreaColor(baseAreaByArea[i]);
        const isSelected = selectedAreas.has(i);
        const isRoot = a.containedIn == null;
        const rx = svgPos(a.x, scale), ry = svgPos(a.y, scale),
            rw = svgDim(a.w, scale), rh = svgDim(a.h, scale);

        const overlapping = areas
            .map((o, oi) => ({o, oi}))
            .filter(({o, oi}) => oi !== i
                && o.x < a.x + a.w && o.x + o.w > a.x
                && o.y < a.y + a.h && o.y + o.h > a.y)
            .sort((m, n) => (m.o.w * m.o.h) - (n.o.w * n.o.h));

        const baseIndex = baseAreaByArea[i];
        const baseLine = baseIndex != null ? (isRepresentative ? "" : "Goes to: ") + baseAreaTip(baseIndex) + "\n\n" : "";
        const tip = baseLine + [areaTip(a, i), ...overlapping.map(({o, oi}) => areaTip(o, oi))].join("\n\n");

        const rect = svgEl("rect", {
            x: rx, y: ry, width: rw, height: rh,
            fill: color, "fill-opacity": "0.25", stroke: color,
            "stroke-width": isRoot ? "1.2" : "1",
            "stroke-dasharray": isRoot ? "none" : "3,2",
            class: "area-rect",
            "data-area-index": i,
        });
        rect.appendChild(svgTitle(tip + (onAreaClick ? "\n\nClick to select, Ctrl/Shift+click to add to or remove from the selection." : "")));
        svg.appendChild(rect);
        if (isSelected) drawSelectionMark(svg, rx, ry, rw, rh);

        if (rw > 12 && rh > 8) {
            const name = areaLabel(a) || `area_${i}`;
            const txt = svgEl("text", {x: rx + 2, y: ry + 9, "font-size": 6.5, fill: "#222", "pointer-events": "none"});
            txt.textContent = name.length > 28 ? name.slice(-28) : name;
            svg.appendChild(txt);
        }
    });

    return svg;
}

/**
 * How far (px) a base area's frame stands outside its areas on each side: FRAME_GAP, but at most
 * half the distance to a neighbouring base area on that side, so adjacent frames meet instead of
 * crossing. Base areas that overlap the frame's area do not limit it.
 * @param {BaseAreaModel[]} baseAreas
 * @param {number} baseIndex
 * @param {number} scale px per mm
 * @returns {{top: number, right: number, bottom: number, left: number}}
 */
function frameGaps(baseAreas, baseIndex, scale) {
    const gap = {top: FRAME_GAP, right: FRAME_GAP, bottom: FRAME_GAP, left: FRAME_GAP};
    const a = baseAreas[baseIndex].position;
    baseAreas.forEach((other, otherIndex) => {
        if (otherIndex === baseIndex) return;
        const b = other.position;
        const overlapsX = b.x < a.x + a.w && b.x + b.w > a.x;
        const overlapsY = b.y < a.y + a.h && b.y + b.h > a.y;
        if (overlapsX && overlapsY) return;
        /** @param {number} distanceMm */
        const half = distanceMm => Math.max(0, distanceMm * scale / 2);
        if (overlapsX && b.y + b.h <= a.y) gap.top = Math.min(gap.top, half(a.y - (b.y + b.h)));
        if (overlapsX && b.y >= a.y + a.h) gap.bottom = Math.min(gap.bottom, half(b.y - (a.y + a.h)));
        if (overlapsY && b.x + b.w <= a.x) gap.left = Math.min(gap.left, half(a.x - (b.x + b.w)));
        if (overlapsY && b.x >= a.x + a.w) gap.right = Math.min(gap.right, half(b.x - (a.x + a.w)));
    });
    return gap;
}

/**
 * Marks a selected area: a blue halo just outside its border and a check badge in its bottom-right
 * corner. The area keeps its own colors, so it stays recognizable.
 * @param {SVGElement} svg
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 */
function drawSelectionMark(svg, x, y, w, h) {
    const color = "#2f7de1";
    svg.appendChild(svgEl("rect", {
        x: x - 2, y: y - 2, width: w + 4, height: h + 4, rx: 3,
        fill: "none", stroke: color, "stroke-width": 2, "pointer-events": "none",
    }));
    const cx = x + w - 5, cy = y + h - 5;
    svg.appendChild(svgEl("circle", {cx, cy, r: 4.5, fill: color, stroke: "#fff", "stroke-width": 1, "pointer-events": "none"}));
    svg.appendChild(svgEl("path", {
        d: `M ${cx - 2.2} ${cy} L ${cx - 0.6} ${cy + 1.6} L ${cx + 2.2} ${cy - 1.6}`,
        fill: "none", stroke: "#fff", "stroke-width": 1.3, "stroke-linecap": "round", "stroke-linejoin": "round",
        "pointer-events": "none",
    }));
}

/**
 * The representative control of a page card. It lives in the card header, apart from the page
 * drawing, which is reserved for working with areas.
 * @param {BaseTemplatePageModel} basePage
 * @param {number} pageIndex
 * @returns {HTMLButtonElement}
 */
function buildRepresentativeButton(basePage, pageIndex) {
    const isRepresentative = basePage.representativePageIndex === pageIndex;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "rep-btn" + (isRepresentative ? " active" : "");
    button.textContent = isRepresentative ? "★" : "☆";
    if (isRepresentative && basePage.representativeIsManual) {
        button.classList.add("manual");
        button.title = "Representative page, chosen manually: its areas define the base page.\nClick to go back to the computed representative.";
    } else if (isRepresentative) {
        button.title = "Representative page: its areas define the base page.\nComputed as the page most similar to the others.\n"
            + "Click to keep it as the representative even when the computation changes.";
    } else {
        button.title = "Make this page the representative: its areas will define the base page.";
    }
    button.addEventListener("click", () => setRepresentative(basePage, pageIndex));
    return button;
}

/**
 * @param {number} pageIndex
 * @returns {HTMLElement}
 */
function buildPageCard(pageIndex) {
    const page = currentData.pages[pageIndex];
    const wrap = document.createElement("div");
    wrap.className = "page-card";
    wrap.dataset.pageIndex = String(pageIndex);
    // The card is as wide as its drawing; the header shortens the page name to fit.
    wrap.style.width = `${settings.canvasW + 2}px`;

    const header = document.createElement("div");
    header.className = "page-card-title";
    const title = document.createElement("span");
    title.className = "page-card-name";
    title.title = pageCardTooltip(page);
    title.appendChild(document.createTextNode(pageName(page)));
    header.appendChild(title);

    const base = currentBasePageByPage.get(pageIndex);
    const isRepresentative = base?.basePage.representativePageIndex === pageIndex;
    if (base) {
        const score = similarityToRepresentative(pageIndex);
        if (score != null) {
            const hint = document.createElement("span");
            hint.className = "hint";
            hint.title = "Similarity to the representative page";
            hint.textContent = score.toFixed(2);
            header.appendChild(hint);
        }
        header.appendChild(buildRepresentativeButton(base.basePage, pageIndex));
        if (isRepresentative) wrap.classList.add("representative");
    }
    wrap.appendChild(header);

    // Only the representative's areas can be merged or split: its area groups define the base
    // areas, the other pages' areas just go to the base area they lie in.
    const selectedAreas = isRepresentative && uiState.areaSelection?.pageIndex === pageIndex
        ? uiState.areaSelection.areaIndices
        : new Set();
    const svg = buildPageSvg(
        page,
        base?.basePage.areas ?? [],
        base?.basePage.baseAreaByArea.get(pageIndex) ?? [],
        isRepresentative,
        selectedAreas,
        isRepresentative ? (areaIndex, additive) => selectArea(pageIndex, areaIndex, additive) : null,
    );
    if (svg) wrap.appendChild(svg);
    wrap.appendChild(isRepresentative ? buildAreaActions(pageIndex, selectedAreas) : buildFollowerFooter(pageIndex));
    return wrap;
}

/**
 * Footer of a page that is not the representative: its areas cannot be edited, they go to the
 * base area they lie in. Area edits made while it was the representative are kept but not used;
 * they can be discarded here. Same height as the representative's action bar, so cards line up.
 * @param {number} pageIndex
 * @returns {HTMLElement}
 */
function buildFollowerFooter(pageIndex) {
    const footer = document.createElement("div");
    footer.className = "card-footer";
    const info = document.createElement("span");
    info.className = "hint";
    const hasEdits = decisions.areaGroupsByPage.has(renderUnitKey(currentData.pages[pageIndex], pageIndex));
    info.textContent = hasEdits ? "Area edits kept, not used" : "Areas follow the ★ page";
    info.title = hasEdits
        ? "You merged or split areas of this page while it was the representative. They apply again when it becomes the representative."
        : "Each area goes to the base area (dashed frame) it lies in. Merge and split areas on the representative page.";
    footer.appendChild(info);
    if (hasEdits) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Reset";
        button.title = "Discard the merges and splits of this page.";
        button.addEventListener("click", () => resetAreaGroups(pageIndex));
        footer.appendChild(button);
    }
    return footer;
}

/**
 * The merge/split bar of the representative page card. Always shown with the same buttons, which
 * are enabled when they apply, so selecting areas does not move anything.
 * @param {number} pageIndex
 * @param {Set<number>} selectedAreas
 * @returns {HTMLElement}
 */
function buildAreaActions(pageIndex, selectedAreas) {
    const page = currentData.pages[pageIndex];
    const isEdited = decisions.areaGroupsByPage.has(renderUnitKey(page, pageIndex));

    const bar = document.createElement("div");
    bar.className = "card-footer";
    const {canMerge, canSplit} = describeAreaSelection(currentAreaDrafts[pageIndex] ?? [], selectedAreas);

    /**
     * @param {string} label
     * @param {string} title
     * @param {boolean} enabled
     * @param {() => void} onClick
     */
    const addButton = (label, title, enabled, onClick) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.title = title;
        button.disabled = !enabled;
        button.addEventListener("click", onClick);
        bar.appendChild(button);
    };

    const info = document.createElement("span");
    info.className = "hint";
    info.textContent = selectedAreas.size ? `${selectedAreas.size} selected` : isEdited ? "edited" : "select areas";
    info.title = "Click an area to select it, Ctrl/Shift+click to select more, then merge or split them. Click outside the areas or press Esc to clear the selection.";
    bar.appendChild(info);

    addButton("Merge", "Join the selected areas (with the rest of their base areas) into one base area.\nSelect areas of at least two base areas.",
        canMerge, () => editAreaGroups(pageIndex, "merge"));
    addButton("Split", "Give each selected area a base area of its own.\nSelect an area that shares its base area with others.",
        canSplit, () => editAreaGroups(pageIndex, "split"));
    addButton("Reset", "Discard the merges and splits of this page and use the computed grouping again.",
        isEdited, () => resetAreaGroups(pageIndex));
    return bar;
}

/**
 * Updates the area selection after a click on a page drawing: a plain click selects only that
 * area (or clears the selection when it was the only one selected), a Ctrl/Shift click adds the
 * area to the selection or removes it, a click outside areas clears the selection. Selecting on
 * another page starts a new selection.
 * @param {number} pageIndex
 * @param {number|null} areaIndex
 * @param {boolean} additive
 */
function selectArea(pageIndex, areaIndex, additive) {
    const current = uiState.areaSelection?.pageIndex === pageIndex ? uiState.areaSelection.areaIndices : new Set();
    /** @type {Set<number>} */
    let next;
    if (areaIndex == null) {
        next = new Set();
    } else if (additive) {
        next = new Set(current);
        if (next.has(areaIndex)) next.delete(areaIndex); else next.add(areaIndex);
    } else {
        next = current.size === 1 && current.has(areaIndex) ? new Set() : new Set([areaIndex]);
    }
    const hadSelection = uiState.areaSelection != null;
    uiState.areaSelection = next.size ? {pageIndex, areaIndices: next} : null;
    if (hadSelection || uiState.areaSelection) {
        refreshOpenPageGroups();
        renderInspector();
    }
}

/**
 * @param {HTMLElement} rowEl
 */
function togglePageCards(rowEl) {
    const pageGroupEl = /** @type {HTMLElement} */ (rowEl.closest(".page-group"));
    const preview = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-cards"));
    setPageGroupOpen(pageGroupEl, !preview.classList.contains("open"));
}

/**
 * Populates a .pg-cards container with page card elements.
 * @param {HTMLElement} preview
 * @param {number[]} indices
 */
function buildPageCards(preview, indices) {
    preview.innerHTML = "";
    indices.forEach(pi => {
        preview.appendChild(buildPageCard(pi));
    });
}

/**
 * @param {Set<string>} keys
 * @returns {void}
 */
function reopenPageGroups(keys) {
    document.querySelectorAll(".page-group").forEach(pgEl => {
        const groupEl = /** @type {HTMLElement} */ (pgEl);
        const key = groupEl.dataset.pageGroupKey ?? "";
        if (!keys.has(key)) return;
        if (!groupEl.querySelector(".pg-cards.open")) setPageGroupOpen(groupEl, true);
    });
}

/**
 * @param {HTMLElement} pageGroupEl
 * @returns {number[]}
 */
function pageGroupIndices(pageGroupEl) {
    if (!currentViewModel) return [];
    const key = pageGroupEl.dataset.pageGroupKey ?? "";
    return currentViewModel.pageGroupByKey[key]?.pageIndices ?? [];
}

/**
 * @returns {void}
 */
function refreshOpenPageGroups() {
    uiState.openPageGroups.forEach(key => refreshOpenPageCardsByKey(key));
}

/**
 * @param {string} key
 * @returns {void}
 */
function refreshOpenPageCardsByKey(key) {
    if (!currentViewModel) return;
    const indices = currentViewModel.pageGroupByKey[key]?.pageIndices;
    if (!indices) return;
    document.querySelectorAll(".page-group").forEach(pgEl => {
        const groupEl = /** @type {HTMLElement} */ (pgEl);
        if ((groupEl.dataset.pageGroupKey ?? "") !== key) return;
        const preview = /** @type {HTMLElement|null} */ (groupEl.querySelector(".pg-cards.open"));
        if (preview) buildPageCards(preview, indices);
    });
}

/**
 * @param {HTMLElement} pageGroupEl
 * @param {boolean} open
 * @returns {void}
 */
function setPageGroupOpen(pageGroupEl, open) {
    const preview = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-cards"));
    const icon = /** @type {HTMLElement} */ (pageGroupEl.querySelector(".pg-expand-icon"));
    const key = pageGroupEl.dataset.pageGroupKey ?? "";
    const indices = pageGroupIndices(pageGroupEl);

    preview.classList.toggle("open", open);
    if (open) uiState.openPageGroups.add(key);
    else uiState.openPageGroups.delete(key);
    icon.textContent = open ? "▼" : "▶";

    if (open) buildPageCards(preview, indices);
}

/**
 * @param {string} tag
 * @param {Record<string, string|number>} attrs
 * @returns {SVGElement}
 */
function svgEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, String(v)));
    return el;
}

/**
 * @param {string} text
 * @returns {SVGTitleElement}
 */
function svgTitle(text) {
    const title = /** @type {SVGTitleElement} */ (document.createElementNS("http://www.w3.org/2000/svg", "title"));
    title.textContent = text;
    return title;
}

/**
 * @param {number} mm
 * @param {number} scale
 * @returns {number}
 */
function svgPos(mm, scale) {
    return Math.round((mm * scale + PAD) * 10) / 10;
}

/**
 * @param {number} mm
 * @param {number} scale
 * @returns {number}
 */
function svgDim(mm, scale) {
    return Math.round(mm * scale * 10) / 10;
}

/**
 * Label for an area: its name when available, otherwise the first content preview chunk.
 * @param {AreaEntry} area
 * @returns {string}
 */
function areaLabel(area) {
    if (area.areaName) return area.areaName.slice(0, 40);
    const preview = area.contentPreview;
    if (!preview) return "";
    const firstChunk = preview.split(";")[0];
    return firstChunk.slice(0, 40);
}

// ─── 13. Inspector ───────────────────────────────────────────────────────────────────────────────
//
// A panel showing the properties of what is selected: the areas selected on a representative page
// (their base area), else the base template or base page whose name was clicked. Editable fields
// show the proposed value as placeholder; an edited value is a decision with a reset next to it.

/** @param {boolean} hidden */
function setInspectorHidden(hidden) {
    document.body.classList.toggle("inspector-hidden", hidden);
    toggleInspectorBtn.classList.toggle("active", !hidden);
    try { localStorage.setItem(INSPECTOR_HIDDEN_KEY, hidden ? "1" : ""); } catch { /* storage unavailable */ }
}

/**
 * Shows a base template or base page in the inspector (clearing the area selection) and opens
 * the inspector if it was hidden.
 * @param {"template"|"page"} kind
 * @param {string} key template group key or page group key
 */
function inspectItem(kind, key) {
    uiState.inspected = {kind, key};
    if (uiState.areaSelection) {
        uiState.areaSelection = null;
        refreshOpenPageGroups();
    }
    if (document.body.classList.contains("inspector-hidden")) setInspectorHidden(false);
    if (currentData) renderTemplateGroups(currentData);
    reopenPageGroups(uiState.openPageGroups);
    renderInspector();
}

/**
 * An editable text field. Enter or leaving the field applies the value, Esc restores it. An empty
 * value, or the proposed one, removes the user's value.
 * @param {string} label
 * @param {{value: string, proposed: string, edited: boolean, disabled?: boolean, onChange: (value: string) => void}} options
 * @returns {HTMLElement}
 */
function inspectorTextField(label, {value, proposed, edited, disabled = false, onChange}) {
    const row = document.createElement("label");
    row.className = "insp-row insp-field";
    const labelEl = document.createElement("span");
    labelEl.className = "insp-label";
    labelEl.textContent = label;
    const input = document.createElement("input");
    input.type = "text";
    input.value = value;
    input.placeholder = proposed;
    input.disabled = disabled;
    input.classList.toggle("edited", edited);
    input.title = edited ? `Set by you. Proposed: ${proposed}` : "Proposed value; type to change it.";
    input.addEventListener("keydown", e => {
        e.stopPropagation();
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { input.value = value; input.blur(); }
    });
    // Editing starts from the proposed value rather than an empty field.
    input.addEventListener("focus", () => {
        if (!input.value) { input.value = proposed; input.select(); }
    });
    input.addEventListener("change", () => {
        const next = input.value.trim();
        if (next === value || (!edited && next === proposed)) { input.value = value; return; }
        onChange(next);
    });
    input.addEventListener("blur", () => { if (!edited && input.value.trim() === proposed) input.value = ""; });
    row.append(labelEl, input);
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "icon-btn insp-reset";
    reset.textContent = "↺";
    reset.title = `Back to the proposed value: ${proposed}`;
    reset.disabled = !edited || disabled;
    reset.addEventListener("click", e => { e.preventDefault(); onChange(""); });
    row.appendChild(reset);
    return row;
}

/**
 * A checkbox. Changed from the proposal, it is highlighted; clicking it again goes back.
 * @param {string} label
 * @param {boolean} checked
 * @param {boolean} edited
 * @param {(checked: boolean) => void} onChange
 * @returns {HTMLElement}
 */
function inspectorCheck(label, checked, edited, onChange) {
    const row = document.createElement("label");
    row.className = "insp-check" + (edited ? " edited" : "");
    row.title = edited ? "Set by you; click again to go back to the proposal." : "Proposed from the areas of the representative page.";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = checked;
    input.addEventListener("change", () => onChange(input.checked));
    row.append(input, document.createTextNode(label));
    return row;
}

/**
 * @param {HTMLElement[]} checks
 * @returns {HTMLElement}
 */
function inspectorChecks(checks) {
    const block = document.createElement("div");
    block.className = "insp-checks";
    block.append(...checks);
    return block;
}

/**
 * @param {string} kind
 * @returns {HTMLElement}
 */
function inspectorKind(kind) {
    const el = document.createElement("div");
    el.className = "insp-kind";
    el.textContent = kind;
    return el;
}

/**
 * x, y, width and height of a base area in mm, as one decision: editing a value sets the whole
 * position, the reset goes back to the bounding box of its areas.
 * @param {BaseAreaModel} area
 * @returns {HTMLElement}
 */
function inspectorPositionFields(area) {
    const block = document.createElement("div");
    block.className = "insp-position";
    const head = document.createElement("div");
    head.className = "insp-position-head";
    const label = document.createElement("span");
    label.className = "insp-label";
    label.textContent = "Position (mm)";
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "icon-btn insp-reset";
    reset.textContent = "↺";
    reset.title = `Back to the bounding box of its areas: ${formatPosition(area.proposedPosition)}`;
    reset.disabled = !area.positionEdited;
    reset.addEventListener("click", () => setBaseAreaPosition(area, null));
    head.append(label, reset);
    const grid = document.createElement("div");
    grid.className = "insp-position-grid";
    /** @type {[keyof Position, string][]} */
    const sides = [["x", "X"], ["y", "Y"], ["w", "Width"], ["h", "Height"]];
    sides.forEach(([side, name]) => {
        const field = document.createElement("label");
        field.className = "insp-number";
        const caption = document.createElement("span");
        caption.textContent = name;
        const input = document.createElement("input");
        input.type = "number";
        input.step = "0.1";
        input.min = "0";
        input.value = formatMm(area.position[side]);
        input.classList.toggle("edited", area.positionEdited);
        input.title = area.positionEdited ? `Set by you. Bounding box of its areas: ${formatMm(area.proposedPosition[side])}` : "Bounding box of its areas; type to change it.";
        input.addEventListener("keydown", e => {
            e.stopPropagation();
            if (e.key === "Enter") input.blur();
            if (e.key === "Escape") { input.value = formatMm(area.position[side]); input.blur(); }
        });
        input.addEventListener("change", () => {
            const value = Number(input.value);
            if (input.value.trim() === "" || !Number.isFinite(value) || value < 0 || ((side === "w" || side === "h") && value === 0)) {
                setStatus(`${name} must be ${side === "w" || side === "h" ? "greater than 0" : "0 or more"} mm.`, "error");
                input.value = formatMm(area.position[side]);
                return;
            }
            setBaseAreaPosition(area, {...area.position, [side]: roundTo(value, 2)});
        });
        field.append(caption, input);
        grid.appendChild(field);
    });
    block.append(head, grid);
    return block;
}

/** @param {Position} position */
function formatPosition(position) {
    return `x ${formatMm(position.x)}, y ${formatMm(position.y)} · ${formatMm(position.w)} × ${formatMm(position.h)} mm`;
}

function renderInspector() {
    inspectorEl.innerHTML = "";

    if (currentData && uiState.areaSelection) {
        renderAreaInspector(uiState.areaSelection.pageIndex, uiState.areaSelection.areaIndices);
        return;
    }
    const inspected = uiState.inspected;
    const baseTemplate = inspected && currentBaseTemplates.find(bt => inspected.kind === "template"
        ? bt.templateGroupKey === inspected.key
